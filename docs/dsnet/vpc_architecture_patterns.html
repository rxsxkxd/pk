<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPC 構成パターン概念図</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#3d444d;--res:#ffffff;--resb:#59636e;
--pub:#e9f6ec;--pubb:#2f8a47;--app:#e8f1fd;--appb:#2563b8;--db:#f1ecfb;--dbb:#6a46b8;
--vpc:#8a63d2;--az:#8c959f;--sg:#c93c37;--s3:#e9f6ec;--s3b:#3b7d23;--gw:#fff4e5;--gwb:#b8630f;
--vpce:#e6f7f7;--vpceb:#137d80;--ext:#f3f4f6;--egress:#8c959f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181d;--fg:#e6e9ee;--muted:#9aa4af;
--line:#c9d1d9;--res:#1e232a;--resb:#8b949e;--pub:#15291b;--pubb:#4fb46b;--app:#14233a;--appb:#5b9be8;
--db:#221b33;--dbb:#a283e6;--vpc:#a283e6;--az:#6e7781;--sg:#ef6b66;--s3:#16281a;--s3b:#6cbf4f;
--gw:#2d2210;--gwb:#e39a4a;--vpce:#10292a;--vpceb:#4cc3c6;--ext:#22272e;--egress:#6e7781}}
:root[data-theme="dark"]{--bg:#15181d;--fg:#e6e9ee;--muted:#9aa4af;--line:#c9d1d9;--res:#1e232a;--resb:#8b949e;
--pub:#15291b;--pubb:#4fb46b;--app:#14233a;--appb:#5b9be8;--db:#221b33;--dbb:#a283e6;--vpc:#a283e6;
--az:#6e7781;--sg:#ef6b66;--s3:#16281a;--s3b:#6cbf4f;--gw:#2d2210;--gwb:#e39a4a;--vpce:#10292a;
--vpceb:#4cc3c6;--ext:#22272e;--egress:#6e7781}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:1040px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:40px 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:12px;border-radius:3px;border:1.5px solid}
figure{margin:0}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-size:13px}
svg .ts{fill:var(--muted);font-size:11px}
svg .lbl{fill:var(--muted);font-size:11px}
svg .st{font-size:12px;font-weight:600}
svg .pubt{fill:var(--pubb)} svg .appt{fill:var(--appb)} svg .dbt{fill:var(--dbb)}
svg .vt{fill:var(--vpc);font-weight:700}
svg .azt{fill:var(--az);font-size:12px;font-weight:600}
svg .grpt{fill:var(--dbb);font-size:11px}
svg .sgt{fill:#fff;font-size:10px;font-weight:700}
.vpc{fill:none;stroke:var(--vpc);stroke-width:2}
.az{fill:none;stroke:var(--az);stroke-width:1.2;stroke-dasharray:6 4}
.pub{fill:var(--pub);stroke:var(--pubb);stroke-width:1.2}
.app{fill:var(--app);stroke:var(--appb);stroke-width:1.2}
.db{fill:var(--db);stroke:var(--dbb);stroke-width:1.2}
.grp{fill:none;stroke:var(--dbb);stroke-width:1;stroke-dasharray:2 3}
.opt{stroke-dasharray:5 4;opacity:.75}
.res{fill:var(--res);stroke:var(--resb);stroke-width:1.2}
.rds{fill:var(--res);stroke:var(--dbb);stroke-width:1.5}
.ext{fill:var(--ext);stroke:var(--resb);stroke-width:1}
.s3{fill:var(--s3);stroke:var(--s3b);stroke-width:1.5}
.gw{fill:var(--gw);stroke:var(--gwb);stroke-width:1.2}
.vpce{fill:var(--vpce);stroke:var(--vpceb);stroke-width:1.2}
.sg{fill:var(--sg)}
.flow{fill:none;stroke:var(--line);stroke-width:1.6}
.egress{fill:none;stroke:var(--egress);stroke-width:1.2;stroke-dasharray:4 3}
.sync{fill:none;stroke:var(--dbb);stroke-width:1.4;stroke-dasharray:3 3}
#ah path{fill:var(--line)} #ah2 path{fill:var(--egress)}
</style>
</head>

<h1>VPC 構成パターン概念図</h1>
<p class="sub">EC2 / ECS（Fargate）/ VPC 内 Lambda。フロント・RDS・S3 を含む概念図</p>
<ul class="legend">
<li><span class="sw" style="background:var(--pub);border-color:var(--pubb)"></span>Public subnet</li>
<li><span class="sw" style="background:var(--app);border-color:var(--appb)"></span>Private app subnet</li>
<li><span class="sw" style="background:var(--db);border-color:var(--dbb)"></span>Private DB subnet</li>
<li><span class="sw" style="border-style:dashed;border-color:var(--az)"></span>AZ</li>
<li><span class="sw" style="background:var(--sg);border-color:var(--sg)"></span>SG（リソース単位）</li>
<li>RT / NACL：サブネット単位のルートテーブルと NACL</li>
<li>実線矢印：主な通信　点線矢印：NAT GW 経由の外向き通信</li>
</ul>
