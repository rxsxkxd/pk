# パイプライン用スタック。ソース取得 → ビルド → 承認（省略可）→ S3 へのデプロイ。
# バケットは別スタックのものを使い、このスタックでは作成しない。
AWSTemplateFormatVersion: '2010-09-09'
Description: Port-guard rule refresh. Git source, make, optional approval, publish. No buckets.

# スタック作成・更新時に外から指定する値。
Parameters:
  # 個別許可の一覧、S3 の保存先、リソース名に使う環境名。
  EnvironmentName:
    Type: String
    AllowedValues: [development, staging, production]
  # バケット用スタックが出力する、中間成果物用バケットの完全名。
  PipelineBucketName:
    Type: String
    Description: PipelineBucketName output of the bucket stack (same account and region).
  # バケット用スタックが出力する、ルール配布先バケットの完全名。
  PublishBucketName:
    Type: String
    Description: PublishBucketName output of the bucket stack (SSE-S3).
  # 認可済みで利用可能な、同じリージョンの CodeConnections 接続 ARN。
  ConnectionArn:
    Type: String
    Description: Existing AVAILABLE CodeConnections connection ARN in this region.
  # ソースを取得する所有者とリポジトリ名。実際の大文字・小文字に合わせる。
  FullRepositoryId:
    Type: String
    Description: Repository owner/name, with the original case.
  # 取得するブランチ。省略時は main。
  BranchName:
    Type: String
    Default: main
  # リポジトリ内のプロジェクトの相対パス。リポジトリ直下なら「.」。
  SourceDirectory:
    Type: String
    Default: '.'
    Description: Project directory relative to the repository root.
  # true ならビルド後に人の確認を挟み、false ならそのままデプロイへ進む。
  RequireApproval:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  # ビルドとデプロイの実行ログを保存する日数。
  LogRetentionInDays:
    Type: Number
    Default: 90

# 承認ステージを入れるかを、デプロイ時のパラメータで切り替える。
Conditions:
  UseApproval: !Equals [!Ref RequireApproval, 'true']

# このスタックが作成・管理する AWS リソース。バケットは別スタックを参照する。
Resources:
  # 2つの CodeBuild が共用するロググループ。ストリームは make と publish で分ける。
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # 環境ごとにロググループを分ける。
      LogGroupName: !Sub /aws/codebuild/port-guard-list-refresh-${EnvironmentName}
      # 指定した日数を超えたログを削除する。
      RetentionInDays: !Ref LogRetentionInDays

  # 一覧を作る CodeBuild のロール。中間成果物には書けるが、ルール配布先には書けない。
  MakeRole:
    Type: AWS::IAM::Role
    Properties:
      # このロールを引き受けられるサービスを指定する信頼ポリシー。
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            # CodeBuild サービスが、以下の権限で処理を実行する。
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      # 実行できる AWS 操作と対象リソースを、ロールに直接付けるポリシーで定義する。
      Policies:
        - PolicyName: make
          # Action は許可する操作、Resource はその操作を許可する範囲。
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # この環境のロググループへ実行ログを書き込む。
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogGroup.Arn
              # CodeBuild が成果物用バケットのリージョンと所有権設定を確認する。
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketAcl]
                Resource: !Sub arn:${AWS::Partition}:s3:::${PipelineBucketName}
              # ソースを読み取り、ビルド結果を次へ渡す中間成果物として保存する。
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${PipelineBucketName}/*
              # ルールの配布先は読むだけ。書けるのは PublishRole。
              # 配布先から前回分の一覧を取得する。書き込みは許可しない。
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${PublishBucketName}/port-guard/${EnvironmentName}/current/*
              # 前回分のファイル名を列挙する。権限はバケットに付け、下の条件でキーを絞る。
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${PublishBucketName}
                Condition:
                  StringLike:
                    # 一覧の列挙範囲を、この環境の current 配下だけに絞る。
                    s3:prefix: !Sub port-guard/${EnvironmentName}/current/*

  # S3 へ上げる CodeBuild のロール。この環境の配布先への書き込みを許可する。
  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      # このロールを引き受けられるサービスを指定する信頼ポリシー。
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            # CodeBuild サービスが、以下の権限で処理を実行する。
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      # 実行できる AWS 操作と対象リソースを、ロールに直接付けるポリシーで定義する。
      Policies:
        - PolicyName: publish
          # Action は許可する操作、Resource はその操作を許可する範囲。
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # この環境のロググループへ実行ログを書き込む。
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogGroup.Arn
              # CodeBuild が成果物用バケットのリージョンと所有権設定を確認する。
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketAcl]
                Resource: !Sub arn:${AWS::Partition}:s3:::${PipelineBucketName}
              # 承認されたビルドの成果物を読む。中間成果物への書き込みは不要。
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub arn:${AWS::Partition}:s3:::${PipelineBucketName}/*
              # ルールと照合用ファイルを、この環境の current 配下だけにアップロードする。
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${PublishBucketName}/port-guard/${EnvironmentName}/current/*

  # 公開元の一覧を取得し、ローカルと同じ build-rules.sh でルールを作る CodeBuild。
  MakeProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub port-guard-list-refresh-${EnvironmentName}-make
      # 配布先に書き込めないビルド用ロールで AWS 操作を実行する。
      ServiceRole: !GetAtt MakeRole.Arn
      # 一覧取得やビルドが終わらない場合の実行時間の上限は15分。
      TimeoutInMinutes: 15
      # 成果物の保存と受け渡しは CodePipeline が管理する。
      Artifacts: {Type: CODEPIPELINE}
      # 実行ログを共通の CloudWatch Logs グループへ出す。
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
          # ビルド用ログのストリーム名の先頭を make にする。
          StreamName: make
      # bash・curl・awk・AWS CLI を動かすための CodeBuild 実行環境。
      Environment:
        # Linux のコンテナでシェルスクリプトを実行する。
        Type: LINUX_CONTAINER
        # 小さいコンピューティングタイプを使う。
        ComputeType: BUILD_GENERAL1_SMALL
        # Amazon Linux の標準ビルドイメージ 5.0 を使う。
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        # スクリプトに渡す値。AWS の認証には CodeBuild のロールを使い、profile は指定しない。
        EnvironmentVariables:
          # allow-lists/<環境>/ と work/<環境>/ に使う環境名。
          - {Name: ENVIRONMENT_NAME, Value: !Ref EnvironmentName}
          # リポジトリの中で、このプロジェクトが置かれている相対パス。
          - {Name: SOURCE_DIRECTORY, Value: !Ref SourceDirectory}
          # スタックに指定された配布先を直接渡し、バケット名の自動取得を省く。
          - Name: PORT_GUARD_S3_URI
            Value: !Sub s3://${PublishBucketName}/port-guard/${EnvironmentName}/current
          # 通常は増減 5% の判定で止める。開始時のパイプライン変数で1に上書きできる。
          - {Name: FORCE, Value: '0'}
      # 入力は Source ステージが Git から取得したソースの成果物。
      Source:
        Type: CODEPIPELINE
        # CodeBuild の実行手順。ここから下は、別の YAML 文書として解釈される。
        BuildSpec: |
          # コマンド間で同じシェルの状態を引き継ぐ buildspec 0.2 を使う。
          version: 0.2
          env:
            # ローカルの入口スクリプトと同じ bash で実行する。
            shell: bash
          # CodeBuild が順に実行する処理。今回は build フェーズにまとめる。
          phases:
            build:
              # 上から順に実行するシェルコマンド。
              commands:
                # プロジェクトがリポジトリの一部でも、入口のある場所へ移動して実行する。
                - cd "$CODEBUILD_SRC_DIR/$SOURCE_DIRECTORY"
                # 一覧と入れ替えスクリプトを作る。この段階では配布先 S3 に何も上げない。
                - bash build-rules.sh "$ENVIRONMENT_NAME"
          # 確認したビルド結果を後段へ渡す。デプロイ側で Git のソースを取り直さない。
          artifacts:
            # 成果物のルートをプロジェクト直下にそろえ、元の親フォルダは含めない。
            base-directory: "$SOURCE_DIRECTORY"
            # デプロイの入口・部品・作成済みファイルだけを成果物に含める。
            files:
              # ローカルと共通のデプロイの入口。
              - deploy-rules.sh
              # リージョン・プロファイルを AWS CLI に引き継ぐ部品。
              - command/aws-cli.sh
              # 配布先 URI を設定する部品。パイプラインでは渡された URI をそのまま使う。
              - command/set-s3-uri.sh
              # ファイルを上げ、最後に照合用の SHA256SUMS を上げる部品。
              - command/publish-refresh-scripts.sh
              # 今回作った IPv4・IPv6 の ipset 入れ替えスクリプト。
              - work/*/command/port_guard/refresh-*.sh
              # 今回のビルドで使用した個別許可の一覧の写し。
              - work/*/port_guard_whitelists/allow-*.txt
              # 次回の増減比較に使う、今回の一覧の記録。
              - work/*/port_guard_whitelists/last-refresh/*.txt

  # ビルドの成果物だけを受け取り、deploy-rules.sh で配布先 S3 に上げる CodeBuild。
  PublishProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub port-guard-list-refresh-${EnvironmentName}-publish
      # 配布先への書き込みを許可したデプロイ用ロールを使う。
      ServiceRole: !GetAtt PublishRole.Arn
      # デプロイ処理の実行時間の上限は10分。
      TimeoutInMinutes: 10
      # 成果物の保存と受け渡しは CodePipeline が管理する。
      Artifacts: {Type: CODEPIPELINE}
      # 実行ログを共通の CloudWatch Logs グループへ出す。
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
          # デプロイ用ログのストリーム名の先頭を publish にする。
          StreamName: publish
      # bash・curl・awk・AWS CLI を動かすための CodeBuild 実行環境。
      Environment:
        # Linux のコンテナでシェルスクリプトを実行する。
        Type: LINUX_CONTAINER
        # 小さいコンピューティングタイプを使う。
        ComputeType: BUILD_GENERAL1_SMALL
        # Amazon Linux の標準ビルドイメージ 5.0 を使う。
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        # スクリプトに渡す値。AWS の認証には CodeBuild のロールを使い、profile は指定しない。
        EnvironmentVariables:
          # allow-lists/<環境>/ と work/<環境>/ に使う環境名。
          - {Name: ENVIRONMENT_NAME, Value: !Ref EnvironmentName}
          # スタックに指定された配布先を直接渡し、バケット名の自動取得を省く。
          - Name: PORT_GUARD_S3_URI
            Value: !Sub s3://${PublishBucketName}/port-guard/${EnvironmentName}/current
      # 入力は Git のソースではなく、Make ステージが作った成果物。
      Source:
        Type: CODEPIPELINE
        # CodeBuild の実行手順。ここから下は、別の YAML 文書として解釈される。
        BuildSpec: |
          # コマンド間で同じシェルの状態を引き継ぐ buildspec 0.2 を使う。
          version: 0.2
          env:
            # ローカルの入口スクリプトと同じ bash で実行する。
            shell: bash
          # CodeBuild が順に実行する処理。今回は build フェーズにまとめる。
          phases:
            build:
              # 上から順に実行するシェルコマンド。
              commands:
                # 確認済みの work/<環境>/ を S3 に上げる。ルールは作り直さない。
                - bash deploy-rules.sh "$ENVIRONMENT_NAME"

  # ステージを進める CodePipeline 自身のロール。ルール配布先に直接書く権限は持たない。
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      # このロールを引き受けられるサービスを指定する信頼ポリシー。
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            # CodePipeline サービスが、ステージを進めるために使う。
            Principal: {Service: codepipeline.amazonaws.com}
            Action: sts:AssumeRole
      # 実行できる AWS 操作と対象リソースを、ロールに直接付けるポリシーで定義する。
      Policies:
        - PolicyName: pipeline
          # Action は許可する操作、Resource はその操作を許可する範囲。
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ステージ間の成果物を読み書きする。ACL の操作も成果物用バケット内だけ。
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:PutObjectAcl]
                Resource: !Sub arn:${AWS::Partition}:s3:::${PipelineBucketName}/*
              # 成果物用バケットの世代管理・リージョン・所有権設定などを確認する。
              - Effect: Allow
                Action: [s3:GetBucketVersioning, s3:GetBucketLocation, s3:GetBucketAcl, s3:ListBucket]
                Resource: !Sub arn:${AWS::Partition}:s3:::${PipelineBucketName}
              # このスタックの2つの CodeBuild だけを起動し、進行状況を取得する。
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: [!GetAtt MakeProject.Arn, !GetAtt PublishProject.Arn]
              # 指定した Git 接続だけを利用する。新旧両方のサービス名の権限を許可する。
              - Effect: Allow
                Action: [codeconnections:UseConnection, codestar-connections:UseConnection]
                Resource: !Ref ConnectionArn

  # 実行の全体をつなぐ本体。各ステージの入力と出力を成果物名で結ぶ。
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub port-guard-list-refresh-${EnvironmentName}
      # 開始時の変数と QUEUED の実行方式を使うため、V2 を指定する。
      PipelineType: V2
      # 同じパイプラインの同時実行は順番待ち。ローカル実行との排他ではない。
      ExecutionMode: QUEUED
      # 定義の更新では再実行しない。初回作成時の実行とは別の設定。
      RestartExecutionOnUpdate: false
      # Git 接続・成果物・CodeBuild の操作に使う、CodePipeline 自身のロール。
      RoleArn: !GetAtt PipelineRole.Arn
      # 中間成果物は別スタックの成果物用バケットへ保存する。
      ArtifactStore: {Type: S3, Location: !Ref PipelineBucketName}
      # パイプライン開始時に指定できる値。CodeBuild の環境変数へ渡す。
      Variables:
        # 増減 5% 超を確認して進めるときだけ1にする。通常は0。
        - Name: FORCE
          DefaultValue: '0'
          Description: Set 1 after reviewing a change above 5 percent.
      # ソース取得 → ビルド → 承認（省略可）→ デプロイの順に実行する。
      Stages:
        # 1. 指定した Git リポジトリ・ブランチから、同じ版のソース一式を取得する。
        - Name: Source
          Actions:
            - Name: Repository
              ActionTypeId: {Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: '1'}
              Configuration:
                # 事前に認可した CodeConnections 接続を使う。
                ConnectionArn: !Ref ConnectionArn
                # 取得先の所有者とリポジトリ名を、大文字・小文字も含めて指定する。
                FullRepositoryId: !Ref FullRepositoryId
                # このブランチのソースを取得する。
                BranchName: !Ref BranchName
                # push による自動開始を無効にし、運用者が手動で開始する。
                DetectChanges: 'false'
                # ソースの圧縮と受け渡しはサービスに任せる。独自のパッケージ作成は不要。
                OutputArtifactFormat: CODE_ZIP
              # 取得したソースを SourceFiles という成果物名で Make へ渡す。
              OutputArtifacts: [{Name: SourceFiles}]
        # 2. build-rules.sh を実行し、確認するルールとデプロイ用の部品を作る。
        - Name: Make
          Actions:
            - Name: BuildRules
              ActionTypeId: {Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1'}
              Configuration:
                # 一覧を作る側の CodeBuild を起動する。
                ProjectName: !Ref MakeProject
                # 開始時に指定した FORCE を、今回の CodeBuild の環境変数として渡す。
                EnvironmentVariables: '[{"name":"FORCE","value":"#{variables.FORCE}","type":"PLAINTEXT"}]'
              # Source ステージが取得したソース一式を入力にする。
              InputArtifacts: [{Name: SourceFiles}]
              # 作成したファイルを MadeFiles として保存し、承認後の Publish へ渡す。
              OutputArtifacts: [{Name: MadeFiles}]
        # 3. RequireApproval=true のときだけ、以下の Check ステージを挟む。
        - !If
          - UseApproval
          - Name: Check
            Actions:
              - Name: HumanCheck
                ActionTypeId: {Category: Approval, Owner: AWS, Provider: Manual, Version: '1'}
                Configuration:
                  # 承認画面に、ビルドログの件数と増減を確認するよう案内を表示する。
                  CustomData: Review counts and changes in the make build log before publishing.
          # 承認不要なら、Check ステージの定義ごと取り除く。
          - !Ref AWS::NoValue
        # 4. Make が作った成果物を、そのまま deploy-rules.sh で S3 に上げる。
        - Name: Publish
          Actions:
            - Name: DeployRules
              ActionTypeId: {Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1'}
              # 配布先への書き込み権限を持つデプロイ用 CodeBuild を使う。
              Configuration: {ProjectName: !Ref PublishProject}
              # 承認前に作成した結果を使う。Git からの再取得やルールの作り直しはしない。
              InputArtifacts: [{Name: MadeFiles}]

# 作成後に運用者が確認・実行に使う値。
Outputs:
  # 手動開始や実行状況の確認に使うパイプライン名。
  PipelineName:
    Value: !Ref Pipeline
  # この環境の配布先 S3 URI。ローカル実行で同じ場所を使うときにも参照できる。
  PublishLocation:
    Value: !Sub s3://${PublishBucketName}/port-guard/${EnvironmentName}/current
