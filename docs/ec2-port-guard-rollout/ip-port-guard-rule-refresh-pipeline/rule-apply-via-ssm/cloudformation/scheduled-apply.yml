# ルールの定期適用（環境ごとに 1 つのスタック）。
# 定期適用の関連付けを 2 つ（月曜・木曜の日本時間 11:00）、関連付けのロール、失敗の通知の規則（任意）を作る。
# 先に rule-apply-document.yml（ルールの適用ドキュメント）と rule-read-policy.yml（ルールの読み取りポリシー）が要る。
# 設計は ../scheduled-apply-design.md、手順は ../instance-setup.md。
AWSTemplateFormatVersion: '2010-09-09'
Description: Port-guard scheduled rule apply for one environment (State Manager associations on Monday and Thursday, and failure notification).

Parameters:
  # 環境の名前。ルールのデプロイ先 port-guard/<環境>/current と、関連付けの名前に使う。
  EnvironmentName:
    Type: String
    AllowedValues: [development, staging, production]
  # 環境のタグ。キーと値が合う台に流す。値が空なら環境の名前を使う（list_instances.rb と同じ既定）。
  TagKey:
    Type: String
    Default: Environment
  TagValue:
    Type: String
    Default: ''
  # ルールの適用ドキュメントの名前（rule-apply-document.yml の DocumentName）。
  DocumentName:
    Type: String
    Default: port-guard-apply-rules
  # ルールのデプロイ先バケットの名前の先頭部分。実際の名前は <先頭部分>-<アカウント ID>-<リージョン>-an。
  RuleDeployBucketNamePrefix:
    Type: String
    Default: ip-port-guard-rules
  # 1 なら refresh-ipv6.sh も流す（IPv6 も絞っている環境）。
  ApplyIpv6:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
  # 予定（UTC。関連付けの cron 式は曜日を 1 つしか書けないので、月曜と木曜で 2 つに分ける）。
  # 既定は UTC 2:00 ＝ 日本時間 11:00（ルールのデプロイ先へのデプロイ 9:00 の 2 時間後）。
  MondaySchedule:
    Type: String
    Default: cron(0 2 ? * MON *)
  ThursdaySchedule:
    Type: String
    Default: cron(0 2 ? * THU *)
  # 失敗した台を知らせる既存の SNS のトピックの ARN（親フォルダの CodePipeline の NotificationTopicArn と同じものを想定）。空なら通知しない。
  NotificationTopicArn:
    Type: String
    Default: ''

Conditions:
  TagValueIsEnvironment: !Equals [!Ref TagValue, '']
  NotifyFailures: !Not [!Equals [!Ref NotificationTopicArn, '']]

Resources:
  # 関連付けのロール。定期適用の関連付けが、適用対象サーバーにルールの適用ドキュメントを送るときに使う。
  # 信頼する相手は ssm.amazonaws.com、許すことは ssm:SendCommand だけ（AWS のドキュメント「Setup roles for AssociationDispatchAssumeRole」）。
  AssociationDispatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub port-guard-apply-rules-dispatch-${EnvironmentName}
      Description: !Sub State Manager dispatch role for the port-guard scheduled rule apply (${EnvironmentName})
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ssm.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-rule-apply-document
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # [変更] ルールの適用ドキュメントだけを、EC2 のインスタンスに送る。
              - Sid: SendRuleApplyDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${DocumentName}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*

  # 定期適用の関連付け（月曜の分）。全台に並列で流し、失敗した台があっても残りの台に流し続ける。
  MondayAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub port-guard-apply-rules-${EnvironmentName}-mon
      Name: !Ref DocumentName
      Targets:
        - Key: !Sub tag:${TagKey}
          Values: [!If [TagValueIsEnvironment, !Ref EnvironmentName, !Ref TagValue]]
      Parameters:
        S3Uri: [!Sub 's3://${RuleDeployBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}-an/port-guard/${EnvironmentName}/current']
        Region: [!Ref AWS::Region]
        ApplyIpv6: [!Ref ApplyIpv6]
      ScheduleExpression: !Ref MondaySchedule
      # 作った直後と、台が初めてオンラインになったときには流さず、予定の時刻にだけ流す。
      ApplyOnlyAtCronInterval: true
      MaxConcurrency: '100%'
      MaxErrors: '100%'
      AssociationDispatchAssumeRole: !GetAtt AssociationDispatchRole.Arn

  # 定期適用の関連付け（木曜の分）。予定と名前のほかは月曜の分と同じ。
  ThursdayAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub port-guard-apply-rules-${EnvironmentName}-thu
      Name: !Ref DocumentName
      Targets:
        - Key: !Sub tag:${TagKey}
          Values: [!If [TagValueIsEnvironment, !Ref EnvironmentName, !Ref TagValue]]
      Parameters:
        S3Uri: [!Sub 's3://${RuleDeployBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}-an/port-guard/${EnvironmentName}/current']
        Region: [!Ref AWS::Region]
        ApplyIpv6: [!Ref ApplyIpv6]
      ScheduleExpression: !Ref ThursdaySchedule
      ApplyOnlyAtCronInterval: true
      MaxConcurrency: '100%'
      MaxErrors: '100%'
      AssociationDispatchAssumeRole: !GetAtt AssociationDispatchRole.Arn

  # 失敗の通知の規則の実行ロール。トピックのポリシーは書き換えず、このロールの権限で送る。
  # トピックが KMS で暗号化されているなら、このロールにそのキーの権限を足す（今は足していない）。
  NotificationRole:
    Type: AWS::IAM::Role
    Condition: NotifyFailures
    Properties:
      Description: !Sub EventBridge role that publishes port-guard scheduled apply failures (${EnvironmentName})
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publish-failures
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishFailures
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref NotificationTopicArn

  # 失敗の通知の規則。定期適用の関連付け（2 つ）の、台ごとの結果が Failed になったら、台ごとに 1 通送る。
  # EventBridge のイベントは取りこぼすことがあるので、正本は関連付けの実行の履歴（instance-setup.md の「失敗した台を確かめる」）。
  FailureNotificationRule:
    Type: AWS::Events::Rule
    Condition: NotifyFailures
    Properties:
      Name: !Sub port-guard-apply-rules-${EnvironmentName}-failed
      Description: !Sub Notify the instances where the port-guard scheduled rule apply failed (${EnvironmentName})
      State: ENABLED
      EventPattern:
        source: [aws.ssm]
        detail-type: [EC2 State Manager Instance Association State Change]
        detail:
          status: [Failed]
          association-id:
            - !GetAtt MondayAssociation.AssociationId
            - !GetAtt ThursdayAssociation.AssociationId
      Targets:
        - Id: notification-topic
          Arn: !Ref NotificationTopicArn
          RoleArn: !GetAtt NotificationRole.Arn
          InputTransformer:
            InputPathsMap:
              instance: $.detail.instance-id
              association: $.detail.association-id
              time: $.time
              code: $.detail.error-code
              summary: $.detail.execution-summary
            InputTemplate: !Sub '"port-guard のルールの定期適用（${EnvironmentName}）が失敗した台: <instance>。時刻（UTC）: <time>。関連付け: <association>。エラー: <code> <summary>。確かめ方: aws ssm describe-association-executions --association-id <association> で実行の ID を調べ、aws ssm describe-association-execution-targets --association-id <association> --execution-id <実行の ID> --filters Key=Status,Value=Failed。流し直すときは apply_rules.rb でその台だけ流す。"'

Outputs:
  MondayAssociationId:
    Value: !GetAtt MondayAssociation.AssociationId
  ThursdayAssociationId:
    Value: !GetAtt ThursdayAssociation.AssociationId
