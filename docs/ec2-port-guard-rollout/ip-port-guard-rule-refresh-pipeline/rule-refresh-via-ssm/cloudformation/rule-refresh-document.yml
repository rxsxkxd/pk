# ルールの更新ドキュメント。ルールの更新スクリプト（ルールのデプロイ先から照合の値と ipset 入れ替えスクリプトを取り、照合してから流す）の正本。
# 手動の更新（rb/refresh_rules.rb）と定期更新（scheduled-refresh.yml の関連付け）の両方が、このドキュメントを流す。
# アカウント・リージョンに 1 つ（環境の間で共用する。環境ごとに違う値はパラメータで受け取る）。
AWSTemplateFormatVersion: '2010-09-09'
Description: Port-guard rule refresh document (fetch the rules from the rule deploy location, verify them, and swap the ipset sets).

Parameters:
  # ドキュメントの名前。refresh_rules.rb の --document-name と scheduled-refresh.yml の DocumentName の既定に合わせる。
  DocumentName:
    Type: String
    Default: port-guard-refresh-rules

Resources:
  RuleRefreshDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Ref DocumentName
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      # 名前を決めているので、中身を変えたときは置き換え（Replace。同じ名前の作り直しになりぶつかる）ではなく、新しい版を作って既定の版にする。
      # 既定の版が変わると、このドキュメントを使う関連付けは、予定を待たずにすぐ流れる（AWS のドキュメントの記述）。
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: Fetch the port-guard rules from the rule deploy location, verify them with SHA256SUMS, and swap the ipset sets.
        parameters:
          S3Uri:
            type: String
            description: ルールのデプロイ先（例 s3://ip-port-guard-rules-<アカウント ID>-<リージョン>-an/port-guard/staging/current。末尾の / なし）
            # スクリプトに埋め込むので、使える文字を絞る。
            allowedPattern: '^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/[A-Za-z0-9/_.-]+[A-Za-z0-9_.-]$'
          Region:
            type: String
            description: ルールのデプロイ先バケットのリージョン
            allowedPattern: '^[a-z]{2}(-[a-z]+)+-[0-9]$'
          IncludeIpv6:
            type: String
            description: 1 なら refresh-ipv6.sh も流す（IPv6 も絞っている台）
            allowedValues: ['0', '1']
            default: '0'
        mainSteps:
          - action: aws:runShellScript
            name: refreshRules
            inputs:
              timeoutSeconds: '600'
              runCommand:
                - |
                  #!/bin/bash
                  # ルールの更新スクリプト（root で流れる）。値はドキュメントのパラメータから入る。
                  set -euo pipefail
                  PG_S3_URI='{{ S3Uri }}'
                  PG_REGION='{{ Region }}'
                  PG_INCLUDE_IPV6='{{ IncludeIpv6 }}'
                  echo "== $(hostname) $(date '+%F %T') refresh-rules ${PG_S3_URI}"
                  command -v aws > /dev/null || { echo "PG blocked=aws-cli-not-found（AWS CLI がない）"; exit 1; }

                  files=(command/port_guard/refresh-ipv4.sh)
                  [ "$PG_INCLUDE_IPV6" = 1 ] && files+=(command/port_guard/refresh-ipv6.sh)

                  work=$(mktemp -d /tmp/port-guard-rules.XXXXXX)
                  trap 'rm -rf "$work"' EXIT
                  cd "$work"

                  # 1. 照合の値を先に取り、そのあと ipset 入れ替えスクリプトを取る
                  #    （ルールのデプロイ先へは照合の値が最後に上がるので、上げている途中なら照合で合わない）
                  aws s3 cp --region "$PG_REGION" --only-show-errors "$PG_S3_URI/SHA256SUMS" SHA256SUMS
                  for f in "${files[@]}"; do
                    mkdir -p "$(dirname "$f")"
                    aws s3 cp --region "$PG_REGION" --only-show-errors "$PG_S3_URI/$f" "$f"
                  done

                  # 2. 照合する（取ったファイルの行だけ。合わなければ何も変えずに止まる）
                  : > check
                  for f in "${files[@]}"; do
                    awk -v f="$f" '$2 == f' SHA256SUMS >> check
                    grep -q "  $f\$" check || { echo "PG blocked=not-in-sha256sums（SHA256SUMS に ${f} がない）"; exit 1; }
                  done
                  sha256sum -c check || { echo "PG blocked=checksum-mismatch（照合の値と合わない。ルールを上げている途中なら、終わってから流し直す）"; exit 1; }

                  # 3. ipset 入れ替えスクリプトを流す（一時の集合に入れて件数を確かめてから ipset swap。
                  #    port-guard を入れていない台では、今の集合がないので何も変えずに止まる）
                  #    入れ替えの前後に、集合ごとの登録数を 1 行ずつ出す（差分は人が計算する。集合がなければ entries=-）
                  sets=(port_guard_jp port_guard_allow port_guard_aws)
                  [ "$PG_INCLUDE_IPV6" = 1 ] && sets+=(port_guard_jp6 port_guard_allow6 port_guard_aws6)
                  pg_counts() {
                    for s in "${sets[@]}"; do
                      n=$(ipset list -t "$s" 2> /dev/null | awk -F': ' '/^Number of entries/ { print $2 }' || true)
                      echo "PG count phase=$1 set=$s entries=${n:--}"
                    done
                  }
                  pg_counts before
                  for f in "${files[@]}"; do
                    bash "$f"
                  done
                  pg_counts after

                  # 4. 更新の記録フォルダに、流した ipset 入れ替えスクリプトの写しと日時を残す
                  install -d -m 755 /var/lib/port-guard/rules
                  for f in "${files[@]}"; do
                    install -m 644 "$f" "/var/lib/port-guard/rules/$(basename "$f")"
                  done
                  install -m 644 SHA256SUMS /var/lib/port-guard/rules/SHA256SUMS
                  echo "$(date '+%F %T') ${PG_S3_URI}" > /var/lib/port-guard/rules/last-refreshed
                  echo "PG result=refreshed"

Outputs:
  # refresh_rules.rb の --document-name と、scheduled-refresh.yml の DocumentName に渡す。
  RuleRefreshDocumentName:
    Value: !Ref RuleRefreshDocument
