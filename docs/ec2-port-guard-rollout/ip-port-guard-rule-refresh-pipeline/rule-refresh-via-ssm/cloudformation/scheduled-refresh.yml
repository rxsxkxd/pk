# ルールの定期更新（環境ごとに 1 つのスタック）。
# 定期更新の関連付けを 1〜2 つ（既定は月曜・木曜の日本時間 11:00。2 番目は省略できる）、関連付けのロール、失敗の通知の規則（任意）を作る。
# 先に rule-refresh-document.yml（ルールの更新ドキュメント）と rule-read-policy.yml（ルールの読み取りポリシー）が要る。
# 設計は ../scheduled-refresh-design.md、手順は ../instance-setup.md。
AWSTemplateFormatVersion: '2010-09-09'
Description: Port-guard scheduled rule refresh for one environment (State Manager associations on a primary and an optional secondary schedule, and failure notification).

Parameters:
  # 環境の名前。ルールのデプロイ先 port-guard/<環境>/current と、関連付けの名前に使う。
  EnvironmentName:
    Type: String
    AllowedValues: [development, staging, production]
  # 環境のタグ。キーと値が合う台に流す。値が空なら環境の名前を使う（list_instances.rb と同じ既定）。
  TagKey:
    Type: String
    Default: Environment
  TagValue:
    Type: String
    Default: ''
  # 用途タグ。定期更新に入れる台だけに付ける（環境のタグに加えて）。両方のタグが付いた台だけに流す。
  # 実際のキーと値は決まっていない（仮の既定）。
  PurposeTagKey:
    Type: String
    Default: PortGuardScheduledRefresh
  PurposeTagValue:
    Type: String
    Default: 'true'
  # ルールの更新ドキュメントの名前（rule-refresh-document.yml の DocumentName）。
  DocumentName:
    Type: String
    Default: port-guard-refresh-rules
  # ルールのデプロイ先バケットの名前の先頭部分。実際の名前は <先頭部分>-<アカウント ID>-<リージョン>-an。
  RuleDeployBucketNamePrefix:
    Type: String
    Default: ip-port-guard-rules
  # 1 なら refresh-ipv6.sh も流す（IPv6 も絞っている環境）。
  IncludeIpv6:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
  # 予定（UTC。秒から始まる 7 項目の cron 式で、秒は 0 だけ）。関連付けの cron 式は曜日を 1 つしか書けないので、
  # 1 番目と 2 番目の 2 つに分ける。既定は月曜と木曜の UTC 2:00 ＝ 日本時間 11:00（ルールのデプロイ先へのデプロイ 9:00 の 2 時間後）。
  # 2 番目を空にすると、2 番目の関連付けを作らない（予定を 1 つだけにする）。
  PrimarySchedule:
    Type: String
    Default: cron(0 0 2 ? * MON *)
  SecondarySchedule:
    Type: String
    Default: cron(0 0 2 ? * THU *)
  # 失敗した台を知らせる既存の SNS のトピックの ARN（親フォルダの CodePipeline の NotificationTopicArn と同じものを想定）。空なら通知しない。
  NotificationTopicArn:
    Type: String
    Default: ''

Conditions:
  TagValueIsEnvironment: !Equals [!Ref TagValue, '']
  NotifyFailures: !Not [!Equals [!Ref NotificationTopicArn, '']]
  UseSecondarySchedule: !Not [!Equals [!Ref SecondarySchedule, '']]

Resources:
  # 関連付けのロール。定期更新の関連付けが、更新対象サーバーにルールの更新ドキュメントを送るときに使う。
  # 信頼する相手は ssm.amazonaws.com、許すことは ssm:SendCommand だけ（AWS のドキュメント「Setup roles for AssociationDispatchAssumeRole」）。
  AssociationDispatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${DocumentName}-dispatch-${EnvironmentName}
      Description: !Sub State Manager dispatch role for the port-guard scheduled rule refresh (${EnvironmentName})
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ssm.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub send-${DocumentName}-document
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # [変更] ルールの更新ドキュメントだけを、EC2 のインスタンスに送る。
              - Sid: SendRuleRefreshDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${DocumentName}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*

  # 定期更新の関連付け（1 番目の予定。既定は月曜）。全台に並列で流し、失敗した台があっても残りの台に流し続ける。
  PrimaryAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub ${DocumentName}-${EnvironmentName}-primary
      Name: !Ref DocumentName
      Targets:
        # 環境のタグと用途タグの両方が付いた台だけ（複数のタグのキーを書くと、すべてが付いた台だけが対象になる）。
        - Key: !Sub tag:${TagKey}
          Values: [!If [TagValueIsEnvironment, !Ref EnvironmentName, !Ref TagValue]]
        - Key: !Sub tag:${PurposeTagKey}
          Values: [!Ref PurposeTagValue]
      Parameters:
        S3Uri: [!Sub 's3://${RuleDeployBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}-an/port-guard/${EnvironmentName}/current']
        Region: [!Ref AWS::Region]
        IncludeIpv6: [!Ref IncludeIpv6]
      ScheduleExpression: !Ref PrimarySchedule
      # 作った直後と、台が初めてオンラインになったときには流さず、予定の時刻にだけ流す。
      ApplyOnlyAtCronInterval: true
      MaxConcurrency: '100%'
      MaxErrors: '100%'
      AssociationDispatchAssumeRole: !GetAtt AssociationDispatchRole.Arn

  # 定期更新の関連付け（2 番目の予定。既定は木曜）。SecondarySchedule が空なら作らない。予定と名前のほかは 1 番目と同じ。
  SecondaryAssociation:
    Type: AWS::SSM::Association
    Condition: UseSecondarySchedule
    Properties:
      AssociationName: !Sub ${DocumentName}-${EnvironmentName}-secondary
      Name: !Ref DocumentName
      Targets:
        # 環境のタグと用途タグの両方が付いた台だけ（複数のタグのキーを書くと、すべてが付いた台だけが対象になる）。
        - Key: !Sub tag:${TagKey}
          Values: [!If [TagValueIsEnvironment, !Ref EnvironmentName, !Ref TagValue]]
        - Key: !Sub tag:${PurposeTagKey}
          Values: [!Ref PurposeTagValue]
      Parameters:
        S3Uri: [!Sub 's3://${RuleDeployBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}-an/port-guard/${EnvironmentName}/current']
        Region: [!Ref AWS::Region]
        IncludeIpv6: [!Ref IncludeIpv6]
      ScheduleExpression: !Ref SecondarySchedule
      ApplyOnlyAtCronInterval: true
      MaxConcurrency: '100%'
      MaxErrors: '100%'
      AssociationDispatchAssumeRole: !GetAtt AssociationDispatchRole.Arn

  # 失敗の通知の規則の実行ロール。トピックのポリシーは書き換えず、このロールの権限で送る。
  # トピックが KMS で暗号化されているなら、このロールにそのキーの権限を足す（今は足していない）。
  NotificationRole:
    Type: AWS::IAM::Role
    Condition: NotifyFailures
    Properties:
      Description: !Sub EventBridge role that publishes port-guard scheduled rule refresh failures (${EnvironmentName})
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub publish-${DocumentName}-failures
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishFailures
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref NotificationTopicArn

  # 失敗の通知の規則。定期更新の関連付け（2 つ）の、台ごとの結果が Failed になったら、台ごとに 1 通送る。
  # EventBridge のイベントは取りこぼすことがあるので、正本は関連付けの実行の履歴（instance-setup.md の「失敗した台を確かめる」）。
  FailureNotificationRule:
    Type: AWS::Events::Rule
    Condition: NotifyFailures
    Properties:
      Name: !Sub ${DocumentName}-${EnvironmentName}-failed
      Description: !Sub Notify the instances where the port-guard scheduled rule refresh failed (${EnvironmentName})
      State: ENABLED
      EventPattern:
        source: [aws.ssm]
        detail-type: [EC2 State Manager Instance Association State Change]
        detail:
          status: [Failed]
          association-id:
            - !GetAtt PrimaryAssociation.AssociationId
            - !If [UseSecondarySchedule, !GetAtt SecondaryAssociation.AssociationId, !Ref AWS::NoValue]
      Targets:
        - Id: notification-topic
          Arn: !Ref NotificationTopicArn
          RoleArn: !GetAtt NotificationRole.Arn
          InputTransformer:
            InputPathsMap:
              instance: $.detail.instance-id
              association: $.detail.association-id
              time: $.time
              code: $.detail.error-code
              summary: $.detail.execution-summary
            InputTemplate: !Sub '"port-guard のルールの定期更新（${EnvironmentName}）が失敗した台: <instance>。時刻（UTC）: <time>。関連付け: <association>。エラー: <code> <summary>。確かめ方: aws ssm describe-association-executions --association-id <association> で実行の ID を調べ、aws ssm describe-association-execution-targets --association-id <association> --execution-id <実行の ID> --filters Key=Status,Value=Failed。流し直すときは refresh_rules.rb でその台だけ流す。"'

Outputs:
  PrimaryAssociationId:
    Value: !GetAtt PrimaryAssociation.AssociationId
  SecondaryAssociationId:
    Condition: UseSecondarySchedule
    Value: !GetAtt SecondaryAssociation.AssociationId
