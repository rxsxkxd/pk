<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img" aria-labelledby="title desc">
  <title id="title">ルールの更新の構成</title>
  <desc id="desc">ルールのデプロイ先（S3）に IP 許可ルールを置き、ルールの更新ドキュメント（AWS::SSM::Document）にルールの更新スクリプトを置く。定期更新の関連付け（AWS::SSM::Association。月曜・木曜 11:00）か作業者の refresh_rules.rb が、Run Command で更新対象サーバーにドキュメントを流す。更新対象サーバーは自分の IAM ロールの権限で S3 からルールを読み、ipset を入れ替える。失敗した台は失敗の通知の規則（AWS::Events::Rule）が SNS へ送る。更新対象サーバーの一覧は、手動の更新では作業者の手元のインスタンスの一覧ファイル（instance-lists/&lt;環境&gt;.tsv。環境のタグで引いて人が確かめる）、定期更新では関連付けの Targets（tag:Environment=&lt;環境&gt; と用途タグの両方。AWS 側に保存し、実行のたびに SSM が引く）で決まる。どちらも元は EC2 のタグ。</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-tgt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#ca8a04"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; }
    .box-pipe { fill: #f8fafc; stroke: #475569; stroke-width: 2; filter: url(#shadow); }
    .box-s3   { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; filter: url(#shadow); }
    .box-ssm  { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; filter: url(#shadow); }
    .box-ec2  { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; filter: url(#shadow); }
    .box-evt  { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; filter: url(#shadow); }
    .box-op   { fill: #ffffff; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 3; filter: url(#shadow); }
    .row      { fill: #ffffff; stroke: #fdba74; stroke-width: 1; }
    .target   { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
    .box-list { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; stroke-dasharray: 5 3; filter: url(#shadow); }
    .tgt { font-size: 12px; fill: #713f12; text-anchor: middle; }
    .tgt-b { font-size: 12px; font-weight: 700; fill: #854d0e; text-anchor: middle; }
    .line-tgt { stroke: #ca8a04; stroke-width: 2; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow-tgt); }
    .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .name { font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .kind { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .sub  { font-size: 13px; fill: #475569; text-anchor: middle; }
    .mono { font-size: 12px; fill: #334155; font-family: Menlo, Consolas, monospace; }
    .rowtext { font-size: 12.5px; fill: #7c2d12; }
    .label { font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .label-red { font-size: 12px; font-weight: 600; fill: #b91c1c; text-anchor: middle; }
    .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; marker-end: url(#arrow-red); }
  </style>

  <rect width="1120" height="700" fill="#ffffff"/>
  <text x="30" y="36" class="title">ルールの更新の構成（1 つの環境）</text>

  <!-- CodePipeline（親フォルダ） -->
  <rect x="30" y="70" width="230" height="100" rx="8" class="box-pipe"/>
  <text x="145" y="95" class="kind" fill="#475569">親フォルダ</text>
  <text x="145" y="120" class="name">CodePipeline</text>
  <text x="145" y="142" class="sub">月曜・木曜 9:00</text>
  <text x="145" y="160" class="sub">ルールを作って上げる</text>

  <!-- S3: IP 許可ルールの保存 -->
  <rect x="330" y="60" width="330" height="150" rx="8" class="box-s3"/>
  <text x="495" y="84" class="kind" fill="#16a34a">IP 許可ルールの保存</text>
  <text x="495" y="108" class="name">S3: ルールのデプロイ先</text>
  <text x="348" y="136" class="mono">port-guard/&lt;環境&gt;/current/</text>
  <text x="348" y="158" class="mono">  command/port_guard/refresh-ipv4.sh</text>
  <text x="348" y="178" class="mono">  command/port_guard/refresh-ipv6.sh</text>
  <text x="348" y="198" class="mono">  SHA256SUMS（照合の値）</text>

  <!-- ルールの更新ドキュメント -->
  <rect x="330" y="260" width="330" height="120" rx="8" class="box-ssm"/>
  <text x="495" y="284" class="kind" fill="#2563eb">ルールの更新スクリプトの保存</text>
  <text x="495" y="308" class="name">ルールの更新ドキュメント</text>
  <text x="495" y="330" class="sub">AWS::SSM::Document（Command）</text>
  <text x="495" y="350" class="sub">port-guard-refresh-rules</text>
  <text x="495" y="368" class="sub">アカウントに 1 つ・全環境で共用</text>

  <!-- 定期更新の関連付け -->
  <rect x="330" y="430" width="330" height="214" rx="8" class="box-ssm"/>
  <text x="495" y="454" class="kind" fill="#2563eb">定期実行のスケジュール</text>
  <text x="495" y="478" class="name">定期更新の関連付け ×2</text>
  <text x="495" y="500" class="sub">AWS::SSM::Association</text>
  <text x="495" y="520" class="sub">月曜・木曜 11:00（UTC 2:00）</text>
  <text x="495" y="540" class="sub">全台に並列で流す</text>
  <rect x="348" y="554" width="294" height="78" rx="5" class="target"/>
  <text x="495" y="574" class="tgt-b">対象の台の管理（定期更新）: Targets</text>
  <text x="495" y="592" class="tgt">tag:Environment = &lt;環境&gt; かつ</text>
  <text x="495" y="608" class="tgt">tag:&lt;用途タグ&gt; = &lt;値&gt;（関連付けに保存）</text>
  <text x="495" y="624" class="tgt">実行のたびに、両方が付いた台を SSM が引く</text>

  <!-- 作業者（手動の更新） -->
  <rect x="30" y="300" width="230" height="120" rx="8" class="box-op"/>
  <text x="145" y="325" class="kind" fill="#64748b">作業者の PC・踏み台サーバー</text>
  <text x="145" y="350" class="name">手動の更新</text>
  <text x="145" y="372" class="sub">list_instances.rb → 目で確認</text>
  <text x="145" y="392" class="sub">→ refresh_rules.rb</text>
  <text x="145" y="410" class="sub">（1 台ずつ）</text>

  <!-- 対象の台の管理（手動の更新）: インスタンスの一覧ファイル -->
  <rect x="30" y="470" width="230" height="160" rx="8" class="box-list"/>
  <text x="145" y="494" class="tgt-b">対象の台の管理（手動の更新）</text>
  <text x="145" y="518" class="name">インスタンスの一覧ファイル</text>
  <text x="145" y="540" class="sub">instance-lists/&lt;環境&gt;.tsv</text>
  <text x="145" y="560" class="sub">作業者の手元（Git に入れない）</text>
  <text x="145" y="582" class="tgt">list_instances.rb が環境のタグで引き、</text>
  <text x="145" y="598" class="tgt">SSM で応答する台を書き出す。</text>
  <text x="145" y="614" class="tgt">人が目で確かめて要らない行を消す</text>
  <line x1="145" y1="470" x2="145" y2="424" class="line-tgt"/>
  <text x="185" y="452" class="label">渡す</text>

  <!-- 更新対象サーバー -->
  <rect x="740" y="190" width="350" height="240" rx="8" class="box-ec2"/>
  <text x="915" y="214" class="kind" fill="#ca8a04">環境のタグ・用途タグ（対象の台の元）</text>
  <text x="915" y="238" class="name">更新対象サーバー（EC2）</text>
  <rect x="758" y="256" width="314" height="34" rx="5" class="row"/>
  <text x="772" y="278" class="rowtext">IAM ロール ＋ port-guard-rule-read-&lt;環境&gt;</text>
  <rect x="758" y="298" width="314" height="34" rx="5" class="row"/>
  <text x="772" y="320" class="rowtext">SSM Agent（Run Command を受ける）</text>
  <rect x="758" y="340" width="314" height="34" rx="5" class="row"/>
  <text x="772" y="362" class="rowtext">ipset の集合 port_guard_*（swap で入れ替え）</text>
  <rect x="758" y="382" width="314" height="34" rx="5" class="row"/>
  <text x="772" y="404" class="rowtext">/var/lib/port-guard/rules/（更新の記録）</text>

  <!-- 失敗の通知の規則 -->
  <rect x="740" y="480" width="210" height="100" rx="8" class="box-evt"/>
  <text x="845" y="504" class="kind" fill="#7c3aed">エラーの定義と通知</text>
  <text x="845" y="528" class="name">失敗の通知の規則</text>
  <text x="845" y="550" class="sub">AWS::Events::Rule</text>
  <text x="845" y="568" class="sub">台ごとの結果が Failed</text>

  <!-- SNS -->
  <rect x="975" y="480" width="115" height="100" rx="8" class="box-evt"/>
  <text x="1032" y="516" class="name">SNS</text>
  <text x="1032" y="540" class="sub">トピック</text>
  <text x="1032" y="560" class="sub">→ メール</text>

  <!-- 矢印 -->
  <line x1="260" y1="120" x2="326" y2="120" class="line"/>
  <text x="293" y="110" class="label">上げる</text>

  <line x1="260" y1="350" x2="326" y2="330" class="line"/>
  <text x="293" y="326" class="label">送る</text>

  <line x1="495" y1="430" x2="495" y2="384" class="line"/>
  <text x="560" y="412" class="label">予定の時刻に流す</text>

  <line x1="660" y1="320" x2="736" y2="300" class="line"/>
  <text x="698" y="280" class="label">Run</text>
  <text x="698" y="295" class="label">Command</text>

  <path d="M 915 190 L 915 135 L 664 135" class="line"/>
  <text x="790" y="125" class="label">ルールを読む（s3:GetObject）</text>

  <line x1="845" y1="430" x2="845" y2="476" class="line-red"/>
  <text x="890" y="458" class="label-red">失敗した台</text>

  <line x1="950" y1="530" x2="971" y2="530" class="line"/>

  <!-- 対象の台の管理のまとめ -->
  <text x="30" y="672" class="tgt" style="text-anchor: start; font-size: 12.5px;">更新対象サーバーの一覧: 手動の更新は作業者の手元のインスタンスの一覧ファイル（環境のタグで引く）、定期更新は関連付けの Targets（AWS 側。環境のタグと用途タグの両方）で決まる。</text>
</svg>
