# ステップ 2（ステップ 1.5 の step1-5-waf.yml の後）: CloudFront のディストリビューションと、オリジン用のセキュリティグループ。
# 利用者のドメイン名（app.example.com）は変えず、CloudFront が利用者の TLS を終端し、
# 稼働サーバー（EC2 の httpd）の 443 番へ HTTPS で接続する。
#
# - 置くリージョン: 稼働サーバーの VPC があるリージョン（例 ap-northeast-1）。セキュリティグループを VPC に作るため
# - スタック名の例: <prefix>-step2-cloudfront（例 myapp-production-step2-cloudfront）
# - 変更セットの作り方の例（秘密のヘッダーの値はテンプレートに書かず、ここで渡す。端末では変更セットを作るところまで。
#   中身の確認と実行は AWS のコンソールで行う。手順は definitions.md の「変更セットをコンソールで実行する」）:
#     aws cloudformation deploy --region ap-northeast-1 --no-execute-changeset \
#       --template-file cloudformation/step2-cloudfront.yml \
#       --stack-name <prefix>-step2-cloudfront \
#       --parameter-overrides VpcId=vpc-... CloudFrontPrefixListId=pl-... \
#         DomainName=app.example.com OriginDomainName=origin.app.example.com \
#         CloudFrontCertificateArn=<ステップ 1 の出力> CloudFrontWebAclArn=<step1-5-waf.yml の出力> \
#         OriginVerifyHeaderValue=<openssl rand -hex 32 の値>
# - 利用者のドメイン名の DNS のレコードは、ここでは作らない（ステップ 3 で scripts/step3-dns-switch.sh が切り替える）
# - 稼働サーバーへのセキュリティグループの付け替えも、ここでは行わない（出力 OriginSecurityGroupId を手で足す）
# - 同じ内容の CDK の定義: cdk/python の <prefix>-step2-cloudfront（手順のステップ 2 は CDK を使う）
#
# Description（英語）は CloudFormation のスタックの説明として出る。日本語の説明はこのコメントだけに書く
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Step 2 of CloudFront -> EC2 with the viewer domain name unchanged. CloudFront terminates viewer TLS and connects
  to httpd over HTTPS through a separate origin DNS name, keeping the viewer Host header.

# ---- パラメータ（デプロイのときに --parameter-overrides で渡す値） ----
Parameters:
  # 稼働サーバーの VPC。オリジン用のセキュリティグループをこの VPC に作る。
  # 値: VPC の ID（例 vpc-0123456789abcdef0）
  VpcId:
    Type: AWS::EC2::VPC::Id

  # CloudFront のオリジン向けのアドレスの一覧（AWS が管理するプレフィックスリスト）の ID。
  # セキュリティグループで「CloudFront からの接続だけ」を許可するのに使う。
  # 値: com.amazonaws.global.cloudfront.origin-facing の ID（pl-...）。リージョンごとに違うので、次で調べる:
  #   aws ec2 describe-managed-prefix-lists --region <リージョン> \
  #     --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
  #     --query 'PrefixLists[0].PrefixListId' --output text
  CloudFrontPrefixListId:
    Type: String
    Description: Prefix list ID of com.amazonaws.global.cloudfront.origin-facing in this Region.
    AllowedPattern: "^pl-[0-9a-f]+$"

  # 利用者のドメイン名。CloudFront の代替ドメイン名（Aliases）になる。
  # 値: 今の利用者の名前のまま（例 app.example.com）。ステップ 1 の証明書に入っている名前と同じにする
  DomainName:
    Type: String
    Description: Domain name used by viewers, such as app.example.com. Unchanged by this migration.

  # オリジンの名前。CloudFront が稼働サーバーへ接続するときに引く名前（IP アドレスは指定できない）。
  # 値: 稼働サーバーの Elastic IP を返す、公開の DNS で引ける名前。DomainName とは別の名前にする
  #   （ステップ 3 の後、DomainName は CloudFront を指すので、同じにすると CloudFront が自分自身に接続する。下の Rules で止める）。
  #   例 1（手順の想定）: origin.app.example.com（自分のドメインに A レコードを作る。下の OriginHostedZoneId か手で作る）
  #   例 2: EC2 のパブリック DNS 名（ec2-203-0-113-10.ap-northeast-1.compute.amazonaws.com のような名前）。
  #     DNS のレコードを作らずに済む。VPC の DNS ホスト名（enableDnsHostnames）と DNS 解決（enableDnsSupport）が
  #     有効で、Elastic IP が付いている間は変わらない。Elastic IP を付け替えると名前が変わり、このパラメータの更新が要る
  # どちらでも、稼働サーバーの証明書（Let's Encrypt の app.example.com）のままでよい。CloudFront は、オリジンの証明書が
  # 「オリジンの名前」か「オリジンへ渡す Host ヘッダーの名前」のどちらかを含めば受け入れる。この定義は Host ヘッダーに
  # 利用者のドメイン名を渡す（下の AllViewer）ので、app.example.com の証明書で通る
  OriginDomainName:
    Type: String
    Description: Separate public DNS name that resolves to the instance, such as origin.app.example.com.

  # 利用者と CloudFront の間で使う証明書。
  # 値: ステップ 1 の出力 CertificateArn（arn:aws:acm:us-east-1:...）。us-east-1 の ACM の「証明書」に限る
  CloudFrontCertificateArn:
    Type: String
    Description: Output CertificateArn of step1-certificate.yml in us-east-1.
    AllowedPattern: "^arn:aws:acm:us-east-1:.*"

  # 秘密のヘッダーの名前。CloudFront が稼働サーバーへの要求にだけ付けるヘッダー。
  # 値: 既定の X-Origin-Verify のままでよい。httpd の確認の設定（cloudfront-to-ec2-httpd.md）と同じ名前にする
  OriginVerifyHeaderName:
    Type: String
    Default: X-Origin-Verify

  # 秘密のヘッダーの値。httpd がこの値を確かめて、CloudFront を通らない直接の接続を断る（ステップ 3 の片付けで入れる）。
  # 値: 32 文字以上のランダムな値（openssl rand -hex 32）。テンプレートには書かず、デプロイのときに渡す。
  # NoEcho なので describe-stacks には出ないが、CloudFront の設定を読める人には見える。
  # 更新のときに渡さなければ、前の値のまま（aws cloudformation deploy の動き）
  OriginVerifyHeaderValue:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret value that httpd checks to reject requests that bypass this distribution.

  # CloudFront がオリジンの応答を待つ秒数。過ぎると接続を切る（GET・HEAD は再試行し、POST などは再試行しない）。
  # 値: 既定 30。アプリでいちばん時間のかかる応答より長くする
  OriginReadTimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 120

  # CloudFront がオリジンとの接続を使い回す秒数。
  # 値: 既定 5。httpd の KeepAliveTimeout をこれより長くする（httpd が先に接続を切らないように。準備の 3）
  OriginKeepaliveTimeoutSeconds:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 300

  # CloudFront の地理的制限を使うか。
  # 値: none（既定。使わない）か whitelist（GeoRestrictionCountries の国だけを受ける）。
  # 国の絞り込みは WAF（ステップ 1.5 の step1-5-waf.yml）で行うので none のままにする。地理的制限で止めた要求は WAF に届かず、
  # Let's Encrypt の確認のパスを例外にできないため、whitelist にするとオリジンの証明書の更新が止まる
  GeoRestrictionType:
    Type: String
    Default: none
    AllowedValues: [whitelist, none]
    Description: >-
      none (default) leaves country filtering to the web ACL in CloudFrontWebAclArn (step1-5-waf.yml).
      whitelist allows only GeoRestrictionCountries, but it also blocks the Let's Encrypt HTTP-01
      validation of the origin certificate, because blocked requests never reach AWS WAF.

  # 地理的制限で受ける国（GeoRestrictionType が whitelist のときだけ使う）。
  # 値: ISO 3166-1 alpha-2 の国コードをカンマで区切る（既定 JP）。none のときは無視される
  GeoRestrictionCountries:
    Type: CommaDelimitedList
    Default: JP
    Description: ISO 3166-1 alpha-2 country codes allowed when GeoRestrictionType is whitelist.

  # CloudFront に関連付ける WAF の web ACL。
  # 値: ステップ 1.5 の step1-5-waf.yml の出力 WebAclArn（arn:aws:wafv2:us-east-1:...:global/webacl/...）。
  # 空（既定）なら関連付けない（国で絞らない）。本番では空にしない
  CloudFrontWebAclArn:
    Type: String
    Default: ""
    Description: >-
      AWS WAF web ACL created in us-east-1 (CLOUDFRONT scope), such as WebAclArn of step1-5-waf.yml.
      Empty means no web ACL.

  # オリジンの名前の A レコードを作る Route 53 のホストゾーン（任意）。
  # 値: ホストゾーン ID（ステージング。Route 53）か、空（既定。本番。外部の DNS サービスに手で足す）。
  # OriginDomainName に EC2 のパブリック DNS 名を使うときは、レコードが要らないので空にする
  OriginHostedZoneId:
    Type: String
    Default: ""
    Description: Optional. Route 53 hosted zone in which to create the OriginDomainName record.

  # オリジンの名前の A レコードの値（OriginHostedZoneId を指定したときに必須）。
  # 値: 稼働サーバーの Elastic IP（例 203.0.113.10）。空でもよい（レコードを作らないとき）
  OriginElasticIp:
    Type: String
    Default: ""
    Description: Elastic IP address of the instance. Required when OriginHostedZoneId is set.
    AllowedPattern: "^$|^([0-9]{1,3}\\.){3}[0-9]{1,3}$"

# ---- 規則（デプロイの前に CloudFormation が確かめる条件） ----
Rules:
  # オリジンの名前が利用者のドメイン名と同じなら止める（CloudFront が自分自身へ接続することになるため）
  OriginNameDiffersFromViewerName:
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: OriginDomainName
                - Ref: DomainName
        AssertDescription: OriginDomainName must differ from DomainName, which resolves to CloudFront itself.
  # ホストゾーンを指定したのに Elastic IP がなければ止める（A レコードの値がないため）
  OriginRecordNeedsElasticIp:
    RuleCondition:
      Fn::Not:
        - Fn::Equals:
            - Ref: OriginHostedZoneId
            - ""
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: OriginElasticIp
                - ""
        AssertDescription: OriginElasticIp is required when OriginHostedZoneId is set.

# ---- 条件（パラメータの値で、作るものを切り替える） ----
Conditions:
  # 地理的制限を使う（GeoRestrictionType が whitelist）とき真
  HasGeoRestriction:
    Fn::Equals:
      - Ref: GeoRestrictionType
      - whitelist
  # WAF の web ACL を関連付ける（CloudFrontWebAclArn が空でない）とき真
  HasCloudFrontWebAcl:
    Fn::Not:
      - Fn::Equals:
          - Ref: CloudFrontWebAclArn
          - ""
  # オリジンの名前の A レコードを作る（OriginHostedZoneId が空でない）とき真
  HasOriginRecord:
    Fn::Not:
      - Fn::Equals:
          - Ref: OriginHostedZoneId
          - ""

# ---- リソース ----
Resources:
  # オリジンの名前（OriginDomainName → 稼働サーバーの Elastic IP）の A レコード。ステージング（Route 53）でだけ作る。
  # 利用者のドメイン名のレコードは既にあるので、ここでは作らない（ステップ 3 で切り替える）
  OriginRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasOriginRecord
    Properties:
      HostedZoneId:
        Ref: OriginHostedZoneId
      Name:
        Ref: OriginDomainName
      Type: A
      # 300 秒。Elastic IP を変えることはまれなので、短くしない
      TTL: "300"
      ResourceRecords:
        - Ref: OriginElasticIp

  # オリジン用のセキュリティグループ。CloudFront のオリジン向けのアドレスから、443 番だけを許可する。
  # 稼働サーバーの今のグループは変えず、このグループを足して付ける（ステップ 2 の 2-3）。
  # プレフィックスリストはセキュリティグループの規則の上限で 55 件分に数えるので、既存のグループに足さず専用にしている
  OriginSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from CloudFront origin-facing servers. Attach it to the instance.
      VpcId:
        Ref: VpcId
      # 外向きの規則は書かない（既定の全許可のまま。外向きは稼働サーバーの今のグループの設定に従う）
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId:
            Ref: CloudFrontPrefixListId

  # CloudFront のディストリビューション。キャッシュせず、利用者の要求をそのまま稼働サーバーへ渡す
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        # 利用者との間は HTTP/2 まで（オリジンとの間は CloudFront がいつも HTTP/1.1 で接続する）
        HttpVersion: http2
        # IPv6 を無効にする。ステップ 3 で利用者のドメイン名に作るレコードを A だけにするため
        IPV6Enabled: false
        # 地理的制限。既定（none）では使わない。whitelist のときだけ国の一覧を渡す
        Restrictions:
          GeoRestriction:
            RestrictionType:
              Ref: GeoRestrictionType
            Locations:
              Fn::If:
                - HasGeoRestriction
                - Ref: GeoRestrictionCountries
                - Ref: AWS::NoValue
        # 代替ドメイン名。利用者のドメイン名をそのまま受ける
        Aliases:
          - Ref: DomainName
        # 利用者に見せる証明書（ステップ 1 の ACM の証明書）
        ViewerCertificate:
          AcmCertificateArn:
            Ref: CloudFrontCertificateArn
          # sni-only: SNI に対応したブラウザだけを受ける（専用 IP の追加の料金がかからない方）
          SslSupportMethod: sni-only
          # 利用者との TLS は 1.2 以上（TLSv1.2_2021 のセキュリティポリシー）
          MinimumProtocolVersion: TLSv1.2_2021
        # WAF の web ACL。CloudFrontWebAclArn が空なら書かない
        WebACLId:
          Fn::If:
            - HasCloudFrontWebAcl
            - Ref: CloudFrontWebAclArn
            - Ref: AWS::NoValue
        # オリジン（稼働サーバー）は 1 つ
        Origins:
          # Id: このディストリビューションの中でオリジンを指す名前（下の TargetOriginId と同じにする）
          - Id: ec2-origin
            DomainName:
              Ref: OriginDomainName
            CustomOriginConfig:
              # https-only: CloudFront から稼働サーバーへはいつも HTTPS（間はインターネットを通るため）
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              # オリジンとの TLS は 1.2 だけ
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout:
                Ref: OriginReadTimeoutSeconds
              OriginKeepaliveTimeout:
                Ref: OriginKeepaliveTimeoutSeconds
            # 秘密のヘッダー。CloudFront を通った要求にだけ付く
            OriginCustomHeaders:
              - HeaderName:
                  Ref: OriginVerifyHeaderName
                HeaderValue:
                  Ref: OriginVerifyHeaderValue
        # すべてのパスに使う動作（パスごとの動作は作っていない）
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          # 利用者が http で来たら https へリダイレクトする
          ViewerProtocolPolicy: redirect-to-https
          # フォームと API のため、すべてのメソッドを通す
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          # CloudFront では圧縮しない（応答はオリジンが返したまま渡す）
          Compress: false
          # キャッシュポリシー: AWS の管理ポリシー Managed-CachingDisabled（キャッシュしない。利用者ごとに違う応答を保存しないため）
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # オリジンリクエストポリシー: AWS の管理ポリシー Managed-AllViewer。利用者の要求のヘッダー（Host を含む）、
          # Cookie、クエリ文字列をすべてオリジンへ渡す。Host が利用者のドメイン名のまま届くので、Rails のリダイレクト先が
          # 利用者のドメイン名になり、稼働サーバーの証明書（app.example.com）も Host の名前で受け入れられる
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

# ---- 出力（次の作業に渡す値） ----
Outputs:
  # ディストリビューションのドメイン名（dxxxx.cloudfront.net）。
  # ステップ 2 の確認（curl --connect-to の接続先）と、ステップ 3 の向き先に使う
  DistributionDomainName:
    Description: Point DomainName to this name after checking the distribution.
    Value:
      Fn::GetAtt: [Distribution, DomainName]
  # オリジン用のセキュリティグループの ID（sg-...）。ステップ 2 の 2-3 で稼働サーバーに足す
  OriginSecurityGroupId:
    Description: Attach this security group to the instance before switching DNS.
    Value:
      Fn::GetAtt: [OriginSecurityGroup, GroupId]
