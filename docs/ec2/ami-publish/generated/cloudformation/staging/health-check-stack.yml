# このファイルは cmd/generate-definitions が config/ami_publish.yml から生成した。手で編集しない。
# 変更するときは internal/definitions/ か config/ を直し、再生成して差分をレビューする。
AWSTemplateFormatVersion: "2010-09-09"
Description: myapp health check (SSM document) for the AMI publish pipeline (staging)
Resources:
  HealthCheckDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: myapp-staging-health-check
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Check that the application responds after the instance reboot
        mainSteps:
          - action: aws:runShellScript
            name: healthCheck
            inputs:
              timeoutSeconds: "240"
              runCommand:
                - set -u
                - 'if ! command -v aws >/dev/null 2>&1; then echo ''health check failed: AWS CLI is not installed (needed to read the basic auth parameter)''; exit 1; fi'
                - 'if ! credentials=$(aws ssm get-parameter --region ap-northeast-1 --name ''/myapp/staging/health-check/basic-auth'' --with-decryption --query Parameter.Value --output text); then echo ''health check failed: cannot read the basic auth parameter /myapp/staging/health-check/basic-auth (check the release instance role)''; exit 1; fi'
                - escaped=$(printf '%s' "$credentials" | sed 's/[\\"]/\\&/g')
                - basic_auth() { printf 'user = "%s"\n' "$escaped"; }
                - status=none
                - for _ in $(seq 1 30); do
                - '  status=$(basic_auth | curl -K - -sS -o /dev/null -w ''%{http_code}'' http://localhost/up || true)'
                - '  case "$status" in 2??) echo ''health check passed''; exit 0 ;; esac'
                - '  sleep 5'
                - done
                - 'echo "health check failed: http://localhost/up did not respond with 2xx (last HTTP status: $status)"'
                - 'if [ "$status" = 401 ]; then echo ''HTTP 401: the basic auth credentials were rejected or not sent''; fi'
                - exit 1
  BasicAuthParameterReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: 'Attach to the release instance role: read the basic auth parameter for the health check'
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ssm:GetParameter
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/myapp/staging/health-check/basic-auth
Outputs:
  HealthCheckDocumentName:
    Value:
      Ref: HealthCheckDocument
    Export:
      Name: myapp-staging-health-check:DocumentName
  BasicAuthParameterReadPolicyArn:
    Description: Attach this managed policy to the IAM role of the release instance
    Value:
      Ref: BasicAuthParameterReadPolicy
