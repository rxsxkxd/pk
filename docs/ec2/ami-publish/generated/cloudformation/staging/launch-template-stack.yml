# このファイルは cmd/generate-definitions が config/ami_publish.yml から生成した。手で編集しない。
# 変更するときは internal/definitions/ か config/ を直し、再生成して差分をレビューする。
AWSTemplateFormatVersion: "2010-09-09"
Description: myapp launch template (staging). ImageId is updated by the AMI publish pipeline.
Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI created by the AMI publish pipeline
  AppVersion:
    Type: String
    AllowedPattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
    Description: Application release version contained in the AMI (e.g. v1.2.3)
Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: InstanceRole
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: myapp-staging
      VersionDescription:
        Fn::Sub: myapp ${AppVersion}
      LaunchTemplateData:
        ImageId:
          Ref: AmiId
        InstanceType: t3.small
        IamInstanceProfile:
          Arn:
            Fn::GetAtt:
              - InstanceProfile
              - Arn
        SecurityGroupIds:
          - sg-0123456789abcdef0
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: App
                Value: myapp
              - Key: AppVersion
                Value:
                  Ref: AppVersion
          - ResourceType: volume
            Tags:
              - Key: App
                Value: myapp
              - Key: AppVersion
                Value:
                  Ref: AppVersion
Outputs:
  LaunchTemplateId:
    Value:
      Ref: LaunchTemplate
  LaunchTemplateVersion:
    Value:
      Fn::GetAtt:
        - LaunchTemplate
        - LatestVersionNumber
