# このファイルは cmd/generate-definitions が config/ami_publish.yml から生成した。手で編集しない。
# 変更するときは internal/definitions/ か config/ を直し、再生成して差分をレビューする。
AWSTemplateFormatVersion: "2010-09-09"
Description: myapp launch template (staging). ImageId is updated by the AMI publish pipeline.
Parameters:
  AmiId:
    Type: String
    Default: ""
    AllowedPattern: ^(ami-[0-9a-f]{8,17})?$
    Description: AMI created by the AMI publish pipeline. Leave empty on the first deployment.
  AppVersion:
    Type: String
    Default: ""
    AllowedPattern: ^(v[0-9]+\.[0-9]+\.[0-9]+)?$
    Description: Application release version contained in the AMI (e.g. v1.2.3). Leave empty on the first deployment.
Conditions:
  HasAmiId:
    Fn::Not:
      - Fn::Equals:
          - Ref: AmiId
          - ""
Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: InstanceRole
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: myapp-staging
      VersionDescription:
        Fn::If:
          - HasAmiId
          - Fn::Sub: myapp ${AppVersion}
          - myapp (AMI not set)
      LaunchTemplateData:
        ImageId:
          Fn::If:
            - HasAmiId
            - Ref: AmiId
            - Ref: AWS::NoValue
        InstanceType: t3.small
        IamInstanceProfile:
          Arn:
            Fn::GetAtt:
              - InstanceProfile
              - Arn
        SecurityGroupIds:
          - sg-0123456789abcdef0
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: App
                Value: myapp
              - Key: AppVersion
                Value:
                  Fn::If:
                    - HasAmiId
                    - Ref: AppVersion
                    - none
          - ResourceType: volume
            Tags:
              - Key: App
                Value: myapp
              - Key: AppVersion
                Value:
                  Fn::If:
                    - HasAmiId
                    - Ref: AppVersion
                    - none
Outputs:
  LaunchTemplateId:
    Value:
      Ref: LaunchTemplate
  LaunchTemplateVersion:
    Value:
      Fn::GetAtt:
        - LaunchTemplate
        - LatestVersionNumber
