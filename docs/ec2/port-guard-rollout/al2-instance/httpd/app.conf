# Rails のアプリを Passenger で動かす仮想ホスト（HTTP と HTTPS）
<VirtualHost *:80>
  ServerName localhost
  DocumentRoot /home/@APP_USER@/app/public
  PassengerAppEnv production

  <Directory /home/@APP_USER@/app/public>
    AllowOverride all
    Options -MultiViews
    Require all granted
  </Directory>
</VirtualHost>

<VirtualHost *:443>
  ServerName localhost
  Protocols h2 http/1.1
  DocumentRoot /home/@APP_USER@/app/public
  PassengerAppEnv production

  SSLEngine on
  SSLCertificateFile /etc/pki/tls/certs/localhost.crt
  SSLCertificateKeyFile /etc/pki/tls/private/localhost.key

  <Directory /home/@APP_USER@/app/public>
    AllowOverride all
    Options -MultiViews
    Require all granted
  </Directory>
</VirtualHost>
