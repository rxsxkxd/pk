<svg xmlns="http://www.w3.org/2000/svg" width="860" height="930" viewBox="0 0 860 930" role="img">

  <style>
    .bg { fill: #ffffff; }
    .box { stroke-width: 1.5; rx: 8; }
    .command { fill: #e8f0fe; stroke: #1a56db; }
    .check { fill: #fff4e5; stroke: #c2410c; }
    .manual { fill: #ecfdf3; stroke: #15803d; stroke-dasharray: 6 4; }
    .done { fill: #f1f5f9; stroke: #475569; }
    .ok { fill: #dcfce7; stroke: #15803d; }
    .ng { fill: #fee2e2; stroke: #b91c1c; }
    .note { fill: #fafafa; stroke: #9ca3af; stroke-dasharray: 3 3; }
    text { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #111827; }
    .t { font-size: 15px; }
    .s { font-size: 12.5px; fill: #374151; }
    .lbl { font-size: 12.5px; fill: #1f2937; }
    .title { font-size: 18px; font-weight: bold; }
    .edge { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .bracket { stroke: #6b7280; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="860" height="930"/>
  <text class="title" x="20" y="30">port-guard-rollout: 全体の流れ</text>
  <rect class="box done" x="190" y="60" width="420" height="58"/>
  <text class="t" x="400.0" y="84.5" text-anchor="middle">前提: SSM の有効化が済んでいる</text>
  <text class="s" x="400.0" y="103.5" text-anchor="middle">ssm-setup の ssm-check で「入れる」になった台が対象</text>
  <rect class="box done" x="190" y="150" width="420" height="58"/>
  <text class="t" x="400.0" y="174.5" text-anchor="middle">0. 準備</text>
  <text class="s" x="400.0" y="193.5" text-anchor="middle">対象の一覧・許可する IP・--backup-label を決める</text>
  <rect class="box command" x="190" y="240" width="420" height="58"/>
  <text class="t" x="400.0" y="264.5" text-anchor="middle">1. backup</text>
  <text class="s" x="400.0" y="283.5" text-anchor="middle">AMI を作る（再起動しない・完了は待たない）</text>
  <rect class="box check" x="190" y="330" width="420" height="58"/>
  <text class="t" x="400.0" y="354.5" text-anchor="middle">backup-check（補助）</text>
  <text class="s" x="400.0" y="373.5" text-anchor="middle">作成済み（available）で 12 時間以内か</text>
  <rect class="box command" x="190" y="430" width="420" height="58"/>
  <text class="t" x="400.0" y="454.5" text-anchor="middle">2. install（SSM か SSH）</text>
  <text class="s" x="400.0" y="473.5" text-anchor="middle">ipset と設定を入れ、集合を作る（遮断はまだ効かない）</text>
  <rect class="box manual" x="190" y="520" width="420" height="58"/>
  <text class="t" x="400.0" y="544.5" text-anchor="middle">拠点から port-guard-probe（手で）</text>
  <text class="s" x="400.0" y="563.5" text-anchor="middle">届く（reachable）ことを確かめる</text>
  <rect class="box command" x="190" y="610" width="420" height="58"/>
  <text class="t" x="400.0" y="634.5" text-anchor="middle">3. enable（インスタンスごと）</text>
  <text class="s" x="400.0" y="653.5" text-anchor="middle">自動で戻る予約 → 遮断 → 確かめて確定（別の図）</text>
  <rect class="box manual" x="190" y="700" width="420" height="58"/>
  <text class="t" x="400.0" y="724.5" text-anchor="middle">拠点から port-guard-probe（手で）</text>
  <text class="s" x="400.0" y="743.5" text-anchor="middle">時間切れ（timeout）になることを確かめる</text>
  <rect class="box done" x="190" y="790" width="420" height="58"/>
  <text class="t" x="400.0" y="814.5" text-anchor="middle">4. 見守りと片付け</text>
  <text class="s" x="400.0" y="833.5" text-anchor="middle">破棄の記録を見る・古い AMI を消す</text>
  <path class="edge" d="M 400.0 118 L 400.0 150"/>
  <path class="edge" d="M 400.0 208 L 400.0 240"/>
  <path class="edge" d="M 400.0 298 L 400.0 330"/>
  <path class="edge" d="M 400.0 388 L 400.0 430"/>
  <text class="lbl" x="408.0" y="410" text-anchor="start">そろった</text>
  <path class="edge" d="M 400.0 488 L 400.0 520"/>
  <path class="edge" d="M 400.0 578 L 400.0 610"/>
  <path class="edge" d="M 400.0 668 L 400.0 700"/>
  <path class="edge" d="M 400.0 758 L 400.0 790"/>
  <rect class="box done" x="650" y="330" width="180" height="58"/>
  <text class="t" x="740.0" y="354.5" text-anchor="middle">作成を待つ</text>
  <text class="s" x="740.0" y="373.5" text-anchor="middle">（pending）</text>
  <path class="edge" d="M 610 350 L 650 350"/>
  <text class="lbl" x="618" y="344" text-anchor="start">まだ</text>
  <path class="edge" d="M 650 370 L 610 370"/>
  <path class="edge" d="M 190 359 L 120 359 L 120 269 L 190 269"/>
  <text class="s" x="112" y="310" text-anchor="end">12 時間を</text>
  <text class="s" x="112" y="328" text-anchor="end">過ぎたら</text>
  <text class="s" x="112" y="346" text-anchor="end">作り直す</text>
  <path class="bracket" d="M 630 430 L 640 430 L 640 668 L 630 668"/>
  <rect class="box note" x="655" y="490" width="190" height="115"/>
  <text class="s" x="750" y="516" text-anchor="middle">install・enable は、</text>
  <text class="s" x="750" y="535" text-anchor="middle">操作の前にバックアップ</text>
  <text class="s" x="750" y="554" text-anchor="middle">を自動で確かめる</text>
  <text class="s" x="750" y="573" text-anchor="middle">（台ごと、</text>
  <text class="s" x="750" y="592" text-anchor="middle">操作の直前にも）</text>
  <rect class="box command" x="650" y="60" width="28" height="16"/>
  <text class="s" x="686" y="73" text-anchor="start">道具のコマンド</text>
  <rect class="box check" x="650" y="84" width="28" height="16"/>
  <text class="s" x="686" y="97" text-anchor="start">確認（道具）</text>
  <rect class="box manual" x="650" y="108" width="28" height="16"/>
  <text class="s" x="686" y="121" text-anchor="start">作業者が手で行う</text>
  <rect class="box done" x="650" y="132" width="28" height="16"/>
  <text class="s" x="686" y="145" text-anchor="start">準備・待ち・片付け</text>
</svg>
