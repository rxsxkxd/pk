<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img">

  <style>
    .bg { fill: #ffffff; }
    text { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #111827; }
    .title { font-size: 19px; font-weight: bold; }
    .h { font-size: 15px; font-weight: bold; }
    .s { font-size: 12.5px; fill: #374151; }
    .lbl { font-size: 12.5px; font-weight: bold; fill: #1f2937; }
    .ngt { font-size: 12.5px; font-weight: bold; fill: #b91c1c; }
    .policy { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.4; }
    .policy2 { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .role { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.6; }
    .profile { fill: #ecfdf3; stroke: #15803d; stroke-width: 1.8; }
    .profile2 { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.4; }
    .ec2 { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.4; }
    .edge { stroke: #374151; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .edge2 { stroke: #6b7280; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    .ng { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .x { stroke: #dc2626; stroke-width: 3.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="570"/>
  <text class="title" x="20" y="34" text-anchor="start">IAM ロールとインスタンスプロファイルの関係</text>
  <rect class="policy" x="20" y="90" width="230" height="60" rx="10"/>
  <text class="h" x="135.0" y="115.5" text-anchor="middle">ポリシー</text>
  <text class="s" x="135.0" y="134.5" text-anchor="middle">AmazonSSMManagedInstanceCore</text>
  <rect class="policy2" x="20" y="170" width="230" height="60" rx="10"/>
  <text class="h" x="135.0" y="195.5" text-anchor="middle">ほかのポリシー</text>
  <text class="s" x="135.0" y="214.5" text-anchor="middle">（必要なら足せる。複数可）</text>
  <rect class="role" x="310" y="120" width="220" height="80" rx="10"/>
  <text class="h" x="420.0" y="146.0" text-anchor="middle">IAM ロール</text>
  <text class="s" x="420.0" y="165.0" text-anchor="middle">port-guard-ssm</text>
  <text class="s" x="420.0" y="184.0" text-anchor="middle">権限の入れ物</text>
  <path class="edge" d="M 250 120 L 308 150"/>
  <path class="edge2" d="M 250 200 L 308 172"/>
  <text class="lbl" x="255" y="100" text-anchor="start">複数付けられる</text>
  <rect class="profile" x="590" y="110" width="240" height="100" rx="10"/>
  <text class="h" x="710.0" y="136.5" text-anchor="middle">インスタンスプロファイル</text>
  <text class="s" x="710.0" y="155.5" text-anchor="middle">port-guard-ssm</text>
  <text class="s" x="710.0" y="174.5" text-anchor="middle">ロールを EC2 に渡す入れ物</text>
  <text class="s" x="710.0" y="193.5" text-anchor="middle">中のロールは 1 つだけ</text>
  <path class="edge" d="M 530 160 L 588 160"/>
  <text class="lbl" x="536" y="150" text-anchor="start">1 つだけ</text>
  <rect class="ec2" x="900" y="70" width="200" height="56" rx="10"/>
  <text class="h" x="1000.0" y="93.5" text-anchor="middle">インスタンス A</text>
  <text class="s" x="1000.0" y="112.5" text-anchor="middle">IAM ロール: port-guard-ssm</text>
  <path class="edge" d="M 830 160 L 865 160 L 865 98 L 898 98"/>
  <rect class="ec2" x="900" y="145" width="200" height="56" rx="10"/>
  <text class="h" x="1000.0" y="168.5" text-anchor="middle">インスタンス B</text>
  <text class="s" x="1000.0" y="187.5" text-anchor="middle">IAM ロール: port-guard-ssm</text>
  <path class="edge" d="M 830 160 L 865 160 L 865 173 L 898 173"/>
  <rect class="ec2" x="900" y="220" width="200" height="56" rx="10"/>
  <text class="h" x="1000.0" y="243.5" text-anchor="middle">インスタンス C</text>
  <text class="s" x="1000.0" y="262.5" text-anchor="middle">IAM ロール: port-guard-ssm</text>
  <path class="edge" d="M 830 160 L 865 160 L 865 248 L 898 248"/>
  <text class="lbl" x="872" y="290" text-anchor="start">何台にでも関連付けられる</text>
  <rect class="profile2" x="590" y="380" width="240" height="70" rx="10"/>
  <text class="h" x="710.0" y="410.5" text-anchor="middle">既存のインスタンスプロファイル</text>
  <text class="s" x="710.0" y="429.5" text-anchor="middle">（ほかの用途のロール）</text>
  <rect class="ec2" x="900" y="386" width="200" height="58" rx="10"/>
  <text class="h" x="1000.0" y="410.5" text-anchor="middle">インスタンス D</text>
  <text class="s" x="1000.0" y="429.5" text-anchor="middle">IAM ロール: 既存のもの</text>
  <path class="edge" d="M 830 415 L 898 415"/>
  <path class="ng" d="M 800 210 L 800 330 L 1000 330 L 1000 384"/>
  <line class="x" x1="992" y1="349" x2="1008" y2="365"/>
  <line class="x" x1="992" y1="365" x2="1008" y2="349"/>
  <text class="ngt" x="1012" y="352" text-anchor="start">2 つ目は</text>
  <text class="ngt" x="1012" y="370" text-anchor="start">関連付けられない</text>
  <text class="s" x="20" y="480" text-anchor="start">・1 つのインスタンスプロファイルに入れられるロールは 1 つだけ（ポリシーは 1 つのロールに複数付けられる）</text>
  <text class="s" x="20" y="500" text-anchor="start">・1 つのインスタンスプロファイルは、何台のインスタンスにでも関連付けられる</text>
  <text class="s" x="20" y="520" text-anchor="start">・1 台のインスタンスに関連付けられるインスタンスプロファイルは 1 つだけ。権限を増やすときは、そのロールにポリシーを足す</text>
  <text class="s" x="20" y="540" text-anchor="start">　（ssm-role は、IAM ロールが未設定の台に port-guard-ssm を関連付けるだけで、既存のロールには何もしない）</text>
</svg>
