AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  port-guard list refresh pipeline (optional). The pipeline source is fetch-generator-scripts.zip (only the fetch
  script). In the build, the fetch script downloads the three generator scripts (make-jp-lists.sh,
  make-aws-lists.sh, make-refresh.sh) stored uncompressed under generator-scripts/command/ in the pipeline bucket.
  The build makes the IP lists for ipset (Japan and AWS ranges from APNIC and ip-ranges.json; the individually
  allowed list from the VPC range and SSM Parameter Store) and the ipset replacement scripts (refresh-ipv4.sh,
  refresh-ipv6.sh), and the pipeline places them as one zip file in the deploy bucket. One stack per environment
  (VPC). Started manually only.

Parameters:
  EnvironmentName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,30}$"
    Description: Environment (VPC) name. Used in resource names, the deploy key and the parameter names.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC of the servers. Its IPv4 (and IPv6, if any) ranges are written to the individually allowed IP lists.
  AllowListParameterPrefix:
    Type: String
    Default: /port-guard
    AllowedPattern: "^/[A-Za-z0-9/_.-]*[A-Za-z0-9]$"
    Description: >-
      The other allowed addresses are read from the SSM parameters <prefix>/<EnvironmentName>/allow-ipv4 and
      allow-ipv6 (String, one address or CIDR per line, # comments allowed). Create them before running.
  DeployBucketName:
    Type: String
    Default: ""
    Description: >-
      Existing bucket to place the result zip file in. Leave empty to create a new bucket in this stack
      (versioning enabled). An existing bucket must use SSE-S3 (not SSE-KMS) encryption.
  DeployKeyPrefix:
    Type: String
    Default: port-guard
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9/_.-]*[A-Za-z0-9]$"
    Description: The result zip file is placed at <DeployKeyPrefix>/<EnvironmentName>/ip-lists-and-ipset-refresh-scripts.zip.
  RequireApproval:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Insert a manual approval stage between the build and the deploy.
  LogRetentionInDays:
    Type: Number
    Default: 90

Conditions:
  CreateDeployBucket:
    Fn::Equals: [Ref: DeployBucketName, ""]
  UseApproval:
    Fn::Equals: [Ref: RequireApproval, "true"]

Resources:
  # パイプライン用バケット。置くもの:
  #   source/fetch-generator-scripts.zip   生成スクリプトの取得スクリプトの圧縮ファイル（パイプラインのソース。中身は fetch-generator-scripts.sh だけ）
  #   generator-scripts/command/make-*.sh  生成スクリプト 3 つ（圧縮しない）
  #   パイプラインの中間の成果物（CodePipeline が置く）
  # S3 のソースアクションはバージョニングが必要。生成スクリプトの前の版を取り出せるようにするためにも使う
  PipelineBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  # 配置先バケット: DeployBucketName が空のときだけ作る。誤った一覧を置いたときに前の版へ戻せるよう、バージョニングを有効にする
  DeployBucket:
    Type: AWS::S3::Bucket
    Condition: CreateDeployBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/codebuild/port-guard-list-refresh-${EnvironmentName}
      RetentionInDays:
        Ref: LogRetentionInDays

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodeBuild of the port-guard list refresh pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: port-guard-list-refresh-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt: BuildLogGroup.Arn
              # パイプラインの中間の成果物の読み書きと、生成スクリプトの取得（版を指定して取る）
              - Sid: PipelineBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  Fn::Sub: ${PipelineBucket.Arn}/*
              # 個別許可の IP の一覧に入れる VPC の範囲（DescribeVpcs はリソースで絞れない）
              - Sid: ReadVpcRange
                Effect: Allow
                Action: ec2:DescribeVpcs
                Resource: "*"
              - Sid: ReadAllowListParameters
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AllowListParameterPrefix}/${EnvironmentName}/allow-ipv4
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AllowListParameterPrefix}/${EnvironmentName}/allow-ipv6
              # 前回の成果物の圧縮ファイル（中の前回分の IP の一覧が、増減の比較の基準）を読むだけ。配置先バケットには書かない
              - Sid: ReadLastResult
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}/${DeployKeyPrefix}/${EnvironmentName}/ip-lists-and-ipset-refresh-scripts.zip
                    - Bucket:
                        Fn::If: [CreateDeployBucket, Ref: DeployBucket, Ref: DeployBucketName]
              # 前回の成果物の圧縮ファイルがあるかを確かめる（初回はない）
              - Sid: CheckLastResult
                Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}
                    - Bucket:
                        Fn::If: [CreateDeployBucket, Ref: DeployBucket, Ref: DeployBucketName]
                Condition:
                  StringEquals:
                    s3:prefix:
                      Fn::Sub: ${DeployKeyPrefix}/${EnvironmentName}/ip-lists-and-ipset-refresh-scripts.zip

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name:
        Fn::Sub: port-guard-list-refresh-${EnvironmentName}
      Description: Make the port-guard IP lists for ipset and the ipset replacement scripts
      ServiceRole:
        Fn::GetAtt: BuildRole.Arn
      TimeoutInMinutes: 15
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName:
            Ref: BuildLogGroup
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: GENERATOR_SCRIPTS_BUCKET
            Value:
              Ref: PipelineBucket
          - Name: GENERATOR_SCRIPTS_PREFIX
            Value: generator-scripts
          - Name: RESULT_BUCKET
            Value:
              Fn::If: [CreateDeployBucket, Ref: DeployBucket, Ref: DeployBucketName]
          - Name: RESULT_KEY
            Value:
              Fn::Sub: ${DeployKeyPrefix}/${EnvironmentName}/ip-lists-and-ipset-refresh-scripts.zip
          - Name: VPC_ID
            Value:
              Ref: VpcId
          - Name: ALLOW_IPV4_PARAMETER
            Value:
              Fn::Sub: ${AllowListParameterPrefix}/${EnvironmentName}/allow-ipv4
          - Name: ALLOW_IPV6_PARAMETER
            Value:
              Fn::Sub: ${AllowListParameterPrefix}/${EnvironmentName}/allow-ipv6
          - Name: FORCE
            Value: "0"
      Source:
        Type: CODEPIPELINE
        # 入力（パイプラインのソース）は、生成スクリプトの取得スクリプトの圧縮ファイル（中身は fetch-generator-scripts.sh だけ）。
        # 生成スクリプト 3 つは、取得スクリプトがパイプライン用バケットの generator-scripts/command/ から取る。
        # ipset に入れる IP の一覧（日本・AWS・個別許可）と ipset 入れ替えスクリプトは、すべてこのビルドの中で作る
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            build:
              commands:
                # 生成スクリプト 3 つを command/ に取る（使った版を generator-scripts-versions.txt に書く）
                - bash fetch-generator-scripts.sh
                - |
                  # 個別許可の IP の一覧 = VPC の範囲（describe-vpcs）＋ 個別許可の IP のパラメータ（パラメータストア）
                  mkdir -p port_guard_whitelists
                  v4=$(aws ec2 describe-vpcs --vpc-ids "$VPC_ID" --output text \
                    --query 'Vpcs[0].CidrBlockAssociationSet[?CidrBlockState.State==`associated`].CidrBlock') || exit 1
                  v6=$(aws ec2 describe-vpcs --vpc-ids "$VPC_ID" --output text \
                    --query 'Vpcs[0].Ipv6CidrBlockAssociationSet[?Ipv6CidrBlockState.State==`associated`].Ipv6CidrBlock') || exit 1
                  extra4=$(aws ssm get-parameter --name "$ALLOW_IPV4_PARAMETER" --query Parameter.Value --output text) || exit 1
                  extra6=$(aws ssm get-parameter --name "$ALLOW_IPV6_PARAMETER" --query Parameter.Value --output text) || exit 1
                  [ -n "$(echo "$v4" | tr -d '[:space:]')" ] || { echo "VPC ${VPC_ID} の IPv4 の範囲が取れない"; exit 1; }
                  {
                    echo "# VPC ${VPC_ID}（describe-vpcs）"
                    echo "$v4" | tr '\t' '\n'
                    echo "# ${ALLOW_IPV4_PARAMETER}（パラメータストア）"
                    echo "$extra4"
                  } > port_guard_whitelists/allow-ipv4.txt
                  {
                    echo "# VPC ${VPC_ID}（describe-vpcs）"
                    echo "$v6" | tr '\t' '\n' | sed '/^None$/d'
                    echo "# ${ALLOW_IPV6_PARAMETER}（パラメータストア）"
                    echo "$extra6"
                  } > port_guard_whitelists/allow-ipv6.txt
                  cat port_guard_whitelists/allow-ipv4.txt port_guard_whitelists/allow-ipv6.txt
                - |
                  # 前回の成果物の圧縮ファイルから、前回分の IP の一覧だけを取り出す（増減の比較の基準。初回はなし）
                  mkdir -p port_guard_whitelists/last-refresh
                  keys=$(aws s3api list-objects-v2 --bucket "$RESULT_BUCKET" --prefix "$RESULT_KEY" --query 'Contents[].Key' --output text) || exit 1
                  if echo "$keys" | tr '\t' '\n' | grep -qxF "$RESULT_KEY"; then
                    aws s3 cp "s3://${RESULT_BUCKET}/${RESULT_KEY}" /tmp/last-result.zip || exit 1
                    unzip -o /tmp/last-result.zip 'port_guard_whitelists/last-refresh/*' || exit 1
                  else
                    echo "前回の成果物の圧縮ファイルがない（初回）: s3://${RESULT_BUCKET}/${RESULT_KEY}"
                  fi
                - bash command/make-jp-lists.sh
                - bash command/make-aws-lists.sh
                - FORCE="${FORCE}" bash command/make-refresh.sh
                - |
                  sha256sum command/port_guard/refresh-ipv4.sh command/port_guard/refresh-ipv6.sh \
                    port_guard_whitelists/{jp,aws,allow}-ipv{4,6}.txt generator-scripts-versions.txt > SHA256SUMS &&
                  cat SHA256SUMS
          # 成果物。デプロイのアクションが、この形のまま 1 つの圧縮ファイルにして配置先に置く
          artifacts:
            files:
              - SHA256SUMS
              - generator-scripts-versions.txt
              - command/port_guard/refresh-ipv4.sh
              - command/port_guard/refresh-ipv6.sh
              - port_guard_whitelists/jp-ipv4.txt
              - port_guard_whitelists/jp-ipv6.txt
              - port_guard_whitelists/aws-ipv4.txt
              - port_guard_whitelists/aws-ipv6.txt
              - port_guard_whitelists/allow-ipv4.txt
              - port_guard_whitelists/allow-ipv6.txt
              - port_guard_whitelists/last-refresh/*.txt

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodePipeline of the port-guard list refresh pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: port-guard-list-refresh-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PipelineBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  Fn::Sub: ${PipelineBucket.Arn}/*
              - Sid: PipelineBucket
                Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  Fn::GetAtt: PipelineBucket.Arn
              - Sid: RunBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  Fn::GetAtt: BuildProject.Arn
              # [変更] 配置先バケットに書くのは、この環境の成果物の圧縮ファイル 1 つだけ
              - Sid: DeployResult
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}/${DeployKeyPrefix}/${EnvironmentName}/ip-lists-and-ipset-refresh-scripts.zip
                    - Bucket:
                        Fn::If: [CreateDeployBucket, Ref: DeployBucket, Ref: DeployBucketName]

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name:
        Fn::Sub: port-guard-list-refresh-${EnvironmentName}
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn:
        Fn::GetAtt: PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location:
          Ref: PipelineBucket
      Variables:
        - Name: FORCE
          DefaultValue: "0"
          Description: Set 1 to proceed when a list changed by more than 5% from the last result (make-refresh.sh FORCE=1)
      Stages:
        - Name: Source
          Actions:
            - Name: FetchGeneratorScripts
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket:
                  Ref: PipelineBucket
                S3ObjectKey: source/fetch-generator-scripts.zip
                PollForSourceChanges: "false"
              OutputArtifacts:
                - Name: FetchScript
        - Name: Build
          Actions:
            - Name: MakeListsAndRefreshScripts
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName:
                  Ref: BuildProject
                EnvironmentVariables: '[{"name":"FORCE","value":"#{variables.FORCE}","type":"PLAINTEXT"}]'
              InputArtifacts:
                - Name: FetchScript
              OutputArtifacts:
                - Name: Result
        - Fn::If:
            - UseApproval
            - Name: Approval
              Actions:
                - Name: CheckBuildLog
                  ActionTypeId:
                    Category: Approval
                    Owner: AWS
                    Provider: Manual
                    Version: "1"
                  Configuration:
                    CustomData: >-
                      Check the build log (generator script versions, allow lists, counts, added and removed per
                      list, SHA256SUMS) before approving.
            - Ref: AWS::NoValue
        - Name: Deploy
          Actions:
            - Name: PlaceResultZip
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                BucketName:
                  Fn::If: [CreateDeployBucket, Ref: DeployBucket, Ref: DeployBucketName]
                Extract: "false"
                ObjectKey:
                  Fn::Sub: ${DeployKeyPrefix}/${EnvironmentName}/ip-lists-and-ipset-refresh-scripts.zip
              InputArtifacts:
                - Name: Result

Outputs:
  PipelineName:
    Value:
      Ref: Pipeline
  PipelineBucketName:
    Value:
      Ref: PipelineBucket
  GeneratorScriptsUri:
    Description: Upload the three generator scripts (uncompressed) here
    Value:
      Fn::Sub: s3://${PipelineBucket}/generator-scripts/command/
  FetchScriptZipUri:
    Description: Upload fetch-generator-scripts.zip (only fetch-generator-scripts.sh) here
    Value:
      Fn::Sub: s3://${PipelineBucket}/source/fetch-generator-scripts.zip
  ResultZipUri:
    Value:
      Fn::Sub:
        - s3://${Bucket}/${DeployKeyPrefix}/${EnvironmentName}/ip-lists-and-ipset-refresh-scripts.zip
        - Bucket:
            Fn::If: [CreateDeployBucket, Ref: DeployBucket, Ref: DeployBucketName]
