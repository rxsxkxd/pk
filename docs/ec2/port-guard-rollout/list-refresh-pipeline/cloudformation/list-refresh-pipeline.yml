AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  port-guard list refresh pipeline (optional). Automates the human workflow on the bastion server as it is:
  fetch-allow-and-last-lists.sh -> make-jp-lists.sh -> make-aws-lists.sh -> make-refresh.sh -> human check
  (manual approval) -> publish-refresh-scripts.sh. The same bastion scripts are stored uncompressed under
  bastion-scripts/command/ in the pipeline bucket and fetched in the build by fetch-bastion-scripts.sh (the
  pipeline source, fetch-bastion-scripts.zip). The ipset replacement scripts are published to the S3 publish
  location. One stack per environment (VPC). Started manually only.

Parameters:
  EnvironmentName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,30}$"
    Description: Environment (VPC) name. Used in resource names and in the S3 publish location.
  PublishBucketName:
    Type: String
    Default: ""
    Description: >-
      Existing bucket of the S3 publish location (the same bucket the human workflow uses). Leave empty to create
      a new bucket in this stack (versioning enabled). An existing bucket must use SSE-S3 (not SSE-KMS) encryption.
  PublishKeyPrefix:
    Type: String
    Default: port-guard
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9/_.-]*[A-Za-z0-9]$"
    Description: The S3 publish location is s3://<bucket>/<PublishKeyPrefix>/<EnvironmentName>/current.
  RequireApproval:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Insert a manual approval stage (the human check) between making and publishing.
  LogRetentionInDays:
    Type: Number
    Default: 90

Conditions:
  CreatePublishBucket:
    Fn::Equals: [Ref: PublishBucketName, ""]
  UseApproval:
    Fn::Equals: [Ref: RequireApproval, "true"]

Resources:
  # パイプライン用バケット。置くもの:
  #   source/fetch-bastion-scripts.zip   踏み台サーバーの手順のスクリプトの取得スクリプトの圧縮ファイル（パイプラインのソース。中身は fetch-bastion-scripts.sh だけ）
  #   bastion-scripts/command/*.sh       踏み台サーバーの手順のスクリプト 5 つ（圧縮しない。踏み台サーバーの command/ と同じもの）
  #   パイプラインの中間の成果物（CodePipeline が置く）
  # S3 のソースアクションはバージョニングが必要。踏み台サーバーの手順のスクリプトの前の版を取り出せるようにするためにも使う
  PipelineBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  # 公開バケット: PublishBucketName が空のときだけ作る。誤ったものを上げたときに前の版へ戻せるよう、バージョニングを有効にする
  PublishBucket:
    Type: AWS::S3::Bucket
    Condition: CreatePublishBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/codebuild/port-guard-list-refresh-${EnvironmentName}
      RetentionInDays:
        Ref: LogRetentionInDays

  # 一覧を作るビルドのロール: S3 の公開場所は読むだけ
  MakeRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodeBuild that makes the port-guard IP lists and ipset replacement scripts (reads the S3 publish location only)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: port-guard-list-refresh-make
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt: BuildLogGroup.Arn
              # パイプラインの中間の成果物の読み書きと、踏み台サーバーの手順のスクリプトの取得（版を指定して取る）
              - Sid: PipelineBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  Fn::Sub: ${PipelineBucket.Arn}/*
              # fetch-allow-and-last-lists.sh: 個別許可の IP の一覧と前回分の IP の一覧を、S3 の公開場所から取る
              - Sid: ReadPublishLocation
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}/${PublishKeyPrefix}/${EnvironmentName}/current/*
                    - Bucket:
                        Fn::If: [CreatePublishBucket, Ref: PublishBucket, Ref: PublishBucketName]
              - Sid: ListPublishLocation
                Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}
                    - Bucket:
                        Fn::If: [CreatePublishBucket, Ref: PublishBucket, Ref: PublishBucketName]
                Condition:
                  StringLike:
                    s3:prefix:
                      Fn::Sub: ${PublishKeyPrefix}/${EnvironmentName}/current/*

  # S3 に上げるビルドのロール: 承認の後にだけ動く。S3 の公開場所に書けるのはこのロールだけ
  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodeBuild that publishes the ipset replacement scripts to the S3 publish location (after approval)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: port-guard-list-refresh-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt: BuildLogGroup.Arn
              # 一覧を作るビルドの成果物（中間の成果物）を読む
              - Sid: ReadPipelineArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  Fn::Sub: ${PipelineBucket.Arn}/*
              # [変更] publish-refresh-scripts.sh: S3 の公開場所に上げる。この環境の current/ の下だけ
              - Sid: WritePublishLocation
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:s3:::${Bucket}/${PublishKeyPrefix}/${EnvironmentName}/current/*
                    - Bucket:
                        Fn::If: [CreatePublishBucket, Ref: PublishBucket, Ref: PublishBucketName]

  # 一覧を作るビルド: 人の作業フローの 1〜4（S3 から取る → 一覧を作る → make-refresh.sh）
  MakeProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name:
        Fn::Sub: port-guard-list-refresh-${EnvironmentName}-make
      Description: Make the port-guard IP lists and the ipset replacement scripts (same steps as the human workflow)
      ServiceRole:
        Fn::GetAtt: MakeRole.Arn
      TimeoutInMinutes: 15
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName:
            Ref: BuildLogGroup
          StreamName: make
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: BASTION_SCRIPTS_BUCKET
            Value:
              Ref: PipelineBucket
          - Name: BASTION_SCRIPTS_PREFIX
            Value: bastion-scripts
          - Name: PORT_GUARD_S3_URI
            Value:
              Fn::Sub:
                - s3://${Bucket}/${PublishKeyPrefix}/${EnvironmentName}/current
                - Bucket:
                    Fn::If: [CreatePublishBucket, Ref: PublishBucket, Ref: PublishBucketName]
          - Name: FORCE
            Value: "0"
      Source:
        Type: CODEPIPELINE
        # 入力（パイプラインのソース）は、踏み台サーバーの手順のスクリプトの取得スクリプトの圧縮ファイル（中身は fetch-bastion-scripts.sh だけ）
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            build:
              commands:
                # 0. 踏み台サーバーの手順のスクリプト 5 つを command/ に取る（使った版を bastion-scripts-versions.txt に書く）
                - bash fetch-bastion-scripts.sh
                # 1. S3 の公開場所から、個別許可の IP の一覧と前回分の IP の一覧を取る
                - bash command/fetch-allow-and-last-lists.sh
                # 2・3. 公開元の IP の一覧を取り、日本・AWS の IP の一覧を作る
                - bash command/make-jp-lists.sh
                - bash command/make-aws-lists.sh
                # 4. 件数・前回分との増減を確かめ、ipset 入れ替えスクリプトを作る（前回分の IP の一覧も今回の分に更新される）
                - FORCE="${FORCE}" bash command/make-refresh.sh
          # 承認の後の S3 に上げるビルドに渡すもの（上げる処理の publish-refresh-scripts.sh も、ここで取った版を渡す）
          artifacts:
            files:
              - bastion-scripts-versions.txt
              - command/publish-refresh-scripts.sh
              - command/port_guard/refresh-ipv4.sh
              - command/port_guard/refresh-ipv6.sh
              - port_guard_whitelists/allow-ipv4.txt
              - port_guard_whitelists/allow-ipv6.txt
              - port_guard_whitelists/last-refresh/*.txt

  # S3 に上げるビルド: 人の作業フローの 6（publish-refresh-scripts.sh）
  PublishProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name:
        Fn::Sub: port-guard-list-refresh-${EnvironmentName}-publish
      Description: Publish the ipset replacement scripts to the S3 publish location (same script as the human workflow)
      ServiceRole:
        Fn::GetAtt: PublishRole.Arn
      TimeoutInMinutes: 10
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName:
            Ref: BuildLogGroup
          StreamName: publish
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: PORT_GUARD_S3_URI
            Value:
              Fn::Sub:
                - s3://${Bucket}/${PublishKeyPrefix}/${EnvironmentName}/current
                - Bucket:
                    Fn::If: [CreatePublishBucket, Ref: PublishBucket, Ref: PublishBucketName]
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            build:
              commands:
                - cat bastion-scripts-versions.txt
                # 6. ipset 入れ替えスクリプト・個別許可の IP の一覧・前回分の IP の一覧を上げ、最後に SHA256SUMS を上げる
                - bash command/publish-refresh-scripts.sh

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodePipeline of the port-guard list refresh pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: port-guard-list-refresh-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PipelineBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  Fn::Sub: ${PipelineBucket.Arn}/*
              - Sid: PipelineBucket
                Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  Fn::GetAtt: PipelineBucket.Arn
              - Sid: RunBuilds
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - Fn::GetAtt: MakeProject.Arn
                  - Fn::GetAtt: PublishProject.Arn

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name:
        Fn::Sub: port-guard-list-refresh-${EnvironmentName}
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn:
        Fn::GetAtt: PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location:
          Ref: PipelineBucket
      Variables:
        - Name: FORCE
          DefaultValue: "0"
          Description: Set 1 to proceed when a list changed by more than 5% from the last published one (make-refresh.sh FORCE=1)
      Stages:
        - Name: Source
          Actions:
            - Name: FetchBastionScripts
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket:
                  Ref: PipelineBucket
                S3ObjectKey: source/fetch-bastion-scripts.zip
                PollForSourceChanges: "false"
              OutputArtifacts:
                - Name: FetchScript
        - Name: Make
          Actions:
            - Name: MakeListsAndRefreshScripts
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName:
                  Ref: MakeProject
                EnvironmentVariables: '[{"name":"FORCE","value":"#{variables.FORCE}","type":"PLAINTEXT"}]'
              InputArtifacts:
                - Name: FetchScript
              OutputArtifacts:
                - Name: MadeFiles
        - Fn::If:
            - UseApproval
            - Name: Check
              Actions:
                - Name: HumanCheck
                  ActionTypeId:
                    Category: Approval
                    Owner: AWS
                    Provider: Manual
                    Version: "1"
                  Configuration:
                    CustomData: >-
                      Check the make build log (bastion script versions, allow lists fetched, counts, added and
                      removed per list) as in the human workflow before approving.
            - Ref: AWS::NoValue
        - Name: Publish
          Actions:
            - Name: PublishRefreshScripts
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName:
                  Ref: PublishProject
              InputArtifacts:
                - Name: MadeFiles

Outputs:
  PipelineName:
    Value:
      Ref: Pipeline
  PipelineBucketName:
    Value:
      Ref: PipelineBucket
  BastionScriptsUri:
    Description: Upload the five bastion scripts (uncompressed) here
    Value:
      Fn::Sub: s3://${PipelineBucket}/bastion-scripts/command/
  FetchScriptZipUri:
    Description: Upload fetch-bastion-scripts.zip (only fetch-bastion-scripts.sh) here
    Value:
      Fn::Sub: s3://${PipelineBucket}/source/fetch-bastion-scripts.zip
  PublishLocation:
    Description: PORT_GUARD_S3_URI for the human workflow and the pipeline
    Value:
      Fn::Sub:
        - s3://${Bucket}/${PublishKeyPrefix}/${EnvironmentName}/current
        - Bucket:
            Fn::If: [CreatePublishBucket, Ref: PublishBucket, Ref: PublishBucketName]
