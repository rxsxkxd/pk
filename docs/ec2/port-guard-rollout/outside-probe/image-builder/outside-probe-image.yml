AWSTemplateFormatVersion: "2010-09-09"
# 下書き（未検証）。EC2 Image Builder で、海外からの確認の拠点（チェック用のクライアント）の AMI を作る（Amazon Linux 2023）。
# 説明は同じフォルダの README.md。確認の処理 port-guard-probe は ../port-guard-probe と同じものをコンポーネントに埋め込んでいる
# （port-guard-probe を直したら、ここも同じ中身に直して ComponentVersion と RecipeVersion を上げる。テストが食い違いを見つける）。
Description: Outside probe image for port-guard-rollout (Amazon Linux 2023, EC2 Image Builder)

Parameters:
  NamePrefix:
    Type: String
    Default: port-guard-outside-probe
    Description: Image Builder の資源と AMI の名前の先頭
  ComponentVersion:
    Type: String
    Default: 1.0.0
    Description: コンポーネントの版。コンポーネントの中身を変えたら上げる（同じ版のまま中身は変えられない）
  RecipeVersion:
    Type: String
    Default: 1.0.0
    Description: イメージのレシピの版。レシピ・コンポーネントの版・親イメージのどれかを変えたら上げる
  Architecture:
    Type: String
    Default: arm64
    AllowedValues:
      - arm64
      - x86_64
    Description: AMI のアーキテクチャ（既定 arm64。t4g.nano で動かすため）。InstanceType も合わせる
  ParentImage:
    Type: String
    Default: ""
    Description: 親イメージ。空なら AWS が管理する最新の AL2023 のイメージ（Architecture に合わせる）
  InstanceType:
    Type: String
    Default: t4g.small
    Description: ビルドとテストに使うインスタンスタイプ（Architecture と合わせる。x86_64 なら t3.small など）
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: インターネットに出られるサブネット（dnf のリポジトリと、外への接続の確認のため）
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 受信なし、送信は TCP 80・443・22 だけを許可したセキュリティグループ
  LogBucketName:
    Type: String
    Default: ""
    Description: ビルドのログを置く S3 バケット。空ならログを S3 に置かない

Conditions:
  UseManagedParentImage:
    Fn::Equals:
      - Ref: ParentImage
      - ""
  IsArm64:
    Fn::Equals:
      - Ref: Architecture
      - arm64
  HasLogBucket:
    Fn::Not:
      - Fn::Equals:
          - Ref: LogBucketName
          - ""

Resources:
  # ビルド用・テスト用のインスタンスのロール
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/EC2InstanceProfileForImageBuilder
      Policies:
        Fn::If:
          - HasLogBucket
          - - PolicyName: put-build-logs
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action: s3:PutObject
                    Resource:
                      Fn::Sub: arn:${AWS::Partition}:s3:::${LogBucketName}/image-builder/${NamePrefix}/*
          - Ref: AWS::NoValue

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: InstanceRole

  # 確かめる道具を入れ、port-guard-probe を置くコンポーネント
  ProbeComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name:
        Fn::Sub: ${NamePrefix}-tools
      Version:
        Ref: ComponentVersion
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Description: Install probe tools and port-guard-probe
      Data: |
        name: port-guard-outside-probe-tools
        description: Install probe tools and port-guard-probe
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              # python3・curl は AL2023 の AMI に最初から入っている。入っていなくても入るように並べておく
              - name: InstallTools
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - dnf install -y python3 nmap-ncat openssl
                    - dnf clean all
              - name: InstallProbe
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - |
                      cat > /usr/local/bin/port-guard-probe <<'PORT_GUARD_PROBE_EOF'
                      #!/usr/bin/env python3
                      """対象のポートに届いて、相手が応答するかを確かめる（海外からの確認の拠点で使う）。

                          port-guard-probe <対象の IP かホスト名> <ポート>:<確かめ方> [...] [--timeout 秒]
                          例: port-guard-probe 203.0.113.10 80:http 443:tls
                              port-guard-probe 203.0.113.10 22:ssh --timeout 3

                      確かめ方（port_guard_rollout/enable.py の can_connect と同じ判定）:
                          tcp   TCP の接続ができれば届いたとみなす（弱い確認）
                          ssh   SSH のサーバーの最初の応答（SSH-...）を受け取る
                          http  HTTP の応答（HTTP/...）が返る
                          tls   TLS の接続（握手）が終わる（証明書は確かめない）

                      結果（ポートごと）:
                          reachable    届いて、相手が応答した
                          timeout      時間切れ（途中で破棄された。port-guard の遮断はこれになる）
                          refused      接続を拒否された（相手まで届いたが、そのポートで待ち受けていない、または拒否の応答）
                          no-response  TCP の接続はできたが、相手が決まった応答をしなかった（途中の転送や代理の仕組みが接続だけ受け付けた、など）
                          error        そのほか（名前を引けない、経路がない、など）

                      出力は人が読める行と、道具が読む "PG <キー>=<値>" の行（例 PG probe_80=timeout）。
                      終了コード: 0 = すべて reachable、1 = 届かないものがある、2 = 使い方の誤り。
                      Python の標準のライブラリだけを使う（Amazon Linux 2023 の python3 3.9 で動くこと）。
                      """

                      import argparse
                      import socket
                      import ssl
                      import sys

                      KINDS = ("tcp", "ssh", "http", "tls")
                      LABELS = {
                          "reachable": "届く",
                          "timeout": "時間切れ（破棄された）",
                          "refused": "拒否された",
                          "no-response": "接続はできたが応答がない",
                          "error": "そのほかの問題",
                      }


                      def probe(address, port, kind, timeout):
                          """戻り値は (結果, 詳しい内容)。結果は reachable / timeout / refused / no-response / error。"""
                          try:
                              sock = socket.create_connection((address, port), timeout=timeout)
                          except socket.timeout:
                              return "timeout", f"{timeout} 秒で接続できなかった"
                          except ConnectionRefusedError:
                              return "refused", "接続を拒否された"
                          except OSError as error:
                              return "error", str(error)

                          with sock:
                              sock.settimeout(timeout)
                              try:
                                  if kind == "ssh":
                                      banner = sock.recv(64)
                                      if banner.startswith(b"SSH-"):
                                          return "reachable", banner.split(b"\r\n")[0].decode("ascii", "replace")
                                      return "no-response", "SSH のサーバーの応答がない"
                                  if kind == "http":
                                      sock.sendall(f"HEAD / HTTP/1.0\r\nHost: {address}\r\n\r\n".encode("ascii"))
                                      head = sock.recv(64)
                                      if head.startswith(b"HTTP/"):
                                          return "reachable", head.split(b"\r\n")[0].decode("ascii", "replace")
                                      return "no-response", "HTTP の応答がない"
                                  if kind == "tls":
                                      context = ssl.create_default_context()
                                      context.check_hostname = False
                                      context.verify_mode = ssl.CERT_NONE  # 証明書ではなく、相手が応答するかだけを見る
                                      with context.wrap_socket(sock, server_hostname=address) as tls:
                                          return "reachable", tls.version() or "TLS"
                                  return "reachable", "TCP の接続ができた"
                              except (socket.timeout, ssl.SSLError, OSError) as error:
                                  return "no-response", str(error) or type(error).__name__


                      def parse_spec(value):
                          port, _, kind = value.partition(":")
                          if not port.isdigit() or not 1 <= int(port) <= 65535 or kind not in KINDS:
                              raise argparse.ArgumentTypeError(f"<ポート>:<{'|'.join(KINDS)}> の形で書く（{value}）")
                          return int(port), kind


                      def main(argv=None, out=sys.stdout):
                          parser = argparse.ArgumentParser(
                              prog="port-guard-probe",
                              description="対象のポートに届いて、相手が応答するかを確かめる",
                          )
                          parser.add_argument("target", help="対象の IP かホスト名")
                          parser.add_argument("specs", nargs="+", type=parse_spec, metavar="PORT:KIND",
                                              help=f"ポートと確かめ方（{', '.join(KINDS)}）。例 80:http 443:tls")
                          parser.add_argument("--timeout", type=float, default=5.0, help="待ち時間（秒。既定 5）")
                          args = parser.parse_args(argv)

                          print(f"PG target={args.target}", file=out)
                          all_reachable = True
                          for port, kind in args.specs:
                              result, detail = probe(args.target, port, kind, args.timeout)
                              all_reachable = all_reachable and result == "reachable"
                              print(f"  {args.target}:{port}（{kind}）: {LABELS[result]}  {detail}", file=out)
                              print(f"PG probe_{port}={result}", file=out)
                          return 0 if all_reachable else 1


                      if __name__ == "__main__":
                          sys.exit(main())
                      PORT_GUARD_PROBE_EOF
                    - chmod 755 /usr/local/bin/port-guard-probe
          # スナップショットを撮る前に、ビルド用のインスタンスで確かめる
          - name: validate
            steps:
              - name: CheckTools
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - port-guard-probe --help
                    - nc --version
                    - openssl version
                    - port-guard-probe checkip.amazonaws.com 443:tls
          # できた AMI から起動したテスト用のインスタンスで確かめる
          - name: test
            steps:
              - name: CheckToolsOnNewInstance
                action: ExecuteBash
                inputs:
                  commands:
                    - set -euo pipefail
                    - port-guard-probe --help
                    - port-guard-probe checkip.amazonaws.com 443:tls 80:http

  ImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name:
        Ref: NamePrefix
      Version:
        Ref: RecipeVersion
      ParentImage:
        Fn::If:
          - UseManagedParentImage
          - Fn::If:
              - IsArm64
              - Fn::Sub: arn:${AWS::Partition}:imagebuilder:${AWS::Region}:aws:image/amazon-linux-2023-arm64/x.x.x
              - Fn::Sub: arn:${AWS::Partition}:imagebuilder:${AWS::Region}:aws:image/amazon-linux-2023-x86/x.x.x
          - Ref: ParentImage
      Components:
        - ComponentArn:
            Fn::GetAtt:
              - ProbeComponent
              - Arn
      AdditionalInstanceConfiguration:
        SystemsManagerAgent:
          UninstallAfterBuild: false

  InfrastructureConfiguration:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name:
        Ref: NamePrefix
      InstanceProfileName:
        Ref: InstanceProfile
      InstanceTypes:
        - Ref: InstanceType
      SubnetId:
        Ref: SubnetId
      SecurityGroupIds:
        - Ref: SecurityGroupId
      TerminateInstanceOnFailure: true
      InstanceMetadataOptions:
        HttpTokens: required
      Logging:
        Fn::If:
          - HasLogBucket
          - S3Logs:
              S3BucketName:
                Ref: LogBucketName
              S3KeyPrefix:
                Fn::Sub: image-builder/${NamePrefix}
          - Ref: AWS::NoValue

  DistributionConfiguration:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name:
        Ref: NamePrefix
      Distributions:
        - Region:
            Ref: AWS::Region
          AmiDistributionConfiguration:
            Name:
              Fn::Sub: "${NamePrefix}-${Architecture}-{{ imagebuilder:buildDate }}"
            AmiTags:
              Purpose: port-guard-rollout-outside-probe
              Architecture:
                Ref: Architecture
              RecipeVersion:
                Ref: RecipeVersion

  ImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name:
        Ref: NamePrefix
      ImageRecipeArn:
        Fn::GetAtt:
          - ImageRecipe
          - Arn
      InfrastructureConfigurationArn:
        Fn::GetAtt:
          - InfrastructureConfiguration
          - Arn
      DistributionConfigurationArn:
        Fn::GetAtt:
          - DistributionConfiguration
          - Arn
      ImageTestsConfiguration:
        ImageTestsEnabled: true
        TimeoutMinutes: 60
      EnhancedImageMetadataEnabled: true
      Status: ENABLED

Outputs:
  ImagePipelineArn:
    Value:
      Fn::GetAtt:
        - ImagePipeline
        - Arn
  ImageRecipeArn:
    Value:
      Fn::GetAtt:
        - ImageRecipe
        - Arn
