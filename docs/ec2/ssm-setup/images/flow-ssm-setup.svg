<svg xmlns="http://www.w3.org/2000/svg" width="940" height="830" viewBox="0 0 940 830" role="img">

  <style>
    .bg { fill: #ffffff; }
    .box { stroke-width: 1.5; rx: 8; }
    .command { fill: #e8f0fe; stroke: #1a56db; }
    .check { fill: #fff4e5; stroke: #c2410c; }
    .manual { fill: #ecfdf3; stroke: #15803d; stroke-dasharray: 6 4; }
    .done { fill: #f1f5f9; stroke: #475569; }
    .ok { fill: #dcfce7; stroke: #15803d; }
    .ng { fill: #fee2e2; stroke: #b91c1c; }
    .note { fill: #fafafa; stroke: #9ca3af; stroke-dasharray: 3 3; }
    text { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #111827; }
    .t { font-size: 15px; }
    .s { font-size: 12.5px; fill: #374151; }
    .lbl { font-size: 12.5px; fill: #1f2937; }
    .title { font-size: 18px; font-weight: bold; }
    .edge { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .bracket { stroke: #6b7280; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="940" height="830"/>
  <text class="title" x="20" y="30">ssm-setup: SSM の有効化の流れ</text>
  <rect class="box done" x="190" y="60" width="420" height="58"/>
  <text class="t" x="400.0" y="84.5" text-anchor="middle">0. 準備</text>
  <text class="s" x="400.0" y="103.5" text-anchor="middle">対象の一覧・--backup-label・インスタンスプロファイルを用意する</text>
  <rect class="box command" x="190" y="150" width="420" height="58"/>
  <text class="t" x="400.0" y="174.5" text-anchor="middle">1. backup</text>
  <text class="s" x="400.0" y="193.5" text-anchor="middle">AMI を作る（再起動しない・完了は待たない）</text>
  <rect class="box check" x="190" y="240" width="420" height="58"/>
  <text class="t" x="400.0" y="264.5" text-anchor="middle">backup-check（補助）</text>
  <text class="s" x="400.0" y="283.5" text-anchor="middle">作成済み（available）で 12 時間以内か</text>
  <rect class="box command" x="190" y="340" width="420" height="58"/>
  <text class="t" x="400.0" y="364.5" text-anchor="middle">2. ssm-role（AWS の API だけ）</text>
  <text class="s" x="400.0" y="383.5" text-anchor="middle">IAM ロールが未設定の台にインスタンスプロファイルを関連付ける</text>
  <rect class="box command" x="190" y="430" width="420" height="58"/>
  <text class="t" x="400.0" y="454.5" text-anchor="middle">3. ssm-agent（SSH）</text>
  <text class="s" x="400.0" y="473.5" text-anchor="middle">SSM Agent を入れて Online にする</text>
  <rect class="box check" x="190" y="520" width="420" height="58"/>
  <text class="t" x="400.0" y="544.5" text-anchor="middle">4. ssm-check</text>
  <text class="s" x="400.0" y="563.5" text-anchor="middle">ポリシー・Online・SSM でつながるかを確かめる</text>
  <rect class="box done" x="190" y="620" width="420" height="58"/>
  <text class="t" x="400.0" y="644.5" text-anchor="middle">フェーズ 2 へ（port-guard-rollout）</text>
  <text class="s" x="400.0" y="663.5" text-anchor="middle">SSM で入れる台に、iptables ＋ ipset を入れる</text>
  <path class="edge" d="M 400.0 118 L 400.0 150"/>
  <path class="edge" d="M 400.0 208 L 400.0 240"/>
  <path class="edge" d="M 400.0 298 L 400.0 340"/>
  <text class="lbl" x="408.0" y="320" text-anchor="start">そろった</text>
  <path class="edge" d="M 400.0 398 L 400.0 430"/>
  <path class="edge" d="M 400.0 488 L 400.0 520"/>
  <path class="edge" d="M 400.0 578 L 400.0 620"/>
  <text class="lbl" x="408.0" y="600" text-anchor="start">入れる</text>
  <rect class="box done" x="650" y="240" width="180" height="58"/>
  <text class="t" x="740.0" y="264.5" text-anchor="middle">作成を待つ</text>
  <text class="s" x="740.0" y="283.5" text-anchor="middle">（pending）</text>
  <path class="edge" d="M 610 260 L 650 260"/>
  <text class="lbl" x="618" y="254" text-anchor="start">まだ</text>
  <path class="edge" d="M 650 280 L 610 280"/>
  <path class="edge" d="M 190 269 L 120 269 L 120 179 L 190 179"/>
  <text class="s" x="112" y="220" text-anchor="end">12 時間を</text>
  <text class="s" x="112" y="238" text-anchor="end">過ぎたら</text>
  <text class="s" x="112" y="256" text-anchor="end">作り直す</text>
  <rect class="box manual" x="700" y="520" width="210" height="58"/>
  <text class="t" x="805.0" y="544.5" text-anchor="middle">入れない台</text>
  <text class="s" x="805.0" y="563.5" text-anchor="middle">理由を見て直す（手で・2・3）</text>
  <path class="edge" d="M 610 549 L 700 549"/>
  <text class="lbl" x="622" y="541" text-anchor="start">入れない</text>
  <path class="edge" d="M 805 520 L 805 369 L 610 369"/>
  <text class="s" x="813" y="464" text-anchor="start">直したら 2 から</text>
  <rect class="box command" x="650" y="60" width="28" height="16"/>
  <text class="s" x="686" y="73" text-anchor="start">道具のコマンド</text>
  <rect class="box check" x="650" y="84" width="28" height="16"/>
  <text class="s" x="686" y="97" text-anchor="start">確認（道具）</text>
  <rect class="box manual" x="650" y="108" width="28" height="16"/>
  <text class="s" x="686" y="121" text-anchor="start">作業者が手で行う</text>
  <rect class="box done" x="650" y="132" width="28" height="16"/>
  <text class="s" x="686" y="145" text-anchor="start">準備・待ち・次のフェーズ</text>
  <text class="s" x="20" y="730" text-anchor="start">バックアップを操作の前に確かめるのは ssm-agent だけ（インスタンスの中を変えるため。台ごと、操作の直前にも）。</text>
  <text class="s" x="20" y="752" text-anchor="start">ssm-role はインスタンスプロファイルを関連付けるだけ（OS のディスクを変えない）、ssm-check は確かめるだけなので、</text>
  <text class="s" x="20" y="774" text-anchor="start">バックアップを確かめない。どの手順も、OS の再起動は要らない。</text>
</svg>
