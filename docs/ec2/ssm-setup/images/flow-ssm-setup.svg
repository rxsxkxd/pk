<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="790" viewBox="0 0 1030 790" role="img">

  <style>
    .bg { fill: #ffffff; }
    .box { stroke-width: 1.5; rx: 8; }
    .command { fill: #e8f0fe; stroke: #1a56db; }
    .check { fill: #fff4e5; stroke: #c2410c; }
    .manual { fill: #ecfdf3; stroke: #15803d; stroke-dasharray: 6 4; }
    .done { fill: #f1f5f9; stroke: #475569; }
    .ok { fill: #dcfce7; stroke: #15803d; }
    .ng { fill: #fee2e2; stroke: #b91c1c; }
    .note { fill: #fafafa; stroke: #9ca3af; stroke-dasharray: 3 3; }
    text { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #111827; }
    .t { font-size: 15px; }
    .s { font-size: 12.5px; fill: #374151; }
    .lbl { font-size: 12.5px; fill: #1f2937; }
    .title { font-size: 18px; font-weight: bold; }
    .edge { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .bracket { stroke: #6b7280; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1030" height="790"/>
  <text class="title" x="20" y="30">ssm-setup: SSM の有効化の流れ</text>
  <rect class="box done" x="260" y="60" width="420" height="58"/>
  <text class="t" x="470.0" y="84.5" text-anchor="middle">0. 準備</text>
  <text class="s" x="470.0" y="103.5" text-anchor="middle">対象の一覧・インスタンスプロファイルを用意する</text>
  <rect class="box command" x="260" y="150" width="420" height="58"/>
  <text class="t" x="470.0" y="174.5" text-anchor="middle">1. ssm-role（AWS の API だけ）</text>
  <text class="s" x="470.0" y="193.5" text-anchor="middle">IAM ロールが未設定の台にインスタンスプロファイルを関連付ける</text>
  <rect class="box check" x="260" y="240" width="420" height="58"/>
  <text class="t" x="470.0" y="264.5" text-anchor="middle">2. ssm-check</text>
  <text class="s" x="470.0" y="283.5" text-anchor="middle">ポリシー・Online・SSM でつながるかを確かめる</text>
  <rect class="box command" x="260" y="340" width="420" height="58"/>
  <text class="t" x="470.0" y="364.5" text-anchor="middle">3. backup（入れない台だけ）</text>
  <text class="s" x="470.0" y="383.5" text-anchor="middle">AMI を作る（再起動しない・完了は待たない）</text>
  <rect class="box check" x="260" y="430" width="420" height="58"/>
  <text class="t" x="470.0" y="454.5" text-anchor="middle">backup-check（補助）</text>
  <text class="s" x="470.0" y="473.5" text-anchor="middle">作成済み（available）で 12 時間以内か</text>
  <rect class="box command" x="260" y="530" width="420" height="58"/>
  <text class="t" x="470.0" y="554.5" text-anchor="middle">4. ssm-agent（SSH）</text>
  <text class="s" x="470.0" y="573.5" text-anchor="middle">SSM Agent を入れて Online にする</text>
  <path class="edge" d="M 470.0 118 L 470.0 150"/>
  <path class="edge" d="M 470.0 208 L 470.0 240"/>
  <path class="edge" d="M 470.0 298 L 470.0 340"/>
  <text class="lbl" x="478.0" y="324" text-anchor="start">入れない（--ng-out の一覧）</text>
  <path class="edge" d="M 470.0 398 L 470.0 430"/>
  <path class="edge" d="M 470.0 488 L 470.0 530"/>
  <text class="lbl" x="478.0" y="514" text-anchor="start">そろった</text>
  <rect class="box done" x="750" y="240" width="260" height="58"/>
  <text class="t" x="880.0" y="264.5" text-anchor="middle">フェーズ 2 へ（port-guard-rollout）</text>
  <text class="s" x="880.0" y="283.5" text-anchor="middle">SSM で入れる台に iptables ＋ ipset</text>
  <path class="edge" d="M 680 269 L 750 269"/>
  <text class="lbl" x="692" y="261" text-anchor="start">入れる</text>
  <rect class="box done" x="750" y="430" width="180" height="58"/>
  <text class="t" x="840.0" y="454.5" text-anchor="middle">作成を待つ</text>
  <text class="s" x="840.0" y="473.5" text-anchor="middle">（pending）</text>
  <path class="edge" d="M 680 450 L 750 450"/>
  <text class="lbl" x="688" y="444" text-anchor="start">まだ</text>
  <path class="edge" d="M 750 470 L 680 470"/>
  <path class="edge" d="M 260 459 L 200 459 L 200 369 L 260 369"/>
  <text class="s" x="192" y="404" text-anchor="end">12 時間を</text>
  <text class="s" x="192" y="422" text-anchor="end">過ぎたら</text>
  <text class="s" x="192" y="440" text-anchor="end">作り直す</text>
  <path class="edge" d="M 260 559 L 40 559 L 40 269 L 260 269"/>
  <text class="s" x="48" y="552" text-anchor="start">5. もう一度確かめる</text>
  <rect class="box manual" x="750" y="530" width="260" height="58"/>
  <text class="t" x="880.0" y="554.5" text-anchor="middle">5 の後も入れない台</text>
  <text class="s" x="880.0" y="573.5" text-anchor="middle">理由を見て手で直す（道具では行わない）</text>
  <rect class="box command" x="750" y="60" width="28" height="16"/>
  <text class="s" x="786" y="73" text-anchor="start">道具のコマンド</text>
  <rect class="box check" x="750" y="84" width="28" height="16"/>
  <text class="s" x="786" y="97" text-anchor="start">確認（道具）</text>
  <rect class="box manual" x="750" y="108" width="28" height="16"/>
  <text class="s" x="786" y="121" text-anchor="start">作業者が手で行う</text>
  <rect class="box done" x="750" y="132" width="28" height="16"/>
  <text class="s" x="786" y="145" text-anchor="start">準備・待ち・次のフェーズ</text>
  <text class="s" x="20" y="650" text-anchor="start">ほとんどの台は、SSM Agent は入って動いていて、IAM ロールがないだけと見込んでいる。まずインスタンスプロファイルを関連付けて確かめ、</text>
  <text class="s" x="20" y="672" text-anchor="start">それでも入れない台だけに SSM Agent を入れる。バックアップが要るのは、インスタンスの中を変える ssm-agent だけなので、</text>
  <text class="s" x="20" y="694" text-anchor="start">ssm-check で入れなかった台だけに取る（ssm-role はインスタンスプロファイルを関連付けるだけ、ssm-check は確かめるだけ）。</text>
  <text class="s" x="20" y="716" text-anchor="start">ssm-check --ng-out で書き出した一覧を、そのまま backup・backup-check・ssm-agent の標準入力に渡す。どの手順も、OS の再起動は要らない。</text>
</svg>
