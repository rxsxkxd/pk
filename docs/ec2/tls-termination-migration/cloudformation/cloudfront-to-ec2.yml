AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CloudFront -> EC2. CloudFront terminates viewer TLS and connects to httpd over HTTPS.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  CloudFrontPrefixListId:
    Type: String
    Description: Prefix list ID of com.amazonaws.global.cloudfront.origin-facing in this Region.
    AllowedPattern: "^pl-[0-9a-f]+$"
  DomainName:
    Type: String
    Description: Domain name used by viewers.
  OriginDomainName:
    Type: String
    Description: Public DNS name that resolves to the instance. Must differ from DomainName.
  CloudFrontCertificateArn:
    Type: String
    Description: ACM certificate in us-east-1 that covers DomainName.
    AllowedPattern: "^arn:aws:acm:us-east-1:.*"
  OriginVerifyHeaderName:
    Type: String
    Default: X-Origin-Verify
  OriginVerifyHeaderValue:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret value that httpd checks to reject requests that bypass this distribution.
  OriginReadTimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 120
  OriginKeepaliveTimeoutSeconds:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 300
  GeoRestrictionType:
    Type: String
    Default: whitelist
    AllowedValues: [whitelist, none]
    Description: whitelist allows only the countries in GeoRestrictionCountries. none disables the restriction.
  GeoRestrictionCountries:
    Type: CommaDelimitedList
    Default: JP
    Description: ISO 3166-1 alpha-2 country codes allowed when GeoRestrictionType is whitelist.
  CloudFrontWebAclArn:
    Type: String
    Default: ""
    Description: Optional. AWS WAF web ACL created in us-east-1 (CLOUDFRONT scope).

Conditions:
  HasGeoRestriction:
    Fn::Equals:
      - Ref: GeoRestrictionType
      - whitelist
  HasCloudFrontWebAcl:
    Fn::Not:
      - Fn::Equals:
          - Ref: CloudFrontWebAclArn
          - ""

Resources:
  OriginSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from CloudFront origin-facing servers. Attach it to the instance.
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId:
            Ref: CloudFrontPrefixListId

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: false
        Restrictions:
          GeoRestriction:
            RestrictionType:
              Ref: GeoRestrictionType
            Locations:
              Fn::If:
                - HasGeoRestriction
                - Ref: GeoRestrictionCountries
                - Ref: AWS::NoValue
        Aliases:
          - Ref: DomainName
        ViewerCertificate:
          AcmCertificateArn:
            Ref: CloudFrontCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        WebACLId:
          Fn::If:
            - HasCloudFrontWebAcl
            - Ref: CloudFrontWebAclArn
            - Ref: AWS::NoValue
        Origins:
          - Id: ec2-origin
            DomainName:
              Ref: OriginDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout:
                Ref: OriginReadTimeoutSeconds
              OriginKeepaliveTimeout:
                Ref: OriginKeepaliveTimeoutSeconds
            OriginCustomHeaders:
              - HeaderName:
                  Ref: OriginVerifyHeaderName
                HeaderValue:
                  Ref: OriginVerifyHeaderValue
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Managed-CachingDisabled
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

Outputs:
  DistributionDomainName:
    Value:
      Fn::GetAtt: [Distribution, DomainName]
  OriginSecurityGroupId:
    Description: Attach this security group to the instance before switching DNS.
    Value:
      Fn::GetAtt: [OriginSecurityGroup, GroupId]
