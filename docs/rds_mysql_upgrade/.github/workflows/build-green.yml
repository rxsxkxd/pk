name: Build Green

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象環境
        required: true
        type: choice
        options: [staging, production]
      service:
        description: config 内のサービス名
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-green:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install AWS CLI v2 from local package (act only)
        if: ${{ env.ACT }}
        env:
          ACT_AWSCLI_PACKAGE_DIR: ${{ env.ACT_AWSCLI_PACKAGE_DIR }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) package_name=awscli-exe-linux-x86_64.zip ;;
            aarch64|arm64) package_name=awscli-exe-linux-aarch64.zip ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          package_path="${ACT_AWSCLI_PACKAGE_DIR:-/act-assets/awscli}/${package_name}"
          test -r "$package_path" || { echo "AWS CLI package is missing: $package_path" >&2; exit 2; }
          temporary_dir=$(mktemp -d /tmp/awscli-installer.XXXXXX)
          trap 'rm -rf "$temporary_dir"' EXIT
          unzip -q "$package_path" -d "$temporary_dir"
          sudo "$temporary_dir/aws/install" --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin --update
          aws --version
      - uses: aws-actions/configure-aws-credentials@v5
        # nektos/act は GitHub OIDC トークンを発行できない。ローカルでは .actrc が
        # read-only でマウントする AWS プロファイルをそのまま使う。
        if: ${{ !env.ACT }}
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Step 3 — snapshot and create Green
        run: scripts/build_green.sh --config config/blue-green/${{ inputs.environment }}.yml --service '${{ inputs.service }}' --output-dir artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-green-${{ inputs.environment }}-${{ inputs.service }}
          path: artifacts
