name: Verify Green

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象環境
        required: true
        type: choice
        options: [staging, production]
      service:
        description: config 内のサービス名
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install AWS CLI v2 from local package (act only)
        if: ${{ env.ACT }}
        env:
          ACT_AWSCLI_PACKAGE_DIR: ${{ env.ACT_AWSCLI_PACKAGE_DIR }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) package_name=awscli-exe-linux-x86_64.zip ;;
            aarch64|arm64) package_name=awscli-exe-linux-aarch64.zip ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          package_path="${ACT_AWSCLI_PACKAGE_DIR:-/act-assets/awscli}/${package_name}"
          test -r "$package_path" || { echo "AWS CLI package is missing: $package_path" >&2; exit 2; }
          temporary_dir=$(mktemp -d /tmp/awscli-installer.XXXXXX)
          trap 'rm -rf "$temporary_dir"' EXIT
          unzip -q "$package_path" -d "$temporary_dir"
          sudo "$temporary_dir/aws/install" --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin --update
          aws --version
      - uses: aws-actions/configure-aws-credentials@v5
        # nektos/act は GitHub OIDC トークンを発行できない。ローカルでは .actrc が
        # read-only でマウントする AWS プロファイルをそのまま使う。
        if: ${{ !env.ACT }}
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Prepare Python YAML parser
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Build Green verification report binary
        run: |
          case "$(uname -m)" in
            x86_64) build_platform=linux/amd64 ;;
            aarch64|arm64) build_platform=linux/arm64 ;;
            *) echo "Unsupported CPU architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          docker buildx build \
            --platform "$build_platform" \
            --file ci/Dockerfile.green-verification-report \
            --target export \
            --output type=local,dest=.tools/green-report \
            .
      # MySQL 実効値収集を行うかは config の mysql_verification.enabled が決める。
      # 接続方式（secrets_manager / parameter_store / plaintext / prompt）も config が持ち、
      # verify_green.sh が解決する。prompt は対話入力のため CI では成立しない。
      - name: Install MySQL client when the config requires runtime collection
        run: |
          enabled=$(python3 -c 'import sys, yaml; d = yaml.safe_load(open(sys.argv[1])); m = d["services"][sys.argv[2]].get("mysql_verification") or {}; print("true" if m.get("enabled") else "false")' 'config/blue-green/${{ inputs.environment }}.yml' '${{ inputs.service }}')
          echo "mysql_verification.enabled=$enabled"
          if [ "$enabled" = "true" ]; then
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi
      - name: Step 4 — verify Green configuration and replication lag
        run: GREEN_REPORT_GENERATOR="$PWD/.tools/green-report/generate_green_verification_report" scripts/verify_green.sh --config 'config/blue-green/${{ inputs.environment }}.yml' --service '${{ inputs.service }}' --output-dir artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-green-${{ inputs.environment }}-${{ inputs.service }}
          path: artifacts
