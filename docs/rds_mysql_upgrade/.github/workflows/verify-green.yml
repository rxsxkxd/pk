name: Verify Green

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象環境
        required: true
        type: choice
        options: [staging, production]
      service:
        description: config 内のサービス名
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install AWS CLI v2 from local package (act only)
        if: ${{ env.ACT }}
        env:
          ACT_AWSCLI_PACKAGE_DIR: ${{ env.ACT_AWSCLI_PACKAGE_DIR }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) package_name=awscli-exe-linux-x86_64.zip ;;
            aarch64|arm64) package_name=awscli-exe-linux-aarch64.zip ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          package_path="${ACT_AWSCLI_PACKAGE_DIR:-/act-assets/awscli}/${package_name}"
          test -r "$package_path" || { echo "AWS CLI package is missing: $package_path" >&2; exit 2; }
          temporary_dir=$(mktemp -d /tmp/awscli-installer.XXXXXX)
          trap 'rm -rf "$temporary_dir"' EXIT
          unzip -q "$package_path" -d "$temporary_dir"
          sudo "$temporary_dir/aws/install" --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin --update
          aws --version
      - uses: aws-actions/configure-aws-credentials@v5
        # nektos/act は GitHub OIDC トークンを発行できない。ローカルでは .actrc が
        # read-only でマウントする AWS プロファイルをそのまま使う。
        if: ${{ !env.ACT }}
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Check Ruby for YAML parsing
        # 設定 YAML の読み取りに Ruby の標準ライブラリ（psych / json）を使う。
        # GitHub のランナーには Ruby が同梱されているため導入は不要で、
        # 欠けている場合にここで早く落とすための確認である。
        run: ruby --version
      - name: Build Step 4 binaries
        # CodeBuild と同じ手順でビルドする（Docker は使わない）。依存は go.sum に固定済み。
        # 3 本とも必要である。
        #   collect_green_state                … AWS の状態収集
        #   collect_green_runtime_values       … Green DB の実効値収集
        #   generate_green_verification_report … 突き合わせとレポート（.md）の組み立て
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o .tools/green-report/generate_green_verification_report ./scripts/generate_green_verification_report
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o .tools/green-report/collect_green_runtime_values ./scripts/collect_green_runtime_values
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o .tools/green-report/collect_green_state ./scripts/collect_green_state
      # MySQL 実効値収集を行うかは config の mysql_verification.enabled が決める。
      # 接続方式（parameter_store / plaintext / prompt）も config が持ち、
      # verify_green.sh が解決する。prompt は対話入力のため CI では成立しない。
      #
      # **MySQL クライアントは導入しない。**収集は上でビルドした Go バイナリが行う
      # （RDS のトラストストアも go:embed で内蔵している）。
      - name: Report whether runtime collection is enabled
        run: |
          # 設定の読み取りはスクリプト本体と同じ経路を使う（Ruby で YAML→JSON、jq で取り出し）。
          . scripts/lib/deployment_config.sh
          deployment_config_eval 'config/blue-green/${{ inputs.environment }}.deployment.yml' '${{ inputs.service }}' '
            service($service) as $svc | {
              enabled: (if ($svc.mysql_verification.enabled // false) then "true" else "false" end),
            } | shellvars'
          echo "mysql_verification.enabled=$enabled"
      - name: Step 4 — verify Green configuration and replication lag
        env:
          GREEN_REPORT_GENERATOR: ${{ github.workspace }}/.tools/green-report/generate_green_verification_report
          GREEN_RUNTIME_COLLECTOR: ${{ github.workspace }}/.tools/green-report/collect_green_runtime_values
          GREEN_STATE_COLLECTOR: ${{ github.workspace }}/.tools/green-report/collect_green_state
        run: scripts/verify_green.sh --config 'config/blue-green/${{ inputs.environment }}.deployment.yml' --service '${{ inputs.service }}' --output-dir artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-green-${{ inputs.environment }}-${{ inputs.service }}
          path: artifacts
