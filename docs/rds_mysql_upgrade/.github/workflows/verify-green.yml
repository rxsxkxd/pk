name: Verify Green

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象環境
        required: true
        type: choice
        options: [staging, production]
      service:
        description: config 内のサービス名
        required: true
        type: string
      collect_mysql_runtime_values:
        description: Green DB に MySQL 接続して実効値を収集する（ネットワーク到達性と Secrets が必要）
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Install MySQL client
        if: inputs.collect_mysql_runtime_values
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Check database connection secrets
        if: inputs.collect_mysql_runtime_values
        env:
          # GitHub Environment ごとに設定する Secrets。値はログ・成果物へ出力しない。
          MYSQL_USER: ${{ secrets.RDS_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.RDS_MYSQL_PASSWORD }}
        run: test -n "$MYSQL_USER" && test -n "$MYSQL_PASSWORD"
      - name: Step 4 — verify Green configuration and replication lag (AWS API only)
        if: ${{ !inputs.collect_mysql_runtime_values }}
        run: scripts/verify_green.sh --config config/blue-green/${{ inputs.environment }}.yml --service '${{ inputs.service }}' --output-dir artifacts
      - name: Step 4 — verify Green configuration, replication lag, and MySQL runtime values
        if: inputs.collect_mysql_runtime_values
        env:
          MYSQL_USER: ${{ secrets.RDS_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.RDS_MYSQL_PASSWORD }}
        run: scripts/verify_green.sh --config config/blue-green/${{ inputs.environment }}.yml --service '${{ inputs.service }}' --mysql-user "$MYSQL_USER" --mysql-password-env MYSQL_PASSWORD --output-dir artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-green-${{ inputs.environment }}-${{ inputs.service }}
          path: artifacts
