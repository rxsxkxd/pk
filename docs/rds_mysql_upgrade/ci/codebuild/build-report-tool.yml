# Step 4 のレポート生成器（Go）をビルドするだけの buildspec。
#
# 実行と分けてある理由:
#   - VerifyGreen は Green DB へ到達するため VPC 内へ配置する場合がある。
#     その経路に Go module の取得（proxy.golang.org）を持ち込みたくない。
#   - ビルドは AWS を一切呼ばない。失敗しても RDS には何の影響もない。
#
# 成果物は .tools/green-report/ 配下の 2 本である（AWS の状態収集は Ruby の scripts/lib/green_state.rb）。
#   collect_green_runtime_values       … Green DB の実効値収集（MySQL クライアントの代替）
#   generate_green_verification_report … 突き合わせ（--check）とレポート（.md）の組み立て
# 実行側（verify-green.yml）は GREEN_RUNTIME_COLLECTOR / GREEN_REPORT_GENERATOR で受け取る。
#
# 実効値収集を Go にしてある理由: VerifyGreen は RDS のある VPC 内で動かす場合があり、
# そこから apt リポジトリへ到達できないため mysql クライアントを実行時に導入できない。
# aws/codebuild/standard:8.0 も mysql クライアントを含まない。
#
# 各コマンドは POSIX シェル互換で書いてある（`[[ ]]` / `<<<` / `-o pipefail` を使わない）。
version: 0.2

env:
  # Linux で指定できるのは bash または /bin/sh。明示しておく。
  shell: bash
  variables:
    # managed runtime の Go が go.mod の要求より古い場合に、必要なツールチェーンを
    # 自動取得させる（Go 1.21 以降の既定動作。明示して意図を残す）。
    GOTOOLCHAIN: auto

phases:
  install:
    # Docker のマルチステージビルドをやめたため PrivilegedMode は不要である。
    runtime-versions:
      golang: 1.26
    commands:
      # --- Go 1.26.10 へ切り替える（できなければ runtime-versions の 1.26 のまま進む）------
      # CodeBuild は runtime-versions を `goenv global <版>` で選ぶので、後から goenv global を
      # 実行すれば上書きできる。イメージ同梱の goenv は新しい Go の定義を持たないことがあるので、
      # 先に goenv 自体を更新する（git で入っている。外部ネットワークが要る）。
      # **どの手順も失敗してよい。**失敗したら理由を出して先へ進み、そのままの Go でビルドする
      # （Local Agent で使う golang:1.25 のイメージには goenv が無いので、ここは全部素通りになる）。
      # 1 行ずつ分け、失敗は `|| echo` で受ける（set -e を使わない。理由は read-approvals.yml）。
      # goenv が無いと `git -C ""` になり、カレントディレクトリ（ソース）を pull してしまうので、
      # goenv があるときだけ更新する。
      - command -v goenv >/dev/null && git -C "$(goenv root)" pull --ff-only || echo 'goenv を更新できなかった（または goenv が無い）。手元の goenv のまま進める'
      - goenv --version || echo 'goenv が無い。Go の切り替えはせずに進める'
      - goenv install --skip-existing 1.26.10 && goenv global 1.26.10 || echo 'Go 1.26.10 へ切り替えられなかった。今の Go のままビルドする'
      # 使う Go を記録する。go.mod の go ディレクティブ（1.25）を満たさない場合は
      # GOTOOLCHAIN=auto が必要なツールチェーンを取得する（要ネットワーク）。
      - go version

  pre_build:
    commands:
      # --- 期待する構成を検査し、モジュールルートを決める --------------------
      # 検査の中身は scripts/resolve_go_module_root.sh にある（構成の期待も
      # そこにコメントで書いてある）。buildspec からも、ローカルからも同じものを使う。
      #
      # 標準出力にはモジュールルートだけが載る。診断は標準エラーへ出る。
      # 構成が期待と違えば `構成が…` で始まるメッセージを出して終了コード 1 を返す。
      #
      # **代入の形で受ける。**代入の行は `$(...)` の終了コードを返すので、失敗すれば
      # CodeBuild がここで止める。`eval "$(...)"` の形にすると終了コードが eval のものに化ける。
      #
      # **set -e / set -u をこのシェルに残さない（予防）。**CodeBuild はフェーズの終わりに自分の
      # 後処理も同じシェルで動かすので、シェルの設定を後処理へ持ち込まない。コマンドを 1 行ずつ
      # 分けて、失敗の検出は CodeBuild に任せる。
      #
      # 実行ビットは CodePipeline の artifact で落ちることがあるため、
      # chmod に頼らず bash へ明示的に渡す。
      - module_dir=$(bash scripts/resolve_go_module_root.sh)
      - echo "MODULE_DIR=$module_dir"
      # build フェーズへ渡す。シェル変数や cwd がフェーズをまたいで残るかは
      # 保証されないため、ファイル経由という確実な方法にしておく。
      - echo "$module_dir" > /tmp/module_dir


  build:
    commands:
      # 依存は go.sum に固定済み。静的リンクにして、実行側に Go を要求しない。
      #
      # -o は絶対パスで CODEBUILD_SRC_DIR 直下へ出す。モジュールルートが
      # CODEBUILD_SRC_DIR と一致しない場合でも、artifacts の files
      # （CODEBUILD_SRC_DIR 相対）が常に成立するようにするためである。
      # 複数の命令を失敗でまとめて止めたいので、set -e はサブシェル（( )）の中だけで使う。
      # 外側の CodeBuild のシェルへは残らない。
      - |
        (
        set -e
        out_dir=${CODEBUILD_SRC_DIR:-$(pwd)}/.tools/green-report
        mkdir -p "$out_dir"
        cd "$(cat /tmp/module_dir)"
        CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
          -o "$out_dir/generate_green_verification_report" ./scripts/generate_green_verification_report
        # RDS のトラストストアは go:embed でこのバイナリへ焼き込まれる。
        # 実行側は VPC 内から外部へ出られないため、実行時に取得する選択肢が無い。
        CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
          -o "$out_dir/collect_green_runtime_values" ./scripts/collect_green_runtime_values
        )

artifacts:
  files:
    - .tools/green-report/generate_green_verification_report
    - .tools/green-report/collect_green_runtime_values
  discard-paths: false
