# Step 4 のレポート生成器（Go）をビルドするだけの buildspec。
#
# 実行と分けてある理由:
#   - VerifyGreen は Green DB へ到達するため VPC 内へ配置する場合がある。
#     その経路に Go module の取得（proxy.golang.org）を持ち込みたくない。
#   - ビルドは AWS を一切呼ばない。失敗しても RDS には何の影響もない。
#
# 成果物は .tools/green-report/ 配下の 2 本である。
#   generate_green_verification_report … レポート（.md）の組み立て
#   collect_green_runtime_values       … Green DB の実効値収集（MySQL クライアントの代替）
# 実行側（verify-green.yml）は GREEN_REPORT_GENERATOR と GREEN_RUNTIME_COLLECTOR で受け取る。
#
# 実効値収集を Go にしてある理由: VerifyGreen は RDS のある VPC 内で動かす場合があり、
# そこから apt リポジトリへ到達できないため mysql クライアントを実行時に導入できない。
# aws/codebuild/standard:7.0 も mysql クライアントを含まない。
#
# 各コマンドは POSIX シェル互換で書いてある（`[[ ]]` / `<<<` / `-o pipefail` を使わない）。
version: 0.2

env:
  # Linux で指定できるのは bash または /bin/sh。明示しておく。
  shell: bash
  variables:
    # managed runtime の Go が go.mod の要求より古い場合に、必要なツールチェーンを
    # 自動取得させる（Go 1.21 以降の既定動作。明示して意図を残す）。
    GOTOOLCHAIN: auto

phases:
  install:
    # Docker のマルチステージビルドをやめたため PrivilegedMode は不要である。
    runtime-versions:
      golang: 1.25
    commands:
      # 使う Go を記録する。go.mod の go ディレクティブ（1.25）を満たさない場合は
      # GOTOOLCHAIN=auto が必要なツールチェーンを取得する（要ネットワーク）。
      - go version

  pre_build:
    commands:
      # --- 期待する構成を検査する ------------------------------------------
      # Go のモジュールはプロジェクト直下の go.mod ただ 1 つで、レポート生成器は
      # その直下の scripts/ にある main パッケージである。
      #
      #   <モジュールルート>/go.mod                       module rds-mysql-upgrade
      #   <モジュールルート>/scripts/                     package main（ビルド対象）
      #   <モジュールルート>/tools/                       人が実行するコマンド
      #
      # **この形から外れていたら、黙って別のものをビルドせずに落とす。**
      # module モードには相対 import が無く、モジュール内の import はすべて
      # go.mod の module 行を接頭辞に持つ。そのため go.mod の位置がずれると
      # Go は rds-mysql-upgrade/... を外部モジュール扱いして失敗し、
      # エラー文にモジュール名が出るため原因がモジュール名に見えてしまう。
      # 実際の原因は構成のずれなので、ここで構成として指摘する。
      #
      # CODEBUILD_SRC_DIR がリポジトリのどこを指すかは source の設定次第なので、
      # cwd には依存せずモジュールルートを自力で突き止める。
      - |
        set -e
        # CODEBUILD_SRC_DIR はシンボリックリンクである
        # （/codebuild/output/srcNNN/src -> /codebuild/output/srcDownload/src）。
        # find は起点がシンボリックリンクのとき既定で辿らないため、
        # 実体のパスへ解決してから探索する。これを忘れると go.mod が
        # 1 件も見つからず「構成が期待と違う」で落ちる。
        search_root=$(cd "${CODEBUILD_SRC_DIR:-$(pwd)}" && pwd -P)

        # module 行で選ぶ。examples 配下の probe は別モジュール（module tzprobe）
        # なので拾わない。
        found=$(find "$search_root" -maxdepth 4 -name go.mod -type f 2>/dev/null \
                | while IFS= read -r f; do
                    if grep -q '^module[[:space:]]\+rds-mysql-upgrade$' "$f"; then echo "$f"; fi
                  done)

        count=$(printf '%s\n' "$found" | grep -c . || true)
        if [ "$count" -eq 0 ]; then
          echo '構成が期待と違う: module rds-mysql-upgrade の go.mod が無い。' >&2
          echo "探索した場所: ${search_root}（maxdepth 4）" >&2
          echo '見つかった go.mod:' >&2
          find "$search_root" -maxdepth 4 -name go.mod -type f 2>/dev/null >&2 || echo '  （1 件も無い）' >&2
          echo 'go.mod と go.sum がリポジトリに入っているか確認する（git ls-files go.mod go.sum）。' >&2
          exit 1
        fi
        if [ "$count" -gt 1 ]; then
          echo '構成が期待と違う: module rds-mysql-upgrade の go.mod が複数ある。' >&2
          printf '%s\n' "$found" >&2
          echo 'モジュールはプロジェクト直下の 1 つだけである。重複したチェックアウトを取り除く。' >&2
          exit 1
        fi

        MODULE_DIR=$(cd "$(dirname "$found")" && pwd)

        # 旧構成（go.mod が scripts/ 配下）を名指しで拒否する。この形だと
        # scripts/ から親の internal/ が見えず、ビルド対象の指定も変わる。
        if [ "$(basename "$MODULE_DIR")" = scripts ]; then
          echo '構成が古い: go.mod が scripts/ 配下にある。' >&2
          echo "  見つかった go.mod: $found" >&2
          echo 'go.mod と go.sum はプロジェクト直下へ置く構成に変わっている。' >&2
          echo 'ビルド対象のブランチ／コミットが古い可能性が高い。' >&2
          exit 1
        fi
        if [ -f "$MODULE_DIR/scripts/go.mod" ]; then
          echo '構成が期待と違う: scripts/go.mod が残っている。' >&2
          echo 'モジュールはプロジェクト直下の go.mod だけである。scripts/go.mod は削除する。' >&2
          exit 1
        fi

        # ビルド対象のソースがあること（2 本とも）。
        for required in scripts/generate_green_verification_report.go \
                        scripts/collect_green_runtime_values/main.go \
                        scripts/collect_green_runtime_values/rds-global-bundle.pem; do
          if [ ! -f "$MODULE_DIR/$required" ]; then
            echo "構成が期待と違う: $required が無い。" >&2
            echo "モジュールルート: $MODULE_DIR" >&2
            ls -la "$MODULE_DIR" >&2 || true
            exit 1
          fi
        done
        # 依存は go.sum で固定する前提である（CI では go mod tidy をしない）。
        if [ ! -f "$MODULE_DIR/go.sum" ]; then
          echo '構成が期待と違う: go.sum が無い。' >&2
          echo 'ローカルで go mod tidy を実行し、go.mod と go.sum の両方を commit する。' >&2
          exit 1
        fi

        echo "MODULE_DIR=$MODULE_DIR"
        # build フェーズへ渡す。シェル変数や cwd がフェーズをまたいで残るかは
        # 保証されないため、ファイル経由という確実な方法にしておく。
        echo "$MODULE_DIR" > /tmp/module_dir

      # --- 失敗したときに原因を一目で分かるようにする診断 --------------------
      # GO111MODULE が off なら GOPATH モード（go.mod が無視される）。
      # GOFLAGS が空でなければ -mod=vendor などが混ざっていないか見る。
      - go env GO111MODULE GOFLAGS GOPATH GOMODCACHE GOTOOLCHAIN
      # 掴んだモジュールと、ビルド対象が main パッケージであることを確認する。
      # 期待は `rds-mysql-upgrade` と、2 本の main パッケージである。
      - cd "$(cat /tmp/module_dir)" && go list -m
      - cd "$(cat /tmp/module_dir)" && go list -f '{{.ImportPath}} ({{.Name}})' ./scripts ./scripts/collect_green_runtime_values

  build:
    commands:
      # 依存は go.sum に固定済み。静的リンクにして、実行側に Go を要求しない。
      #
      # -o は絶対パスで CODEBUILD_SRC_DIR 直下へ出す。モジュールルートが
      # CODEBUILD_SRC_DIR と一致しない場合でも、artifacts の files
      # （CODEBUILD_SRC_DIR 相対）が常に成立するようにするためである。
      - |
        set -e
        out_dir=${CODEBUILD_SRC_DIR:-$(pwd)}/.tools/green-report
        mkdir -p "$out_dir"
        cd "$(cat /tmp/module_dir)"
        CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
          -o "$out_dir/generate_green_verification_report" ./scripts
        # RDS のトラストストアは go:embed でこのバイナリへ焼き込まれる。
        # 実行側は VPC 内から外部へ出られないため、実行時に取得する選択肢が無い。
        CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
          -o "$out_dir/collect_green_runtime_values" ./scripts/collect_green_runtime_values
      # バイナリができたことを確認する。
      - ls -l "${CODEBUILD_SRC_DIR:-$(pwd)}/.tools/green-report/"
      # AWS も DB も呼ばずに動くことだけ確かめる（引数不足で usage を出して落ちるのが正常）。
      - |
        out_dir=${CODEBUILD_SRC_DIR:-$(pwd)}/.tools/green-report
        "$out_dir/generate_green_verification_report" --help 2>&1 | head -1 || true
        "$out_dir/collect_green_runtime_values" 2>&1 | head -1 || true

artifacts:
  files:
    - .tools/green-report/generate_green_verification_report
    - .tools/green-report/collect_green_runtime_values
  discard-paths: false
