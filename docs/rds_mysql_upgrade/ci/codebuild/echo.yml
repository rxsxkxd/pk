# CodeBuild / Local Agent の疎通確認専用 buildspec。AWS API は呼び出さない。
version: 0.2

env:
  # Linux で指定できるのは bash または /bin/sh。既定シェルに依存しないよう明示する。
  shell: bash

phases:
  install:
    commands:
      # --- 診断: sh / bash 問題の切り分け用。原因が確定したら削除する ---------
      # 実行ビットが落ちていないか（左端が -rwxr-xr-x であること）
      - ls -l scripts/*.sh scripts/lib/*.sh
      # shebang が壊れていないか（先頭が #!/usr/bin/env bash であること）
      - head -1 scripts/verify_green.sh | od -c | head -1
      # このコマンドを実行しているシェルと bash の所在
      - 'echo "shell=$0 bash=$(command -v bash)"; bash --version | head -1'
      # --- 診断ここまで -----------------------------------------------------
      # CodePipeline のソースアーティファクト（ZIP）では実行ビットが失われることがある。
      # 落ちていれば復元し、落ちていなければ何も変わらない。
      - chmod +x scripts/*.sh scripts/lib/*.sh
      - echo 'Entered install phase.'
      - python3 --version
      - aws --version
  build:
    commands:
      - echo 'Entered build phase. No AWS changes are made.'
      - echo "CONFIG_FILE=${CONFIG_FILE:-not-set}"
      - echo "SERVICE_NAME=${SERVICE_NAME:-not-set}"
      - mkdir -p artifacts
      - echo 'CodeBuild echo build completed.' > artifacts/echo-result.txt

artifacts:
  files:
    - artifacts/echo-result.txt
  discard-paths: false
