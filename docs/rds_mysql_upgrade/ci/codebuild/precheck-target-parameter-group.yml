# BuildGreen の前に実行する、移行先 DB パラメータグループの事前確認専用 buildspec。
# AWS API は describe-db-parameter-groups（読み取り）だけを使用し、RDS の変更操作は行わない。
version: 0.2

env:
  # Linux で指定できるのは bash または /bin/sh。既定シェルに依存しないよう明示する。
  shell: bash

phases:
  install:
    commands:
      # CodePipeline のソースアーティファクト（ZIP）では実行ビットが失われることがある。
      # 落ちていれば復元し、落ちていなければ何も変わらない。
      - chmod +x scripts/*.sh scripts/lib/*.sh
      - python3 -c 'import yaml' || python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
  build:
    commands:
      - scripts/check_target_parameter_group.sh --config "$CONFIG_FILE" --service "$SERVICE_NAME" --output-dir artifacts

artifacts:
  files:
    - artifacts/target-db-parameter-group.json
    - artifacts/target-parameter-group-check.md
  discard-paths: false
