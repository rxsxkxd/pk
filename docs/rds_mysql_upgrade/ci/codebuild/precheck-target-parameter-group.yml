# 構築前チェック（BuildGreen の直前）: 移行先 DB パラメータグループの確認専用 buildspec。
# Step 1 の成立条件チェック（ローカル）とは別物である。
# AWS API は describe-db-parameter-groups（読み取り）だけを使用し、RDS の変更操作は行わない。
version: 0.2

env:
  # Linux で指定できるのは bash または /bin/sh。既定シェルに依存しないよう明示する。
  shell: bash

phases:
  install:
    commands:
      # 設定 YAML の読み取りに Ruby の標準ライブラリ（psych / json）を使う。
      # 追加パッケージの導入は不要で、PyPI へも到達しない。
      # CodeBuild の managed image は rbenv で複数の Ruby を持つため、使う版を固定する。
      # Local Agent 用のランナー image は rbenv を持たず Ruby を固定済みなので何もしない。
      - if command -v rbenv >/dev/null 2>&1; then rbenv local 3.4.10; fi
      - ruby --version
      # CodePipeline のソースアーティファクト（ZIP）では実行ビットが失われることがある。
      # 落ちていれば復元し、落ちていなければ何も変わらない。
      - chmod +x scripts/*.sh
  build:
    commands:
      # 実行ビットに頼らず ruby へ明示的に渡す（CodePipeline の artifact で落ちうるため）。
      - ruby scripts/check_target_parameter_group.rb --config "$CONFIG_FILE" --service "$SERVICE_NAME" --output-dir artifacts

artifacts:
  files:
    - artifacts/target-db-parameter-group.json
    - artifacts/target-parameter-group-check.md
  discard-paths: false
