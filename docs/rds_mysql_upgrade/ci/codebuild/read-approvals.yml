# 設定ファイルの actions（承認宣言）をパイプライン変数として公開する buildspec。
#
# AWS API は呼び出さない。config を読むだけである。
# ここで公開した変数を、後続ステージの BeforeEntry 条件（VariableCheck）が参照し、
# 承認していないフェーズのステージをスキップする。
#
# これにより手動承認は「config で承認済みのフェーズ」でだけ表示される。
# 承認ゲートの実体は従来どおり config の actions であり、運用は変わらない。
version: 0.2

env:
  # Linux で指定できるのは bash または /bin/sh。既定シェルに依存しないよう明示する。
  shell: bash
  exported-variables:
    - BUILD_APPROVED
    - SWITCHOVER_APPROVED

phases:
  install:
    commands:
      # 設定 YAML の読み取りに Ruby の標準ライブラリ（psych / json）を使う。
      # 追加パッケージの導入は不要で、PyPI へも到達しない。
      # CodeBuild の managed image は rbenv で複数の Ruby を持つため、使う版を固定する。
      # Local Agent 用のランナー image は rbenv を持たず Ruby を固定済みなので何もしない。
      - if command -v rbenv >/dev/null 2>&1; then rbenv local 3.4.10; fi
      - ruby --version
      # CodePipeline のソースアーティファクト（ZIP）では実行ビットが失われることがある。
      # 落ちていれば復元し、落ちていなければ何も変わらない。
      - chmod +x scripts/*.sh
  build:
    commands:
      # eval で shell 変数にした後、exported-variables として拾わせるため export する。
      #
      # **eval "$(...)" と書かない。**その形だとスクリプトが失敗しても終了コードが
      # eval のものに化け、承認状態が空のまま後続ステージへ渡ってしまう。
      # いったん変数へ受けて失敗を捕まえる。
      - |
        set -eu
        approvals=$(scripts/read_action_approvals.sh --config "$CONFIG_FILE" --service "$SERVICE_NAME")
        eval "$approvals"
        export BUILD_APPROVED SWITCHOVER_APPROVED
      - |
        echo "service=${SERVICE_NAME} build=${BUILD_APPROVED} switchover=${SWITCHOVER_APPROVED}"
