# CodePipeline の ManualApproval 後に実行する CodeBuild buildspec。
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
  build:
    commands:
      - scripts/switchover.sh --config "$CONFIG_FILE" --service "$SERVICE_NAME" --approve --output-dir artifacts

artifacts:
  files:
    - artifacts/**/*
  discard-paths: false
