# CodePipeline の ManualApproval 後に実行する CodeBuild buildspec。
version: 0.2

env:
  # Linux で指定できるのは bash または /bin/sh。既定シェルに依存しないよう明示する。
  shell: bash

phases:
  install:
    commands:
      # 設定 YAML の読み取りに Ruby の標準ライブラリ（psych / json）を使う。
      # 追加パッケージの導入は不要で、PyPI へも到達しない。
      # CodeBuild の managed image は rbenv で複数の Ruby を持つため、使う版を固定する。
      # Local Agent 用のランナー image は rbenv を持たず Ruby を固定済みなので何もしない。
      - if command -v rbenv >/dev/null 2>&1; then rbenv local 3.4.10; fi
      - ruby --version
      # CodePipeline のソースアーティファクト（ZIP）では実行ビットが失われることがある。
      # 落ちていれば復元し、落ちていなければ何も変わらない。
      - chmod +x scripts/*.sh
  build:
    commands:
      - scripts/switchover.sh --config "$CONFIG_FILE" --service "$SERVICE_NAME" --approve --output-dir artifacts

artifacts:
  files:
    - artifacts/**/*
  discard-paths: false
