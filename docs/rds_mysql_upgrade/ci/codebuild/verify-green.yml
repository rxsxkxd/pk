# CodePipeline の VerifyGreen ステージから実行する CodeBuild buildspec。
# COLLECT_MYSQL_RUNTIME_VALUES は既定 false。true のときだけ Green DB へ接続する。
#
# **Go レポート生成器のビルドは ci/codebuild/build-report-tool.yml が行う。**
# ここは実行だけを担い、ビルド済みバイナリを artifact 経由で受け取る。
#
# **このプロジェクトは VPC 外へ出ない前提である。**Green DB へ到達するため VPC 内へ
# 配置する可能性があるので、Go module の取得（proxy.golang.org）も含め、
# 外部ネットワークへの依存をここへ持ち込まない。ビルドしないので Go も要らず、
# MySQL クライアントも apt で入れずイメージ側に含める。
#
# コマンドは意図的に細かく分けている。CodeBuild は 1 つの `- ` を 1 コマンドとして
# ログに出すため、まとめて書くとどこで落ちたのか分からなくなる。
#
# また、各コマンドは POSIX シェル互換で書いてある（`[[ ]]` / `<<<` / `-o pipefail`
# を使わない）。CodeBuild の既定シェルが /bin/sh の環境でも同じ動作になる。
# buildspec 0.2 は同一フェーズのコマンドを同じシェルで実行するため、
# 変数は次のコマンドへ引き継がれる。
version: 0.2

env:
  # Linux で指定できるのは bash または /bin/sh。明示しておく。
  shell: bash

phases:
  install:
    # Go は使わない（ビルドは build-report-tool.yml が済ませている）。
    commands:
      # 設定 YAML の読み取りに Ruby の標準ライブラリ（psych / json）を使う。
      # 追加パッケージの導入は不要で、PyPI へも到達しない。
      # CodeBuild の managed image は rbenv で複数の Ruby を持つため、使う版を固定する。
      # Local Agent 用のランナー image は rbenv を持たず Ruby を固定済みなので何もしない。
      - if command -v rbenv >/dev/null 2>&1; then rbenv local 3.4.10; fi
      - ruby --version
      # CodePipeline のソースアーティファクト（ZIP）では実行ビットが失われることがある。
      # 落ちていれば復元し、落ちていなければ何も変わらない。
      - chmod +x scripts/*.sh scripts/lib/*.sh

  pre_build:
    commands:
      # 1. ビルド済みバイナリ 3 本の場所を決める。**ここではビルドしない。**
      #    CodePipeline から 2 つ目の input artifact として受け取る場合、その内容は
      #    CODEBUILD_SRC_DIR_<artifact 名> に展開される。
      #    単体実行では、あらかじめ置いた .tools/green-report/ を使う。
      #
      #    解決そのものは Ruby が行い、`KEY=値` の行を返す
      #    （設定 YAML の読み取りと同じ流儀。scripts/lib/deployment_config.rb）。
      #    見つからなければ Ruby が理由と探索先を出して終了コード 1 を返す。
      #
      #    **eval "$(...)" と書かない。**その形だと Ruby が失敗しても終了コードが
      #    eval のものに化け、set -e をすり抜けて「空のまま先へ進む」ことになる。
      #    いったん変数へ受けて失敗を捕まえる。
      - |
        set -eu
        green_tools=$(ruby scripts/lib/resolve_green_tools.rb)
        eval "$green_tools"
        export GREEN_STATE_COLLECTOR GREEN_RUNTIME_COLLECTOR GREEN_REPORT_GENERATOR
      # 2. 実行ビットを復元する。CodePipeline の artifact では実行ビットが落ちうる。
      - chmod +x "$GREEN_STATE_COLLECTOR" "$GREEN_RUNTIME_COLLECTOR" "$GREEN_REPORT_GENERATOR"

  build:
    commands:
      # 3. 検証本体。Step 4 の判定はこのスクリプトが行う。
      #    実効値収集の有効・無効と接続方式（parameter_store / plaintext / prompt）は
      #    config の mysql_verification が決め、verify_green.sh が読んでログへ出す。
      #    **buildspec では設定を読まない。**
      #
      #    **MySQL クライアントは要らない。**収集は collect_green_runtime_values
      #    （静的リンクの Go バイナリ）が行い、RDS のトラストストアも焼き込んである。
      #    そのため apt-get も、MySQL 入りのカスタムイメージも不要である。
      - scripts/verify_green.sh --config "$CONFIG_FILE" --service "$SERVICE_NAME" --output-dir artifacts

artifacts:
  files:
    - artifacts/**/*
  discard-paths: false
