# CodePipeline の VerifyGreen ステージから実行する CodeBuild buildspec。
# COLLECT_MYSQL_RUNTIME_VALUES は既定 false。true のときだけ Green DB へ接続する。
#
# **Go レポート生成器のビルドは ci/codebuild/build-report-tool.yml が行う。**
# ここは実行だけを担い、ビルド済みバイナリを artifact 経由で受け取る。
#
# **このプロジェクトは VPC 外へ出ない前提である。**Green DB へ到達するため VPC 内へ
# 配置する可能性があるので、Go module の取得（proxy.golang.org）も含め、
# 外部ネットワークへの依存をここへ持ち込まない。ビルドしないので Go も要らない。
#
# コマンドは意図的に細かく分けている。CodeBuild は 1 つの `- ` を 1 コマンドとして
# ログに出すため、まとめて書くとどこで落ちたのか分からなくなる。
#
# また、各コマンドは POSIX シェル互換で書いてある（`[[ ]]` / `<<<` / `-o pipefail`
# を使わない）。CodeBuild の既定シェルが /bin/sh の環境でも同じ動作になる。
# buildspec 0.2 は同一フェーズのコマンドを同じシェルで実行するため、
# 変数は次のコマンドへ引き継がれる。
version: 0.2

env:
  # Linux で指定できるのは bash または /bin/sh。明示しておく。
  shell: bash

phases:
  install:
    # Go は使わない（ビルドは build-report-tool.yml が済ませている）。
    commands:
      # 設定 YAML の読み取りに Ruby の標準ライブラリ（psych / json）を使う。
      # 追加パッケージの導入は不要で、PyPI へも到達しない。
      # CodeBuild の managed image は rbenv で複数の Ruby を持つため、使う版を固定する。
      # Local Agent 用のランナー image は rbenv を持たず Ruby を固定済みなので何もしない。
      - if command -v rbenv >/dev/null 2>&1; then rbenv local 3.4.10; fi
      - ruby --version
      # --- 診断: sh / bash 問題の切り分け用。原因が確定したら削除する ---------
      - ls -l scripts/*.sh scripts/lib/*.sh
      - head -1 scripts/verify_green.sh | od -c | head -1
      - 'echo "shell=$0 bash=$(command -v bash)"; bash --version | head -1'
      # --- 診断ここまで -----------------------------------------------------

      # CodePipeline のソースアーティファクト（ZIP）では実行ビットが失われることがある。
      # 落ちていれば復元し、落ちていなければ何も変わらない。
      - chmod +x scripts/*.sh scripts/lib/*.sh

  pre_build:
    commands:
      # 1. ビルド済みレポート生成器の場所を決める。**ここではビルドしない。**
      #    CodePipeline から 2 つ目の input artifact として受け取る場合、その内容は
      #    CODEBUILD_SRC_DIR_<artifact 名> に展開される。
      #    単体実行では、あらかじめ置いた .tools/green-report/ を使う。
      - |
        set -eu
        tool_relative_path=.tools/green-report/generate_green_verification_report
        if [ -n "${GREEN_REPORT_GENERATOR:-}" ] && [ -f "$GREEN_REPORT_GENERATOR" ]; then
          echo "Using GREEN_REPORT_GENERATOR given by the caller."
        elif [ -n "${CODEBUILD_SRC_DIR_ReportToolOutput:-}" ] \
             && [ -f "$CODEBUILD_SRC_DIR_ReportToolOutput/$tool_relative_path" ]; then
          GREEN_REPORT_GENERATOR="$CODEBUILD_SRC_DIR_ReportToolOutput/$tool_relative_path"
          echo 'Using the report generator from the BuildReportTool artifact.'
        elif [ -f "$CODEBUILD_SRC_DIR/$tool_relative_path" ]; then
          GREEN_REPORT_GENERATOR="$CODEBUILD_SRC_DIR/$tool_relative_path"
          echo 'Using the report generator found in the source tree.'
        else
          echo 'Report generator is absent. This project does not build it on purpose' >&2
          echo '(it must run without reaching the network outside the VPC).' >&2
          echo 'Run ci/codebuild/build-report-tool.yml and pass its artifact,' >&2
          echo 'or set GREEN_REPORT_GENERATOR to a prebuilt binary.' >&2
          exit 1
        fi
        export GREEN_REPORT_GENERATOR
      # 2. 実行できることを確認する。CodePipeline の artifact では実行ビットが落ちうる。
      - chmod +x "$GREEN_REPORT_GENERATOR"
      - ls -l "$GREEN_REPORT_GENERATOR"

  build:
    commands:
      # 4. 設定ファイルが MySQL 実効値収集を要求している場合だけクライアントを入れる。
      #    接続方式（parameter_store / plaintext / prompt）は
      #    config の mysql_verification が決め、verify_green.sh が解決する。
      - |
        set -eu
        # 設定の読み取りはスクリプト本体と同じ経路を使う（Ruby で YAML→JSON、jq で取り出し）。
        . scripts/lib/deployment_config.sh
        eval "$(deployment_config_vars "$CONFIG_FILE" "$SERVICE_NAME" '
          service($service) as $svc | {
            MYSQL_ENABLED: (if ($svc.mysql_verification.enabled // false) then "true" else "false" end),
          } | shellvars')"
        echo "mysql_verification.enabled=${MYSQL_ENABLED}"
        if [ "$MYSQL_ENABLED" = "true" ]; then
          command -v mysql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y mysql-client; }
        fi
      # 5. 検証本体。Step 4 の判定はこのスクリプトが行う。
      - scripts/verify_green.sh --config "$CONFIG_FILE" --service "$SERVICE_NAME" --output-dir artifacts

artifacts:
  files:
    - artifacts/**/*
  discard-paths: false
