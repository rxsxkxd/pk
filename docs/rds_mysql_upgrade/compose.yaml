name: rds-mysql-upgrade-tools

# 使い方:
#   docker compose create  # 認証情報なしでも作成可能
#   # 実接続だけ .env でホスト側の認証情報・証明書ディレクトリを指定
#   docker compose --env-file .env run --rm awscli sts get-caller-identity
#
# ファイルとしての認証情報・証明書・接続設定は read_only でマウントする。
# STS の一時認証情報は環境変数として渡す（ファイルを書き換えないため read_only 方針と両立する）。
services:
  awscli:
    image: public.ecr.aws/aws-cli/aws-cli:2.32.25
    entrypoint: ["aws"]
    working_dir: /workspace
    environment:
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_PROFILE: ${AWS_PROFILE:-default}
      # STS による一時認証情報（AssumeRole / SSO / MFA など）をホストから引き継ぐ。
      # 未設定なら空文字が渡るが、AWS CLI は空の認証情報を無視して
      # ~/.aws の named profile へフォールバックする（実測で確認済み）。
      # 値は .env に書かず、実行するシェルの環境変数から渡すこと。
      #
      # AWS_REGION はここで渡さない。空文字を渡すとプロファイルの region 設定を
      # 上書きしてしまい、リージョン未指定エラーになるため。
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - type: bind
        source: ${AWS_CONFIG_DIR:-./aws-config}
        target: /root/.aws
        read_only: true
      - type: bind
        source: ${WORKSPACE_DIR:-.}
        target: /workspace

  mysql:
    # mysql:8.4.11 には MySQL CLI と MySQL Shell (mysqlsh) の両方が含まれる。
    image: mysql:8.4.11
    # `docker compose up` で DB サーバーを起動しない。run 時のコマンドで mysql / mysqlsh を指定する。
    entrypoint: []
    command: ["mysqlsh", "--version"]
    working_dir: /workspace
    environment:
      HOME: /tmp
    volumes:
      - type: bind
        source: ${RDS_CA_FILE:-./global-bundle.pem}
        target: /certs/rds/global-bundle.pem
        read_only: true
      - type: bind
        source: ${MYSQL_CLIENT_CONFIG_FILE:-./my.cnf}
        target: /client-config/my.cnf
        read_only: true
      - type: bind
        source: ${WORKSPACE_DIR:-.}
        target: /workspace

  # Ruby スクリプト実行専用。AWS credential や RDS 証明書はマウントしない。
  ruby:
    image: ruby:3.4.10
    working_dir: /workspace
    entrypoint: ["ruby"]
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-.}
        target: /workspace

  # Go プログラム実行専用。AWS credential や RDS 証明書はマウントしない。
  go:
    image: golang:1.25
    working_dir: /workspace
    entrypoint: ["go"]
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-.}
        target: /workspace
