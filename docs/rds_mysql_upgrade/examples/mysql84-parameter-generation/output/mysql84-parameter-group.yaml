AWSTemplateFormatVersion: '2010-09-09'
Description: MySQL 8.4 DB parameter group only (generated; review before deployment)
Resources:
  Mysql84ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      DBParameterGroupName: sample-production-mysql84-v1
      Description: MySQL 8.4 parameters for sample/production
      Family: mysql8.4
      Parameters:
        authentication_policy: "*:mysql_native_password"
        binlog_format: ROW
        log_replica_updates: '1'
        max_allowed_packet: '67108864'
        replica_parallel_workers: '8'
      Tags:
      - Key: System
        Value: sample
      - Key: Environment
        Value: production
      - Key: ManagedBy
        Value: CloudFormation
Outputs:
  DBParameterGroupName:
    Value:
      Ref: Mysql84ParameterGroup
