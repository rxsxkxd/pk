AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  RDS for MySQL 8.0 -> 8.4 Blue/Green 移行パイプライン（IAM・CI 作成版）。
  既存のアーティファクト用 S3 バケットを利用し、IAM ロール、CodeBuild プロジェクト、
  CodePipeline を 1 つのスタックで作成する。対象サービスは実行時に SERVICE_NAME で指定する。

# 既存の codepipeline.yml との違い:
#   codepipeline.yml         … S3 バケットと IAM ロールを既存リソースとして受け取る。
#                              組織側でロールを一元管理している場合はこちらを使う。
#   codepipeline-all-in-one  … 本ファイル。既存 S3 バケットを受け取り、IAM と CI リソースを作成する。
#                              検証環境や、スタック単位で権限を閉じたい場合に使う。
#
# 環境（staging / production）ごとに 1 スタックを作成する。サービスはパイプライン変数で
# 切り替えるため、同一環境の複数サービスで 1 つのパイプラインを共用できる。

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: パイプライン }
        Parameters: [PipelineNamePrefix, EnvironmentName, DefaultServiceName, ArtifactBucketName]
      - Label: { default: ソース（GitHub または CodeCommit） }
        Parameters: [SourceProvider, CodeStarConnectionArn, RepositoryId, CodeCommitRepositoryName, BranchName]
      - Label: { default: Step 4 の MySQL 実効値収集（任意） }
        Parameters: [CollectMySqlRuntimeValues, MySqlCredentialsParameterArns]
      - Label: { default: Step 4 検証の VPC 配置（任意。VerifyGreen だけが対象） }
        Parameters:
          - VpcId
          - VerifyGreenSubnetIds
          - VerifyGreenSecurityGroupIds
          - VerifyGreenImage
      - Label: { default: 承認通知（任意） }
        Parameters: [ApprovalNotificationTopicArn]
      - Label: { default: 保護対象の RDS リソース }
        Parameters: [DbInstanceIdentifierPrefix]

Parameters:
  PipelineNamePrefix:
    Type: String
    Default: rds-bg
    Description: 生成するリソース名の接頭辞。

  EnvironmentName:
    Type: String
    AllowedValues: [staging, production]
    Description: >-
      対象環境。config/blue-green/<環境>.deployment.yml を CONFIG_FILE として使う。

  DefaultServiceName:
    Type: String
    Default: example-service
    Description: >-
      SERVICE_NAME の既定値。パイプライン実行時に --variables で上書きできる。
      config の services 配下に定義したサービス名を指定する。

  ArtifactBucketName:
    Type: String
    Description: >-
      CodePipeline のソースおよび各 Step の成果物を保存する、同一リージョンの既存 S3 バケット名。
      このスタックはバケットおよびバケットポリシーを作成・変更・削除しない。

  SourceProvider:
    Type: String
    Default: CodeConnections
    AllowedValues: [CodeConnections, CodeCommit]
    Description: >-
      ソースの取得元。CodeConnections なら GitHub（CodeStarConnectionArn と
      RepositoryId を使う）、CodeCommit なら CodeCommitRepositoryName を使う。
      選ばなかった側のパラメータは無視される。

  CodeStarConnectionArn:
    Type: String
    # 仮置き。事前に GitHub と接続して AVAILABLE にした接続の ARN へ置き換える。
    Default: arn:aws:codeconnections:ap-northeast-1:123456789012:connection/00000000-0000-0000-0000-000000000000
    Description: >-
      CodeConnections（GitHub）の接続 ARN。事前に AVAILABLE にしておく。
      SourceProvider=CodeConnections のときだけ使う。

  RepositoryId:
    Type: String
    # 仮置き。
    Default: your-org/your-repository
    Description: >-
      GitHub リポジトリ（owner/repo）。SourceProvider=CodeConnections のときだけ使う。

  CodeCommitRepositoryName:
    Type: String
    Default: ''
    Description: >-
      CodeCommit のリポジトリ名。SourceProvider=CodeCommit のときは必須である。

  BranchName:
    Type: String
    Default: main
    Description: ソースとして取得するブランチ。

  CollectMySqlRuntimeValues:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Step 4 で Green DB へ MySQL 接続し実効値を収集するか。
      true にする場合は VpcId 以下を指定して VerifyGreen を RDS へ到達できる
      subnet へ配置し、MySQL クライアント入りの VerifyGreenImage を指定する。

  # Step 4 の 2 つのプロジェクトを配置する VPC。**両方とも同一 VPC 内に置く。**
  # レポート実行（VerifyGreen）は専用のサブネットへ隔離し、そこには外部経路を置かない。
  # ビルドは外部へ出られる既存のサブネットでよい。
  # VpcConfig は CodeBuild プロジェクトのプロパティなので、実行時には切り替えられない。
  # 空のままなら両方とも VPC 外で実行する（AWS API による検証だけ。現状の既定）。
  VpcId:
    Type: String
    Default: ''
    Description: >-
      VerifyGreen（Step 4 の検証実行）を配置する VPC。空なら VPC 外で実行する
      （その場合 Green DB へは接続できない）。
      **BuildReportTool はここに入れない。**Go ビルドは AWS API も RDS も呼ばず、
      Go module の取得で外部へ出るだけなので、他の VPC 外プロジェクトと揃える。

  VerifyGreenSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      **レポート実行（VerifyGreen）専用の private subnet。**RDS へ到達できること。
      外部経路を持たせないため、他の用途と共有せず専用に用意する。
      障害耐性のため 2 アベイラビリティゾーン以上を推奨する。**外部 egress は不要**で、その場合は
      s3／logs／rds／monitoring／ssm の VPC endpoint を用意する。

  VerifyGreenSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      VerifyGreen に付けるセキュリティグループ。RDS 側の inbound でこの SG からの
      3306/tcp を許可する。

  VerifyGreenImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    Description: >-
      VerifyGreen のビルドイメージ。MySQL 実効値を収集する場合は、
      MySQL クライアントを同梱したカスタムイメージ（例: ECR の image）を指定する。
      private subnet では apt による実行時導入ができないため、イメージ側に含める。

  MySqlCredentialsParameterArns:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      CollectMySqlRuntimeValues=true のときだけ使う SSM パラメータ（SecureString）の ARN。
      パスワード用（parameter_name）とユーザー名用（user_parameter_name）の
      2 本をカンマ区切りで指定する。
      空なら Parameter Store の読み取り権限を付与しない。

  ApprovalNotificationTopicArn:
    Type: String
    Default: ''
    Description: 手動承認の通知先 SNS トピック ARN。空なら通知しない。

  DbInstanceIdentifierPrefix:
    Type: String
    # 仮置き。IAM の Resource を絞るために使う。
    Default: '*'
    Description: >-
      権限を付与する DB インスタンス識別子の接頭辞（例: example-service-production）。
      '*' のままだとアカウント内の全 DB インスタンスが対象になる。実運用では必ず絞る。

Conditions:
  # ソースの取得元を切り替える。Source アクションと、CodePipeline ロールへ
  # 付与する権限（接続の利用 / CodeCommit の読み取り）をまとめて差し替える。
  UseCodeConnections: !Equals [!Ref SourceProvider, CodeConnections]
  UseCodeCommit: !Equals [!Ref SourceProvider, CodeCommit]
  HasApprovalTopic: !Not [!Equals [!Ref ApprovalNotificationTopicArn, '']]
  # Step 4 の 2 プロジェクトを VPC 内で実行するか。
  # VpcConfig と Elastic Network Interface 権限をまとめて切り替える。
  HasVpc: !Not [!Equals [!Ref VpcId, '']]
  # 既定イメージ以外を指定した場合は ECR からの pull を許可する。
  HasCustomVerifyGreenImage: !Not [!Equals [!Ref VerifyGreenImage, 'aws/codebuild/standard:7.0']]
  # config の mysql_verification.auth_method は parameter_store 固定である。
  HasMySqlCredentials: !Not [!Equals [!Join ['', !Ref MySqlCredentialsParameterArns], '']]

Resources:

  # --- CodeBuild 共通権限 -----------------------------------------------------
  # ログ出力、アーティファクトの読み書き、RDS の読み取り。
  # 変更操作は各ロールの個別ポリシーでのみ許可する。
  CodeBuildCommonPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PipelineNamePrefix}-${EnvironmentName}-codebuild-common'
      Description: RDS Blue/Green CodeBuild 共通権限（ログ・アーティファクト・読み取り API）
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${PipelineNamePrefix}-${EnvironmentName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${PipelineNamePrefix}-${EnvironmentName}-*:*'
          - Sid: Artifacts
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
              - 's3:PutObject'
              - 's3:GetBucketLocation'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
          - Sid: ArtifactBucketList
            Effect: Allow
            Action: 's3:ListBucket'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
          - Sid: RdsReadOnly
            Effect: Allow
            # Describe 系はリソースレベルの制御に対応しないものがあるため * とする。
            # 読み取りのみであり、変更操作は含まない。
            Action:
              - 'rds:DescribeDBInstances'
              - 'rds:DescribeDBParameters'
              - 'rds:DescribeDBParameterGroups'
              # Blue/Green 作成時に引き継がれる移行元 OptionGroup の確認に使う。
              - 'rds:DescribeOptionGroups'
              - 'rds:DescribeDBSnapshots'
              - 'rds:DescribeBlueGreenDeployments'
              - 'rds:DescribeDBEngineVersions'
              - 'rds:DescribeEngineDefaultParameters'
              - 'rds:DescribeOrderableDBInstanceOptions'
              - 'rds:DescribeEvents'
              - 'rds:ListTagsForResource'
            Resource: '*'
          - Sid: CloudWatchRead
            Effect: Allow
            # Step 4 の ReplicaLag、Step 1 の FreeStorageSpace の取得に使う。
            Action: 'cloudwatch:GetMetricStatistics'
            Resource: '*'

  # --- CodeBuild ロール（Step ごとに変更権限を分ける）-------------------------
  # upgrade-flow-steps.md「CI 実行ロールに必要な権限」の分割に対応する。

  # config の承認宣言を読み出すだけ。AWS API は呼び出さない。
  ReadApprovalsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineNamePrefix}-${EnvironmentName}-read-approvals'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: 'sts:AssumeRole'
      ManagedPolicyArns: [!Ref CodeBuildCommonPolicy]

  # Step 4 のレポート生成器のビルド専用。AWS リソースへは一切触らない。
  # ログ出力と artifact の読み書きだけを共通ポリシーから得る。
  BuildReportToolRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineNamePrefix}-${EnvironmentName}-build-report-tool'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: 'sts:AssumeRole'
      # VPC 外で動くため Elastic Network Interface の権限は要らない。
      # ログ出力と artifact の読み書きは CodeBuildCommonPolicy が持つ。
      ManagedPolicyArns: [!Ref CodeBuildCommonPolicy]

  # Step 2 事前確認: 読み取りのみ。
  PrecheckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineNamePrefix}-${EnvironmentName}-precheck'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: 'sts:AssumeRole'
      ManagedPolicyArns: [!Ref CodeBuildCommonPolicy]

  # Step 3: 保護スナップショットの作成と Blue/Green の作成。
  BuildGreenRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineNamePrefix}-${EnvironmentName}-build-green'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: 'sts:AssumeRole'
      ManagedPolicyArns: [!Ref CodeBuildCommonPolicy]
      Policies:
        - PolicyName: build-green-mutations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateProtectionSnapshot
                Effect: Allow
                Action:
                  - 'rds:CreateDBSnapshot'
                  - 'rds:AddTagsToResource'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${DbInstanceIdentifierPrefix}*'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:${DbInstanceIdentifierPrefix}*'
              - Sid: CreateBlueGreenDeployment
                Effect: Allow
                # Blue/Green の Green DB、関連する DB parameter group／OptionGroup は RDS が
                # 内部命名で作成・関連付けする。AWS はこの操作に部分一致 ARN を使えず、
                # Resource: * を要求している。対象は本アクション群だけに限定する。
                # CreateBlueGreenDeployment の従属操作として、RDS が Green のレプリカを
                # 作成し、作成リソースへタグを付与するための権限も含める。
                Action:
                  - 'rds:CreateBlueGreenDeployment'
                  - 'rds:CreateDBInstanceReadReplica'
                  - 'rds:AddTagsToResource'
                Resource: '*'

  # Step 4: 読み取りのみ。Go レポート生成器は buildspec の runtime-versions で
  # 同一イメージ内をビルドするため、Docker も PrivilegedMode も要らない。
  VerifyGreenRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineNamePrefix}-${EnvironmentName}-verify-green'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: 'sts:AssumeRole'
      ManagedPolicyArns: [!Ref CodeBuildCommonPolicy]
      Policies:
        # パラメータ ARN が未指定ならこのポリシーを省く。
        - !If
          - HasMySqlCredentials
          - PolicyName: read-mysql-credentials
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # auth_method: parameter_store（SecureString の復号に KMS も要る）
                - Sid: GetMySqlParameter
                  Effect: Allow
                  Action:
                    - 'ssm:GetParameter'
                    - 'ssm:GetParameters'
                  Resource: !Ref MySqlCredentialsParameterArns
          - !Ref 'AWS::NoValue'
        # VPC 内で動く CodeBuild は実行ごとに Elastic Network Interface を作る。この権限が無いと起動に失敗する。
        - !If
          - HasVpc
          - PolicyName: vpc-network-interface
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: DescribeVpcResources
                  Effect: Allow
                  Action:
                    - 'ec2:CreateNetworkInterface'
                    - 'ec2:DescribeNetworkInterfaces'
                    - 'ec2:DeleteNetworkInterface'
                    - 'ec2:DescribeSubnets'
                    - 'ec2:DescribeSecurityGroups'
                    - 'ec2:DescribeDhcpOptions'
                    - 'ec2:DescribeVpcs'
                  # これらの Describe / Create は個別リソースを指定できない。
                  Resource: '*'
                # Elastic Network Interface を CodeBuild へ渡す許可。サービス指定で絞る。
                # さらに絞るなら Condition へ ec2:Subnet（subnet の ARN）も加える。
                - Sid: CreateNetworkInterfacePermissionForCodeBuild
                  Effect: Allow
                  Action: 'ec2:CreateNetworkInterfacePermission'
                  Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
                  Condition:
                    StringEquals:
                      'ec2:AuthorizedService': codebuild.amazonaws.com
          - !Ref 'AWS::NoValue'
        # カスタムイメージを ECR から引く場合に必要。
        - !If
          - HasCustomVerifyGreenImage
          - PolicyName: pull-verify-green-image
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: PullBuildImage
                  Effect: Allow
                  Action:
                    - 'ecr:GetAuthorizationToken'
                    - 'ecr:BatchCheckLayerAvailability'
                    - 'ecr:GetDownloadUrlForLayer'
                    - 'ecr:BatchGetImage'
                  Resource: '*'
          - !Ref 'AWS::NoValue'

  # Step 5: 切替に必要な変更だけを許可する。作成・削除の権限は持たせない。
  SwitchoverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineNamePrefix}-${EnvironmentName}-switchover'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: 'sts:AssumeRole'
      ManagedPolicyArns: [!Ref CodeBuildCommonPolicy]
      Policies:
        - PolicyName: switchover-mutations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SwitchoverBlueGreenDeployment
                Effect: Allow
                # Blue/Green deployment 自体を切り替える権限。
                Action: 'rds:SwitchoverBlueGreenDeployment'
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:deployment:*'
              - Sid: CompleteSwitchoverOnDbInstances
                Effect: Allow
                # 切替に伴い RDS が Green DB instance を ModifyDBInstance し、
                # read replica を PromoteReadReplica するために必要な権限。
                Action:
                  - 'rds:ModifyDBInstance'
                  - 'rds:PromoteReadReplica'
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:*'

  # Step 7: 破壊的権限。旧 Blue の削除を含むため、このロールにだけ付与する。
  CleanupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineNamePrefix}-${EnvironmentName}-cleanup'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: 'sts:AssumeRole'
      ManagedPolicyArns: [!Ref CodeBuildCommonPolicy]
      Policies:
        - PolicyName: cleanup-mutations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeleteBlueGreenDeployment
                Effect: Allow
                Action: 'rds:DeleteBlueGreenDeployment'
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:deployment:*'
              - Sid: DeleteOldBlue
                Effect: Allow
                # 旧 Blue は <source>-old1 へリネームされる。最終スナップショットの作成も伴う。
                Action:
                  - 'rds:DeleteDBInstance'
                  - 'rds:ModifyDBInstance'
                  - 'rds:CreateDBSnapshot'
                  - 'rds:AddTagsToResource'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${DbInstanceIdentifierPrefix}*'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:${DbInstanceIdentifierPrefix}*'

  # --- CodePipeline ロール ----------------------------------------------------
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineNamePrefix}-${EnvironmentName}-pipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: pipeline-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:PutObject'
                  - 's3:GetBucketVersioning'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
              - Sid: StartBuilds
                Effect: Allow
                Action:
                  - 'codebuild:StartBuild'
                  - 'codebuild:BatchGetBuilds'
                  - 'codebuild:StopBuild'
                Resource:
                  - !GetAtt ReadApprovalsProject.Arn
                  - !GetAtt PrecheckProject.Arn
                  - !GetAtt BuildGreenProject.Arn
                  - !GetAtt BuildReportToolProject.Arn
                  - !GetAtt VerifyGreenProject.Arn
                  - !GetAtt SwitchoverProject.Arn
                  - !GetAtt CleanupProject.Arn
              # ソースの取得に必要な権限。SourceProvider で一方だけを付ける。
              - !If
                - UseCodeConnections
                - Sid: UseSourceConnection
                  Effect: Allow
                  # 接続は codestar-connections / codeconnections のどちらの名前空間でも
                  # 作られうるため、両方を許可する。対象は指定した接続 1 つに限る。
                  Action:
                    - 'codestar-connections:UseConnection'
                    - 'codeconnections:UseConnection'
                  Resource: !Ref CodeStarConnectionArn
                - !Ref 'AWS::NoValue'
              - !If
                - UseCodeCommit
                - Sid: ReadSourceFromCodeCommit
                  Effect: Allow
                  # CodePipeline が CodeCommit から取得するのに要る最小の読み取り。
                  # UploadArchive 系は CodePipeline が成果物を S3 へ渡すために使う。
                  Action:
                    - 'codecommit:GetBranch'
                    - 'codecommit:GetCommit'
                    - 'codecommit:GetRepository'
                    - 'codecommit:UploadArchive'
                    - 'codecommit:GetUploadArchiveStatus'
                    - 'codecommit:CancelUploadArchive'
                  Resource: !Sub 'arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:${CodeCommitRepositoryName}'
                - !Ref 'AWS::NoValue'
              - !If
                - HasApprovalTopic
                - Sid: NotifyApproval
                  Effect: Allow
                  Action: 'sns:Publish'
                  Resource: !Ref ApprovalNotificationTopicArn
                - !Ref 'AWS::NoValue'

  # --- CodeBuild プロジェクト -------------------------------------------------
  # SERVICE_NAME はプロジェクト定義に既定値を置き、パイプライン実行時に
  # アクション側の EnvironmentVariables で上書きする。
  # これにより start-build による個別実行でも既定値で動く。

  # config の actions をパイプライン変数として公開する。後続ステージの
  # BeforeEntry 条件がこれを見て、承認していないフェーズをスキップする。
  ReadApprovalsProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-read-approvals'
      Description: config の actions（承認宣言）をパイプライン変数として公開する
      ServiceRole: !GetAtt ReadApprovalsRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/read-approvals.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: CONFIG_FILE, Type: PLAINTEXT, Value: !Sub 'config/blue-green/${EnvironmentName}.deployment.yml' }
          - { Name: SERVICE_NAME, Type: PLAINTEXT, Value: !Ref DefaultServiceName }

  PrecheckProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-precheck-parameter-group'
      Description: Step 2 事前確認 - 移行先 DB パラメータグループの存在と family を確認する
      ServiceRole: !GetAtt PrecheckRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/precheck-target-parameter-group.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: CONFIG_FILE, Type: PLAINTEXT, Value: !Sub 'config/blue-green/${EnvironmentName}.deployment.yml' }
          - { Name: SERVICE_NAME, Type: PLAINTEXT, Value: !Ref DefaultServiceName }

  BuildGreenProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-build-green'
      Description: Step 3 - 保護スナップショット取得と Blue/Green 作成
      ServiceRole: !GetAtt BuildGreenRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/build-green.yml
      # Green の AVAILABLE 待機を含むため既定の 60 分では不足しうる。
      TimeoutInMinutes: 120
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: CONFIG_FILE, Type: PLAINTEXT, Value: !Sub 'config/blue-green/${EnvironmentName}.deployment.yml' }
          - { Name: SERVICE_NAME, Type: PLAINTEXT, Value: !Ref DefaultServiceName }

  # Go レポート生成器をビルドするだけのプロジェクト。
  # **外部ネットワーク（Go module の取得）へ出るのはここだけである。**
  # VPC には入れない（VerifyGreen 以外のプロジェクトと同じ扱い）。AWS API は呼ばない。
  BuildReportToolProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-build-report-tool'
      Description: Step 4 - Go レポート生成器のビルド（AWS API は呼ばない）
      ServiceRole: !GetAtt BuildReportToolRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/build-report-tool.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        # buildspec の runtime-versions で Go を用意し、go.mod / go.sum でビルドする。
        Image: aws/codebuild/standard:7.0
      # VpcConfig を付けない。VerifyGreen 以外のプロジェクトと同じく VPC 外で動く。
      # このビルドは AWS API も RDS も呼ばず、Go module の取得で外部へ出るだけである。
      # VPC へ入れると NAT gateway 経由の外向き経路が必須になり、
      # Elastic Network Interface の作成権限も要るため、得るものが無い。

  VerifyGreenProject:
    Type: AWS::CodeBuild::Project
    # VerifyGreenSubnetIds / VerifyGreenSecurityGroupIds の既定値は空である。
    # VpcConfig は HasVpc が真のときだけ展開されるため空値は渡らないが、
    # cfn-lint は既定値をそのまま型検査して W1030 を出すので、ここだけ抑止する。
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-verify-green'
      Description: Step 4 - Green 構成とレプリカ遅延の検証
      ServiceRole: !GetAtt VerifyGreenRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/verify-green.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        # レポート生成器は BuildReportTool の artifact から受け取るため、
        # このプロジェクトは Go も Go module の取得も必要としない。
        # MySQL 実効値を収集する場合は、MySQL クライアント入りのイメージを指定する
        # （private subnet では apt による実行時導入ができない）。
        Image: !Ref VerifyGreenImage
        # 既定イメージ以外（ECR など）はサービスロールの権限で引く。
        ImagePullCredentialsType: !If [HasCustomVerifyGreenImage, SERVICE_ROLE, CODEBUILD]
        EnvironmentVariables:
          - { Name: CONFIG_FILE, Type: PLAINTEXT, Value: !Sub 'config/blue-green/${EnvironmentName}.deployment.yml' }
          - { Name: SERVICE_NAME, Type: PLAINTEXT, Value: !Ref DefaultServiceName }
          - { Name: COLLECT_MYSQL_RUNTIME_VALUES, Type: PLAINTEXT, Value: !Ref CollectMySqlRuntimeValues }
      # BuildReportTool と同一 VPC の、**レポート実行専用**の private subnet で実行する。
      # VpcConfig はプロジェクトのプロパティなので実行ごとの切り替えはできない。
      # 未指定なら VPC 外で動く。**この subnet に外部 egress は要らない。**
      VpcConfig: !If
        - HasVpc
        - VpcId: !Ref VpcId
          Subnets: !Ref VerifyGreenSubnetIds
          SecurityGroupIds: !Ref VerifyGreenSecurityGroupIds
        - !Ref 'AWS::NoValue'

  SwitchoverProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-switchover'
      Description: Step 5 - Blue/Green の切替（config の actions.switchover が approved の場合のみ）
      ServiceRole: !GetAtt SwitchoverRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/switchover.yml
      # 切替完了まで待機するため余裕を持たせる。
      TimeoutInMinutes: 60
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: CONFIG_FILE, Type: PLAINTEXT, Value: !Sub 'config/blue-green/${EnvironmentName}.deployment.yml' }
          - { Name: SERVICE_NAME, Type: PLAINTEXT, Value: !Ref DefaultServiceName }

  CleanupProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-cleanup'
      Description: Step 7 - 旧 Blue と Deployment の削除（config の actions.cleanup が approved の場合のみ）
      ServiceRole: !GetAtt CleanupRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/cleanup.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: CONFIG_FILE, Type: PLAINTEXT, Value: !Sub 'config/blue-green/${EnvironmentName}.deployment.yml' }
          - { Name: SERVICE_NAME, Type: PLAINTEXT, Value: !Ref DefaultServiceName }

  # --- CodePipeline -----------------------------------------------------------
  BlueGreenPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}'
      # V2 でないとパイプライン変数を使えない。
      PipelineType: V2
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      # 実行時に指定する変数。start-pipeline-execution の --variables で上書きする。
      Variables:
        - Name: ServiceName
          DefaultValue: !Ref DefaultServiceName
          Description: 対象サービス名（config の services 配下のキー）
      Stages:
        # SourceProvider でどちらか一方だけを展開する。後続ステージは
        # どちらの場合も SourceOutput を受け取るので、変更の影響はここに閉じる。
        - Name: Source
          Actions:
            - !If
              - UseCodeConnections
              - Name: SourceFromGitHub
                ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: '1' }
                Configuration:
                  ConnectionArn: !Ref CodeStarConnectionArn
                  FullRepositoryId: !Ref RepositoryId
                  BranchName: !Ref BranchName
                  # push では起動しない。作業者が明示的に開始する。
                  DetectChanges: 'false'
                OutputArtifacts: [{ Name: SourceOutput }]
                RunOrder: 1
              - Name: SourceFromCodeCommit
                ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeCommit, Version: '1' }
                Configuration:
                  RepositoryName: !Ref CodeCommitRepositoryName
                  BranchName: !Ref BranchName
                  # push では起動しない（EventBridge ルールも作らない）。
                  # DetectChanges: 'false' と同じ意図である。
                  PollForSourceChanges: 'false'
                OutputArtifacts: [{ Name: SourceOutput }]
                RunOrder: 1

        # config の actions を読み、後続ステージの条件で使う変数として公開する。
        # Namespace を付けることで #{Approvals.SWITCHOVER_APPROVED} の形で参照できる。
        - Name: ReadApprovals
          Actions:
            - Name: ReadApprovals
              Namespace: Approvals
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref ReadApprovalsProject
                EnvironmentVariables: '[{"name":"SERVICE_NAME","value":"#{variables.ServiceName}","type":"PLAINTEXT"}]'
              InputArtifacts: [{ Name: SourceOutput }]
              RunOrder: 1

        # Step 4 で使う Go レポート生成器を先にビルドし、artifact で後段へ渡す。
        # VerifyGreen を VPC 内へ置く構成でも、外部ネットワークが要るのはこのステージだけになる。
        - Name: BuildReportTool
          Actions:
            - Name: BuildReportTool
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref BuildReportToolProject
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: ReportToolOutput }]
              RunOrder: 1

        # Step 2 の成果物（8.4 パラメータグループ）が適用済みかを確認する。
        - Name: PrecheckParameterGroup
          Actions:
            - Name: PrecheckParameterGroup
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref PrecheckProject
                EnvironmentVariables: '[{"name":"SERVICE_NAME","value":"#{variables.ServiceName}","type":"PLAINTEXT"}]'
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: PrecheckOutput }]
              RunOrder: 1

        - Name: BuildGreen
          Actions:
            - Name: BuildGreen
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref BuildGreenProject
                EnvironmentVariables: '[{"name":"SERVICE_NAME","value":"#{variables.ServiceName}","type":"PLAINTEXT"}]'
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: BuildGreenOutput }]
              RunOrder: 1

        - Name: VerifyGreen
          Actions:
            - Name: VerifyGreen
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref VerifyGreenProject
                # 入力が複数あるため、どれをソースとして展開するかを明示する。
                # 2 つ目は CODEBUILD_SRC_DIR_ReportToolOutput に展開され、
                # buildspec がそこからレポート生成器を受け取る。
                PrimarySource: SourceOutput
                EnvironmentVariables: '[{"name":"SERVICE_NAME","value":"#{variables.ServiceName}","type":"PLAINTEXT"}]'
              InputArtifacts:
                - { Name: SourceOutput }
                - { Name: ReportToolOutput }
              OutputArtifacts: [{ Name: VerifyGreenOutput }]
              RunOrder: 1

        # config の actions.switchover が approved のときだけ入る。
        # pending ならステージごとスキップされるため、手動承認も表示されない。
        # これにより「承認しても何も起きない」クリックが発生しない。
        - Name: Switchover
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: SwitchoverApproved
                    RuleTypeId: { Category: Rule, Owner: AWS, Provider: VariableCheck, Version: '1' }
                    Configuration:
                      Variable: '#{Approvals.SWITCHOVER_APPROVED}'
                      Value: approved
                      Operator: EQ
          Actions:
            - Name: ManualApproval
              ActionTypeId: { Category: Approval, Owner: AWS, Provider: Manual, Version: '1' }
              Configuration:
                NotificationArn: !If [HasApprovalTopic, !Ref ApprovalNotificationTopicArn, !Ref 'AWS::NoValue']
                CustomData: >-
                  Step 4 の検証レポートを確認してから承認する。本番トラフィックが切り替わる。
                  config の actions.switchover は approved である（このステージに入った時点で確認済み）。
              RunOrder: 1
            - Name: Switchover
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref SwitchoverProject
                EnvironmentVariables: '[{"name":"SERVICE_NAME","value":"#{variables.ServiceName}","type":"PLAINTEXT"}]'
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: SwitchoverOutput }]
              RunOrder: 2

        # config の actions.cleanup が approved のときだけ入る。
        - Name: Cleanup
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: CleanupApproved
                    RuleTypeId: { Category: Rule, Owner: AWS, Provider: VariableCheck, Version: '1' }
                    Configuration:
                      Variable: '#{Approvals.CLEANUP_APPROVED}'
                      Value: approved
                      Operator: EQ
          Actions:
            - Name: ManualApproval
              ActionTypeId: { Category: Approval, Owner: AWS, Provider: Manual, Version: '1' }
              Configuration:
                NotificationArn: !If [HasApprovalTopic, !Ref ApprovalNotificationTopicArn, !Ref 'AWS::NoValue']
                CustomData: >-
                  Step 6 の観測期間を経て、切り戻しが不要と判断できてから承認する。
                  逆方向レプリケーションが残っていないことをローカルから確認済みであること。
                  旧 Blue の削除は不可逆である。
              RunOrder: 1
            - Name: Cleanup
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref CleanupProject
                EnvironmentVariables: '[{"name":"SERVICE_NAME","value":"#{variables.ServiceName}","type":"PLAINTEXT"}]'
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: CleanupOutput }]
              RunOrder: 2

Outputs:
  PipelineName:
    Description: 作成した CodePipeline 名
    Value: !Ref BlueGreenPipeline

  StartCommand:
    Description: サービスを指定してパイプラインを開始するコマンド
    Value: !Sub >-
      aws codepipeline start-pipeline-execution --name ${BlueGreenPipeline}
      --variables name=ServiceName,value=<service-name>

  CleanupRoleArn:
    Description: 破壊的権限（DeleteDBInstance 等）を持つロール。付与先を監査する際に使う
    Value: !GetAtt CleanupRole.Arn
