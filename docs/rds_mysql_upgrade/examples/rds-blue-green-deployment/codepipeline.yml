AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  RDS MySQL Blue/Green の Step 3（構築）、Step 4（検証）、Step 5（切替）を
  既存スクリプトで実行する CodePipeline / CodeBuild 定義。

Parameters:
  PipelineNamePrefix:
    Type: String
    Description: CodePipeline と CodeBuild プロジェクト名の共通接頭辞。
  EnvironmentName:
    Type: String
    AllowedValues: [staging, production]
    Description: config/blue-green 配下で参照する対象環境名。
  ServiceName:
    Type: String
    Description: config/blue-green/{EnvironmentName}.deployment.yml の services キー。
  CodeStarConnectionArn:
    Type: String
    Description: GitHub リポジトリへ接続済みの CodeConnections ARN。
  RepositoryId:
    Type: String
    Description: GitHub の owner/repository 形式のリポジトリ識別子。
  BranchName:
    Type: String
    Default: main
    Description: パイプラインが取得する Git ブランチ。
  ArtifactBucketName:
    Type: String
    Description: CodePipeline がソースと各 Step の成果物を保存する既存 S3 バケット名。
  CodePipelineServiceRoleArn:
    Type: String
    Description: CodePipeline 用の既存 IAM ロール ARN。S3、CodeBuild、CodeConnections 利用権限が必要。
  CodeBuildServiceRoleArn:
    Type: String
    Description: >-
      CodeBuild 用の既存 IAM ロール ARN。RDS/CloudWatch 読取に加え、Step 5 には
      rds:SwitchoverBlueGreenDeployment、rds:ModifyDBInstance、rds:PromoteReadReplica が必要。
  CollectMySqlRuntimeValues:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: true の場合だけ Step 4 で Green DB へ MySQL 接続して実効値を収集する。

  # Step 4 の 2 つのプロジェクトを配置する VPC。**両方とも同一 VPC 内に置く。**
  # レポート実行（VerifyGreen）は専用のサブネットへ隔離し、そこには外部経路を置かない。
  # VpcConfig は CodeBuild プロジェクトのプロパティなので、実行時には切り替えられない。
  VpcId:
    Type: String
    Default: ''
    Description: BuildReportTool と VerifyGreen を配置する VPC。空なら両方とも VPC 外で実行する
  BuildSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      BuildReportTool（Go ビルド）を置く subnet。Go module を取得するため
      外部へ出られる経路（NAT gateway など）が必要。既存の subnet を流用してよい。
  BuildSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: BuildReportTool に付けるセキュリティグループ。外向き 443/tcp を許可する
  VerifyGreenSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      **レポート実行（VerifyGreen）専用の private subnet。**RDS へ到達できること。
      外部 egress は持たせない。s3／logs／rds／monitoring／ssm の VPC endpoint を用意する。
  VerifyGreenSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: VerifyGreen に付けるセキュリティグループ。RDS 側の inbound で 3306/tcp を許可する
  VerifyGreenImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    Description: >-
      VerifyGreen のビルドイメージ。MySQL 実効値を収集する場合は、MySQL クライアントを
      同梱したカスタムイメージを指定する（private subnet では apt による導入ができない）。

Conditions:
  HasVpc: !Not [!Equals [!Ref VpcId, '']]
  HasCustomVerifyGreenImage: !Not [!Equals [!Ref VerifyGreenImage, 'aws/codebuild/standard:7.0']]

Resources:
  # Step 3: actions.build が approved の場合だけ、保護スナップショットと Green を作成する。
  BuildGreenProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-${ServiceName}-build-green'
      Description: RDS Blue/Green Step 3 - build Green
      ServiceRole: !Ref CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/build-green.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: CONFIG_FILE
            Type: PLAINTEXT
            Value: !Sub 'config/blue-green/${EnvironmentName}.deployment.yml'
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName

  # Step 4 の Go レポート生成器をビルドするだけのプロジェクト。
  # **外部ネットワーク（Go module の取得）へ出るのはここだけである。**
  # AWS API を呼ばないため VPC の外で動かせる。
  BuildReportToolProject:
    Type: AWS::CodeBuild::Project
    # subnet / SG の既定値は空だが、VpcConfig は条件が真のときだけ展開される。
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-${ServiceName}-build-report-tool'
      Description: RDS Blue/Green Step 4 - build the report generator
      ServiceRole: !Ref CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/build-report-tool.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      # Go module を取得するため、外部へ出られる経路がある subnet を指定する。
      # Elastic Network Interface 作成権限は CodeBuildServiceRoleArn のロール側で付与する。
      VpcConfig: !If
        - HasVpc
        - VpcId: !Ref VpcId
          Subnets: !Ref BuildSubnetIds
          SecurityGroupIds: !Ref BuildSecurityGroupIds
        - !Ref 'AWS::NoValue'

  # Step 4: AWS API 検証を常に行い、MySQL 接続はパラメータが true の場合だけ行う。
  VerifyGreenProject:
    Type: AWS::CodeBuild::Project
    # subnet / SG の既定値は空だが、VpcConfig は条件が真のときだけ展開される。
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-${ServiceName}-verify-green'
      Description: RDS Blue/Green Step 4 - verify Green
      ServiceRole: !Ref CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/verify-green.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        # レポート生成器は BuildReportTool の artifact から受け取るため、
        # このプロジェクトは Go も Go module の取得も必要としない。
        # MySQL 実効値を収集する場合は MySQL クライアント入りのイメージを指定する。
        Image: !Ref VerifyGreenImage
        ImagePullCredentialsType: !If [HasCustomVerifyGreenImage, SERVICE_ROLE, CODEBUILD]
        EnvironmentVariables:
          - Name: CONFIG_FILE
            Type: PLAINTEXT
            Value: !Sub 'config/blue-green/${EnvironmentName}.deployment.yml'
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName
          - Name: COLLECT_MYSQL_RUNTIME_VALUES
            Type: PLAINTEXT
            Value: !Ref CollectMySqlRuntimeValues

  # Step 5: CodePipeline の手動承認後でも、設定ファイルの actions.switchover が approved でなければ変更しない。
      # BuildReportTool と同一 VPC の、**レポート実行専用**の private subnet で実行する。
      # **この subnet に外部 egress は要らない。**未指定なら VPC 外で動く。
      # このテンプレートは CodeBuildServiceRoleArn を外部から受け取るため、
      # Elastic Network Interface 作成権限（ec2:CreateNetworkInterface など）はそのロール側で付与する。
      VpcConfig: !If
        - HasVpc
        - VpcId: !Ref VpcId
          Subnets: !Ref VerifyGreenSubnetIds
          SecurityGroupIds: !Ref VerifyGreenSecurityGroupIds
        - !Ref 'AWS::NoValue'

  SwitchoverProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-${ServiceName}-switchover'
      Description: RDS Blue/Green Step 5 - switchover
      ServiceRole: !Ref CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: ci/codebuild/switchover.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: CONFIG_FILE
            Type: PLAINTEXT
            Value: !Sub 'config/blue-green/${EnvironmentName}.deployment.yml'
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName

  # パイプラインは手動開始する。構成リポジトリへの push では Blue/Green 操作を開始しない。
  BlueGreenPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${PipelineNamePrefix}-${EnvironmentName}-${ServiceName}'
      PipelineType: V2
      RoleArn: !Ref CodePipelineServiceRoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Stages:
        - Name: Source
          Actions:
            - Name: SourceFromGitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
                DetectChanges: 'false'
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1
        # Step 4 で使う Go レポート生成器を先にビルドし、artifact で後段へ渡す。
        # VerifyGreen を VPC 内へ置く構成でも、外部ネットワークが要るのはこのステージだけになる。
        - Name: BuildReportTool
          Actions:
            - Name: BuildReportTool
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BuildReportToolProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: ReportToolOutput
              RunOrder: 1
        - Name: BuildGreen
          Actions:
            - Name: BuildGreen
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BuildGreenProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildGreenOutput
              RunOrder: 1
        - Name: VerifyGreen
          Actions:
            - Name: VerifyGreen
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref VerifyGreenProject
                # 入力が複数あるため、どれをソースとして展開するかを明示する。
                # 2 つ目は CODEBUILD_SRC_DIR_ReportToolOutput に展開され、
                # buildspec がそこからレポート生成器を受け取る。
                PrimarySource: SourceOutput
              InputArtifacts:
                - Name: SourceOutput
                - Name: ReportToolOutput
              OutputArtifacts:
                - Name: VerifyGreenOutput
              RunOrder: 1
        - Name: ApproveSwitchover
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: >-
                  Step 4 の成果物を確認し、config の actions.switchover: approved が
                  レビュー済みであることを確認してから承認する。
              RunOrder: 1
        - Name: Switchover
          Actions:
            - Name: Switchover
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref SwitchoverProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: SwitchoverOutput
              RunOrder: 1

Outputs:
  PipelineName:
    Description: 手動で start-pipeline-execution する CodePipeline 名。
    Value: !Ref BlueGreenPipeline
  VerifyGreenProjectName:
    Description: Step 4 専用 CodeBuild プロジェクト名。
    Value: !Ref VerifyGreenProject
