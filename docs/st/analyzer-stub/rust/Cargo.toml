[package]
name = "analyzer-stub"
version = "0.1.0"
edition = "2024"
publish = false
description = "Image analysis server stub (Rust) for checking the ticket QR API on AWS Lambda. See ../DESIGN.md."

[dependencies]
lambda_http = "1.3"
tokio = { version = "1", features = ["macros"] }
serde_json = { version = "1", features = ["preserve_order"] }  # ログと応答のキーを Node・Python 版と同じ順に
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
humantime = "2.4"
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-sdk-ssm = "1.128"

# Only for examples/local.rs (the local server). Not linked into the Lambda binary.
[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
