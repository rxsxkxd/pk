AWSTemplateFormatVersion: "2010-09-09"
Description: Image analysis server stub for checking the ticket QR API on AWS (Lambda + Function URL). See docs/st/analyzer-stub/DESIGN.md.

Parameters:
  Impl:
    Type: String
    AllowedValues: [node, python, rust]
    Default: node
    Description: Stub implementation. One stack per implementation.
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding analyzer-stub.zip.
  ArtifactPrefix:
    Type: String
    Description: Key prefix of analyzer-stub.zip, e.g. analyzer-stub/node/<git-sha>. Change it on every deploy.
  ApiKeyParameterName:
    Type: String
    AllowedPattern: ^/.+
    Description: Parameter Store SecureString holding the x-api-key value, e.g. /ticketqr/analyzer-stub/node/api-key (created outside this stack; CloudFormation cannot create SecureString).
  ReservedConcurrency:
    Type: Number
    Default: 5
    Description: Caps how much the public URL can be used.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Mappings:
  ImplMap:
    node:
      Runtime: nodejs24.x
      Handler: index.handler
    python:
      Runtime: python3.13
      Handler: index.handler
    rust:
      Runtime: provided.al2023
      Handler: bootstrap

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # SecureString with the AWS managed key (aws/ssm) needs no kms:Decrypt.
        - PolicyName: read-api-key
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameterName}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ticketqr-analyzer-stub-${Impl}
      RetentionInDays: !Ref LogRetentionDays

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Sub ticketqr-analyzer-stub-${Impl}
      Runtime: !FindInMap [ImplMap, !Ref Impl, Runtime]
      Handler: !FindInMap [ImplMap, !Ref Impl, Handler]
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 10
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub ${ArtifactPrefix}/analyzer-stub.zip
      Environment:
        Variables:
          API_KEY_PARAMETER_NAME: !Ref ApiKeyParameterName

  # Public HTTPS endpoint; access is limited by the x-api-key check in the function.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE

  # Function URLs with AuthType NONE need both permissions.
  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref Function
      Principal: "*"
      FunctionUrlAuthType: NONE
  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  AnalyzeUrl:
    Description: POST endpoint for the API's ANALYZER_URL.
    Value: !Sub ${FunctionUrl.FunctionUrl}v1/analyze
  ApiKeyParameterName:
    Description: Parameter holding the x-api-key value; pass to the API stack as AnalyzerApiKeyParameterName.
    Value: !Ref ApiKeyParameterName
