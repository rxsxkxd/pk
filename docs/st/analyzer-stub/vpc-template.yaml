AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Image analysis server stub in a given VPC and subnet (ECS Fargate task): the public subnet of network.yaml
  (task with a public IP), or a private subnet of an existing VPC. Only the tickets function's security group
  can reach it (TCP 8090); no API key (STUB_AUTH=none). Egress to ECR / CloudWatch Logs goes through the
  internet gateway (public subnet), VPC endpoints created here (CreateEndpoints=true) or a route the subnet
  already has (NAT or existing endpoints). The task is started and stopped by hand (aws ecs run-task /
  stop-task). See docs/st/DEPLOY.md 3.4.

Parameters:
  Impl:
    Type: String
    AllowedValues: [node, python, rust]
    Default: node
    Description: Stub implementation (container image). One stack per implementation.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the task (and for the interface endpoints when CreateEndpoints=true). The public subnet of network.yaml, or a private subnet.
  RouteTableId:
    Type: String
    Default: ""
    Description: Route table of SubnetId. Required when CreateEndpoints=true (the S3 gateway endpoint is added to it).
  CreateEndpoints:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      true = create interface endpoints (ecr.api, ecr.dkr, logs) and an S3 gateway endpoint for the task. Only in
      a VPC and route table used by the stub alone: private DNS and the restrictive endpoint policies apply to the
      whole VPC / route table. false = the subnet already reaches ECR and Logs (NAT gateway or existing endpoints).
  TaskSecurityGroupId:
    Type: String
    Default: ""
    AllowedPattern: ^(sg-[0-9a-f]+)?$
    Description: >-
      Security group for the task made elsewhere (TaskSecurityGroupId output of network.yaml). Empty = this stack
      makes one that admits AllowedSourceSecurityGroupId.
  AllowedSourceSecurityGroupId:
    Type: String
    Default: ""
    AllowedPattern: ^(sg-[0-9a-f]+)?$
    Description: Security group allowed to call the stub (the ticket API's tickets function), when TaskSecurityGroupId is empty. Same VPC or a peered VPC in the same region.
  ImageTag:
    Type: String
    Default: latest
    Description: Tag of the image pushed to this stack's ECR repository.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Conditions:
  UseEndpoints: !Equals [!Ref CreateEndpoints, "true"]
  CreateTaskSecurityGroup: !Equals [!Ref TaskSecurityGroupId, ""]

Rules:
  RouteTableForEndpoints:
    RuleCondition: !Equals [!Ref CreateEndpoints, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref RouteTableId, ""]]
        AssertDescription: RouteTableId is required when CreateEndpoints=true.
  SourceForOwnSecurityGroup:
    RuleCondition: !Equals [!Ref TaskSecurityGroupId, ""]
    Assertions:
      - Assert: !Not [!Equals [!Ref AllowedSourceSecurityGroupId, ""]]
        AssertDescription: AllowedSourceSecurityGroupId is required when TaskSecurityGroupId is empty.

Resources:
  # ---------- Image, logs, roles ----------
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ticketqr-analyzer-stub-${Impl}
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 5 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/ticketqr-analyzer-stub-${Impl}
      RetentionInDays: !Ref LogRetentionDays

  # Pulls the image and writes logs. The stub itself calls no AWS API, so there is no task role.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ---------- ECS ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ticketqr-analyzer-stub-${Impl}

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ticketqr-analyzer-stub-${Impl}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: stub
          Image: !Sub ${Repository.RepositoryUri}:${ImageTag}
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings: [{ ContainerPort: 8090, Protocol: tcp }]
          Environment:
            - { Name: STUB_AUTH, Value: none } # reachable only from AllowedSourceSecurityGroupId
            - { Name: PORT, Value: "8090" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: stub

  # ---------- Network ----------
  # Made here only when TaskSecurityGroupId is not given (a private subnet of an existing VPC).
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateTaskSecurityGroup
    Metadata:
      cfn-lint:
        config:
          # AllowedSourceSecurityGroupId may be empty in general, but not here (rule SourceForOwnSecurityGroup).
          ignore_checks: [W1030]
    Properties:
      GroupDescription: !Sub ticketqr analyzer stub (${Impl}) task
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8090
          ToPort: 8090
          SourceSecurityGroupId: !Ref AllowedSourceSecurityGroupId
          Description: the ticket API (tickets function)
      # Replaces the default allow-all egress: HTTPS only (ECR, S3 and CloudWatch Logs). Replies to the API need
      # no egress rule (security groups are stateful).
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: ECR, S3 and CloudWatch Logs

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseEndpoints
    Properties:
      GroupDescription: !Sub ticketqr analyzer stub (${Impl}) VPC endpoints
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !If [CreateTaskSecurityGroup, !Ref TaskSecurityGroup, !Ref TaskSecurityGroupId]
          Description: the stub task

  # The endpoint policies allow only what the task needs, in this account: pulling this repository and writing
  # this log group. They apply to every client of the endpoint, hence CreateEndpoints only in a stub-only VPC.
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcId: !Ref VpcId
      SubnetIds: [!Ref SubnetId]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Effect: Allow
            Principal: "*"
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
            Resource: !GetAtt Repository.Arn

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcId: !Ref VpcId
      SubnetIds: [!Ref SubnetId]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Effect: Allow
            Principal: "*"
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
            Resource: !GetAtt Repository.Arn

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcId: !Ref VpcId
      SubnetIds: [!Ref SubnetId]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt LogGroup.Arn

  # ECR keeps image layers in an AWS-owned S3 bucket per region.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseEndpoints
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcId: !Ref VpcId
      RouteTableIds: [!Ref RouteTableId]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::prod-${AWS::Region}-starport-layer-bucket/*

Outputs:
  ClusterName:
    Value: !Ref Cluster
  TaskDefinitionFamily:
    Value: !Sub ticketqr-analyzer-stub-${Impl}
  SubnetId:
    Value: !Ref SubnetId
  TaskSecurityGroupId:
    Description: Security group of the task (pass to aws ecs run-task).
    Value: !If [CreateTaskSecurityGroup, !Ref TaskSecurityGroup, !Ref TaskSecurityGroupId]
  RepositoryUri:
    Description: Push the stub image here (tag ImageTag).
    Value: !GetAtt Repository.RepositoryUri
  LogGroupName:
    Value: !Ref LogGroup
