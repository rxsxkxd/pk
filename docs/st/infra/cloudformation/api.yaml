AWSTemplateFormatVersion: "2010-09-09"
Description: Ticket QR API (ticketqr package on 2 functions + exampleqr package, behind one HTTP API). See docs/st/DEPLOY.md.

Parameters:
  Impl:
    Type: String
    AllowedValues: [go, node]
    Default: go
    Description: Implementation to deploy. One stack per implementation.
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the Lambda zip files.
  ArtifactPrefix:
    Type: String
    Description: Key prefix of ticketqr.zip and exampleqr.zip, e.g. ticketqr/go/<git-sha>. Change it on every deploy so Lambda picks up new code.
  SigningSaltParameterName:
    Type: String
    AllowedPattern: ^/.+
    Description: Parameter Store SecureString {"current":"...","previous":"..."}, e.g. /ticketqr/go/signing-salt (created outside this stack).
  AnalyzerMode:
    Type: String
    Default: mock
    AllowedValues: [mock, http]
    Description: mock = in-process, always valid. http = POST to AnalyzerUrl (Node version only for now).
  AnalyzerUrl:
    Type: String
    Default: ""
    Description: Image analysis endpoint for AnalyzerMode=http, e.g. the analyzer-stub stack's AnalyzeUrl output.
  AnalyzerApiKeyParameterName:
    Type: String
    Default: ""
    AllowedPattern: ^(/.+)?$
    Description: Parameter Store SecureString holding the analysis server's x-api-key (AnalyzerMode=http), e.g. /ticketqr/analyzer-stub/node/api-key.
  TicketSuffixLength:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 32
  PublicBaseUrl:
    Type: String
    Default: ""
    Description: Public API URL (custom domain). Empty uses the execute-api default URL.
  ThrottlingRateLimit:
    Type: Number
    Default: 50
    Description: Steady-state requests per second for every route.
  ThrottlingBurstLimit:
    Type: Number
    Default: 100
  IssueReservedConcurrency:
    Type: Number
    Default: -1
    Description: Reserved concurrency for the tickets function (issue + view; protects the analysis server). -1 = not set.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Mappings:
  ImplMap:
    go:
      Runtime: provided.al2023
      Handler: bootstrap
    node:
      Runtime: nodejs24.x
      Handler: index.handler

Conditions:
  UseDefaultUrl: !Equals [!Ref PublicBaseUrl, ""]
  HasIssueReservedConcurrency: !Not [!Equals [!Ref IssueReservedConcurrency, -1]]
  HasAnalyzerApiKey: !Not [!Equals [!Ref AnalyzerApiKeyParameterName, ""]]

Resources:
  # ---------- IAM ----------
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # SecureString with the AWS managed key (aws/ssm) needs no kms:Decrypt; add it if a custom KMS key is used.
        - PolicyName: read-signing-salt
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SigningSaltParameterName}
        - !If
          - HasAnalyzerApiKey
          - PolicyName: read-analyzer-api-key
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ssm:GetParameter
                  Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnalyzerApiKeyParameterName}
          - !Ref AWS::NoValue

  # exampleqr reads no secrets, so it gets a role with logging only.
  ExampleFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ---------- HTTP API ----------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ticketqr-${Impl}
      ProtocolType: HTTP

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/ticketqr-${Impl}
      RetentionInDays: !Ref LogRetentionDays

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","routeKey":"$context.routeKey","status":"$context.status","latency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'

  # ---------- A / B-1 / B-3: issue (analysis + code generation) and view, one function ----------
  # handler.Route dispatches on routeKey, so all three routes share one integration.
  TicketsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ticketqr-${Impl}-tickets
      RetentionInDays: !Ref LogRetentionDays
  TicketsFunction:
    Type: AWS::Lambda::Function
    DependsOn: TicketsLogGroup
    Properties:
      FunctionName: !Sub ticketqr-${Impl}-tickets
      Runtime: !FindInMap [ImplMap, !Ref Impl, Runtime]
      Handler: !FindInMap [ImplMap, !Ref Impl, Handler]
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt FunctionRole.Arn
      ReservedConcurrentExecutions: !If [HasIssueReservedConcurrency, !Ref IssueReservedConcurrency, !Ref AWS::NoValue]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub ${ArtifactPrefix}/ticketqr.zip
      Environment:
        Variables:
          PUBLIC_BASE_URL: !If [UseDefaultUrl, !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}", !Ref PublicBaseUrl]
          ANALYZER_MODE: !Ref AnalyzerMode
          ANALYZER_URL: !Ref AnalyzerUrl
          ANALYZER_API_KEY_PARAMETER_NAME: !If [HasAnalyzerApiKey, !Ref AnalyzerApiKeyParameterName, !Ref AWS::NoValue]
          SIGNING_SALT_PARAMETER_NAME: !Ref SigningSaltParameterName
          TICKET_SUFFIX_LENGTH: !Ref TicketSuffixLength
  TicketsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt TicketsFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 20000
  IssueInlineRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /v1/tickets/qr-inline
      Target: !Sub integrations/${TicketsIntegration}
  IssueRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /v1/tickets
      Target: !Sub integrations/${TicketsIntegration}
  GetViewRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /v1/tickets/{ticketCode}/view
      Target: !Sub integrations/${TicketsIntegration}
  TicketsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TicketsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  # ---------- B-2: GET /v1/tickets/{ticketCode}/qr ----------
  GetQRLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ticketqr-${Impl}-get-qr
      RetentionInDays: !Ref LogRetentionDays
  GetQRFunction:
    Type: AWS::Lambda::Function
    DependsOn: GetQRLogGroup
    Properties:
      FunctionName: !Sub ticketqr-${Impl}-get-qr
      Runtime: !FindInMap [ImplMap, !Ref Impl, Runtime]
      Handler: !FindInMap [ImplMap, !Ref Impl, Handler]
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 5
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub ${ArtifactPrefix}/ticketqr.zip
      Environment:
        Variables:
          PUBLIC_BASE_URL: !If [UseDefaultUrl, !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}", !Ref PublicBaseUrl]
          ANALYZER_MODE: !Ref AnalyzerMode
          ANALYZER_URL: !Ref AnalyzerUrl
          ANALYZER_API_KEY_PARAMETER_NAME: !If [HasAnalyzerApiKey, !Ref AnalyzerApiKeyParameterName, !Ref AWS::NoValue]
          SIGNING_SALT_PARAMETER_NAME: !Ref SigningSaltParameterName
          TICKET_SUFFIX_LENGTH: !Ref TicketSuffixLength
  GetQRIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetQRFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000
  GetQRRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /v1/tickets/{ticketCode}/qr
      Target: !Sub integrations/${GetQRIntegration}
  GetQRPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetQRFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  # ---------- GET /v1/example/qr (separate package: exampleqr.zip) ----------
  ExampleQRLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ticketqr-${Impl}-example-qr
      RetentionInDays: !Ref LogRetentionDays
  ExampleQRFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExampleQRLogGroup
    Properties:
      FunctionName: !Sub ticketqr-${Impl}-example-qr
      Runtime: !FindInMap [ImplMap, !Ref Impl, Runtime]
      Handler: !FindInMap [ImplMap, !Ref Impl, Handler]
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt ExampleFunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub ${ArtifactPrefix}/exampleqr.zip
  ExampleQRIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ExampleQRFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000
  ExampleQRRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /v1/example/qr
      Target: !Sub integrations/${ExampleQRIntegration}
  ExampleQRPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExampleQRFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

Outputs:
  ApiUrl:
    Description: Base URL of the API (PUBLIC_BASE_URL when no custom domain is set).
    Value: !If [UseDefaultUrl, !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}", !Ref PublicBaseUrl]
  ApiId:
    Value: !Ref HttpApi
