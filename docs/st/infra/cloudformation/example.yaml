AWSTemplateFormatVersion: "2010-09-09"
Description: example.com QR endpoint (GET /v1/example/qr) — exampleqr package on its own Lambda and HTTP API, unrelated to the ticket API. See docs/st/go/DEPLOY.md or docs/st/node/DEPLOY.md (7).

Parameters:
  Impl:
    Type: String
    AllowedValues: [go, node]
    Default: go
    Description: Implementation to deploy. One stack per implementation.
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding exampleqr.zip.
  ArtifactPrefix:
    Type: String
    Description: Key prefix of exampleqr.zip, e.g. ticketqr/go/<git-sha>. Change it on every deploy so Lambda picks up new code.
  ThrottlingRateLimit:
    Type: Number
    Default: 10
  ThrottlingBurstLimit:
    Type: Number
    Default: 20
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Mappings:
  ImplMap:
    go:
      Runtime: provided.al2023
      Handler: bootstrap
    node:
      Runtime: nodejs24.x
      Handler: index.handler

Resources:
  # Reads no secrets or configuration, so the role only allows logging.
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ticketqr-${Impl}-example-qr
      RetentionInDays: !Ref LogRetentionDays

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Sub ticketqr-${Impl}-example-qr
      Runtime: !FindInMap [ImplMap, !Ref Impl, Runtime]
      Handler: !FindInMap [ImplMap, !Ref Impl, Handler]
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub ${ArtifactPrefix}/exampleqr.zip

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ticketqr-${Impl}-example
      ProtocolType: HTTP

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /v1/example/qr
      Target: !Sub integrations/${Integration}

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

Outputs:
  ExampleQrUrl:
    Description: GET this URL for the example.com QR PNG.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/example/qr
