AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Network for the tickets function, pattern N2 (docs/st/notes/tickets-network.md 3.3): a new VPC with two
  private subnets (for the function), public subnets with NAT gateways (fixed Elastic IPs, used by the tickets
  function only), an internet gateway and the function's security group. The ticket API stack (SAM) takes the
  PrivateSubnetIds and SecurityGroupId outputs. NAT gateways and Elastic IPs are billed by the hour.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.50.0.0/24
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: CIDR of the new VPC. Keep it apart from networks the analysis server may be reached through privately later.
  PublicSubnetCidrA:
    Type: String
    Default: 10.50.0.0/27
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: Public subnet for the NAT gateway in AZ A.
  PublicSubnetCidrB:
    Type: String
    Default: 10.50.0.32/27
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: Public subnet for the NAT gateway in AZ B (made only when NatPerAz=true).
  PrivateSubnetCidrA:
    Type: String
    Default: 10.50.0.64/26
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: Private subnet for the tickets function in AZ A.
  PrivateSubnetCidrB:
    Type: String
    Default: 10.50.0.128/26
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: Private subnet for the tickets function in AZ B.
  NatPerAz:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      false = one NAT gateway in AZ A for both private subnets (cheaper; AZ B goes across AZs and depends on AZ A).
      true = a NAT gateway in each AZ (two Elastic IPs to register with the analysis server; twice the hourly cost).
  AnalyzerPort:
    Type: Number
    Default: 443
    MinValue: 1
    MaxValue: 65535
    Description: TCP port of the image analysis server. 443 is already allowed for Parameter Store.
  AnalyzerCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: Destination CIDR of the analysis server for AnalyzerPort (when it is not 443). 0.0.0.0/0 until the server's address is known.
  NamePrefix:
    Type: String
    Default: ticketqr
    AllowedPattern: ^[a-z0-9-]+$
    Description: Prefix of the Name tags.

Conditions:
  NatInEachAz: !Equals [!Ref NatPerAz, "true"]
  AnalyzerPortIsNot443: !Not [!Equals [!Ref AnalyzerPort, 443]]

Resources:
  # ---------- VPC and internet gateway ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets" }]
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------- Public subnets (NAT gateways only) ----------
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrA
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-public-a" }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Condition: NatInEachAz
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrB
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-public-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-public" }]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetRouteTableA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetRouteTableB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: NatInEachAz
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ---------- NAT gateways with fixed Elastic IPs (the source the analysis server sees) ----------
  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-nat-a" }]
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnetA
      AllocationId: !GetAtt NatEipA.AllocationId
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-a" }]
  NatEipB:
    Type: AWS::EC2::EIP
    Condition: NatInEachAz
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-nat-b" }]
  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: NatInEachAz
    Properties:
      SubnetId: !Ref PublicSubnetB
      AllocationId: !GetAtt NatEipB.AllocationId
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-b" }]

  # ---------- Private subnets for the tickets function ----------
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetCidrA
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-private-a" }]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetCidrB
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-private-b" }]

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-private-a" }]
  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets-private-b" }]
  PrivateSubnetRouteTableA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA
  PrivateSubnetRouteTableB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB
  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA
  # AZ B uses its own NAT when NatPerAz=true, else the NAT in AZ A.
  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [NatInEachAz, !Ref NatGatewayB, !Ref NatGatewayA]

  # ---------- The tickets function's security group ----------
  TicketsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ticketqr tickets function (no inbound; outbound HTTPS and the analysis server)
      VpcId: !Ref Vpc
      # Replaces the default allow-all egress. No inbound: the function is invoked by API Gateway, not over the VPC.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Parameter Store and the analysis server over HTTPS (through the NAT)
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-tickets" }]
  AnalyzerEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: AnalyzerPortIsNot443
    Properties:
      GroupId: !Ref TicketsSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref AnalyzerPort
      ToPort: !Ref AnalyzerPort
      CidrIp: !Ref AnalyzerCidr
      Description: the image analysis server

Outputs:
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetIds:
    Description: Subnets for the tickets function (VpcSubnetIds of the ticket API stack).
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  SecurityGroupId:
    Description: Security group for the tickets function (VpcSecurityGroupIds of the ticket API stack).
    Value: !Ref TicketsSecurityGroup
  NatPublicIps:
    Description: Fixed source IPs the analysis server sees; register them on its allowlist.
    Value: !If [NatInEachAz, !Join [",", [!GetAtt NatEipA.PublicIp, !GetAtt NatEipB.PublicIp]], !GetAtt NatEipA.PublicIp]
