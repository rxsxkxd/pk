AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Ticket QR API, go implementation (AWS SAM): sam build builds the Lambda code and sam deploy uploads it and
  deploys the HTTP API and the two functions. Go (provided.al2023): sam build runs the make targets build-TicketsFunction / build-GetQRFunction in go/Makefile. The tickets function goes into the private subnets made
  beforehand by infra/cloudformation/tickets-network-*.yaml (outputs PrivateSubnetIds, SecurityGroupId) and
  reaches the analysis server through their NAT gateway. Same API as infra/cloudformation/api.yaml (Impl=go),
  which is kept for comparison. See infra/sam/README.md.

Parameters:
  # tickets 関数を置くプライベートサブネット（必須。ネットワークのスタックの出力 PrivateSubnetIds）
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the tickets function (PrivateSubnetIds output of the network stack).
  # tickets 関数に付けるセキュリティグループ（必須。ネットワークのスタックの出力 SecurityGroupId）
  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group for the tickets function (SecurityGroupId output of the network stack).
  # 署名用 salt の Parameter Store（SecureString）の名前。スタックの外で作る
  SigningSaltParameterName:
    Type: String
    AllowedPattern: ^/.+
    Description: Parameter Store SecureString {"current":"...","previous":"..."}, e.g. /ticketqr/go/signing-salt (created outside this stack).
  # 画像解析の呼び方。mock = 呼ばずに常に PASS、http = AnalyzerUrl に画像を POST
  AnalyzerMode:
    Type: String
    Default: mock
    AllowedValues: [mock, http]
    Description: mock = in-process, always PASS. http = POST to AnalyzerUrl.
  # 画像解析サーバーの URL（AnalyzerMode=http のとき）
  AnalyzerUrl:
    Type: String
    Default: ""
    Description: Image analysis endpoint for AnalyzerMode=http.
  # 画像解析サーバーの API キー（x-api-key）の Parameter Store の名前（任意。空なら送らない）
  AnalyzerApiKeyParameterName:
    Type: String
    Default: ""
    AllowedPattern: ^(/.+)?$
    Description: Optional. Parameter Store SecureString holding the analysis server's x-api-key. Empty sends no x-api-key.
  # チケットコードの末尾の固定文字列（英数字1〜32文字）の Parameter Store（String）の名前。スタックの外で作る
  TicketCodeSuffixParameterName:
    Type: String
    AllowedPattern: ^/.+
    Description: Parameter Store String holding the fixed suffix of ticket codes (1-32 letters or digits), e.g. /ticketqr/go/ticket-code-suffix (created outside this stack).
  # 公開する API の URL。独自ドメイン、または統合の構成での CloudFront の URL。空なら execute-api の URL
  PublicBaseUrl:
    Type: String
    Default: ""
    Description: >-
      Public API URL: a custom domain, or the CloudFront URL (web.yaml WebUrl) when CloudFront forwards /v1/* to
      this API (unified layout). Empty uses the execute-api default URL.
  # 証明書の画像の上限（バイト。最大 4MB）。SPA の config.json の maxImageBytes と同じ値にする
  MaxImageBytes:
    Type: Number
    Default: 4194304
    MinValue: 1
    MaxValue: 4194304
    Description: >-
      Upload limit of the certificate image in bytes (MAX_IMAGE_BYTES). 4194304 (4MB) is the ceiling (Lambda's
      6MB request, base64 by API Gateway); lower it when the path to the API has a smaller limit. Keep the SPA's
      config.json maxImageBytes the same (DESIGN.md 5).
  # 全ルート共通のスロットリング（1秒あたりの定常のリクエスト数）
  ThrottlingRateLimit:
    Type: Number
    Default: 50
    Description: Steady-state requests per second for every route.
  # 全ルート共通のスロットリング（一時的に受けられるリクエスト数の上限）
  ThrottlingBurstLimit:
    Type: Number
    Default: 100
    Description: Maximum burst of requests for every route (API Gateway throttling).
  # tickets 関数の予約同時実行数（画像解析サーバーを守るため）。-1 = 設定しない
  GrantReservedConcurrency:
    Type: Number
    Default: -1
    Description: Reserved concurrency for the tickets function (protects the analysis server). -1 = not set.
  # ログ（Lambda と API のアクセスログ）の保持日数
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: Days to keep the Lambda and API access logs.
  # 関数・API・ロググループの名前の先頭（例: ticketqr-go → ticketqr-go-tickets、/aws/lambda/ticketqr-go-tickets）。
  # 空ならスタック名を使う。関数の名前は 64 文字までなので、57 文字まで
  NamePrefix:
    Type: String
    Default: ""
    AllowedPattern: ^([A-Za-z0-9][A-Za-z0-9_-]{0,56})?$
    Description: Prefix of the function, API and log group names (e.g. ticketqr-go gives ticketqr-go-tickets). Empty = the stack name.

Conditions:
  UseDefaultUrl: !Equals [!Ref PublicBaseUrl, ""]
  HasGrantReservedConcurrency: !Not [!Equals [!Ref GrantReservedConcurrency, -1]]
  HasAnalyzerApiKey: !Not [!Equals [!Ref AnalyzerApiKeyParameterName, ""]]
  HasNamePrefix: !Not [!Equals [!Ref NamePrefix, ""]]

Globals:
  Function:
    Architectures: [arm64]
    MemorySize: 256
    Environment:
      Variables:
        PUBLIC_BASE_URL: !If [UseDefaultUrl, !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}", !Ref PublicBaseUrl]
        ANALYZER_MODE: !Ref AnalyzerMode
        ANALYZER_URL: !Ref AnalyzerUrl
        ANALYZER_API_KEY_PARAMETER_NAME: !If [HasAnalyzerApiKey, !Ref AnalyzerApiKeyParameterName, !Ref AWS::NoValue]
        SIGNING_SALT_PARAMETER_NAME: !Ref SigningSaltParameterName
        TICKET_CODE_SUFFIX_PARAMETER_NAME: !Ref TicketCodeSuffixParameterName

Resources:
  # ---------- HTTP API ($default stage, auto deploy, throttling, access log) ----------
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - /aws/apigateway/${Prefix}
        - Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref AWS::StackName]
      RetentionInDays: !Ref LogRetentionDays

  # Plain API Gateway resources, as in infra/cloudformation/api.yaml. (AWS::Serverless::HttpApi with function
  # Events embeds the function ARNs in the API, while the functions' PUBLIC_BASE_URL refers to the API: a
  # circular dependency. Separate integrations and routes avoid it.)
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !If [HasNamePrefix, !Ref NamePrefix, !Ref AWS::StackName]
      ProtocolType: HTTP

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","routeKey":"$context.routeKey","status":"$context.status","latency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'

  # ---------- tickets: QR inline grant API, ticket grant API, ticket view page (in the VPC) ----------
  TicketsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - /aws/lambda/${Prefix}-tickets
        - Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref AWS::StackName]
      RetentionInDays: !Ref LogRetentionDays
  TicketsFunction:
    Type: AWS::Serverless::Function
    DependsOn: TicketsLogGroup
    # Built by `make build-TicketsFunction` in go/ (same flags as `make -C go build`): bootstrap for arm64.
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub
        - ${Prefix}-tickets
        - Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref AWS::StackName]
      CodeUri: ../../../go
      Runtime: provided.al2023
      Handler: bootstrap
      Timeout: 15
      ReservedConcurrentExecutions: !If [HasGrantReservedConcurrency, !Ref GrantReservedConcurrency, !Ref AWS::NoValue]
      # In the private subnets; out to the analysis server and Parameter Store through the NAT gateway. SAM adds
      # AWSLambdaVPCAccessExecutionRole to the function's role.
      Environment:
        Variables:
          MAX_IMAGE_BYTES: !Ref MaxImageBytes # uploads reach this function only (merged with Globals)
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SigningSaltParameterName}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TicketCodeSuffixParameterName}
        - !If
          - HasAnalyzerApiKey
          - Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnalyzerApiKeyParameterName}
          - !Ref AWS::NoValue

  TicketsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt TicketsFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 20000
  GrantInlineRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /v1/tickets/qr-inline
      Target: !Sub integrations/${TicketsIntegration}
  GrantRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /v1/tickets
      Target: !Sub integrations/${TicketsIntegration}
  GetViewRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /v1/tickets/{ticketCode}/view
      Target: !Sub integrations/${TicketsIntegration}
  TicketsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TicketsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  # ---------- get-qr: QR image API (outside the VPC; calls no analysis server) ----------
  GetQRLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - /aws/lambda/${Prefix}-get-qr
        - Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref AWS::StackName]
      RetentionInDays: !Ref LogRetentionDays
  GetQRFunction:
    Type: AWS::Serverless::Function
    DependsOn: GetQRLogGroup
    # Built by `make build-GetQRFunction` in go/ (same flags as `make -C go build`): bootstrap for arm64.
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub
        - ${Prefix}-get-qr
        - Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref AWS::StackName]
      CodeUri: ../../../go
      Runtime: provided.al2023
      Handler: bootstrap
      Timeout: 5
      # Same code and start-up as tickets, which reads the salt (and the analyzer key when set).
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SigningSaltParameterName}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TicketCodeSuffixParameterName}
        - !If
          - HasAnalyzerApiKey
          - Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnalyzerApiKeyParameterName}
          - !Ref AWS::NoValue

  GetQRIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetQRFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000
  GetQRRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /v1/tickets/{ticketCode}/qr
      Target: !Sub integrations/${GetQRIntegration}
  GetQRPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetQRFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

Outputs:
  ApiUrl:
    Description: Base URL of the API (PUBLIC_BASE_URL when no custom domain is set).
    Value: !If [UseDefaultUrl, !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}", !Ref PublicBaseUrl]
  ApiId:
    Value: !Ref HttpApi
  ApiDomain:
    Description: Domain of the execute-api endpoint, for web.yaml ApiOriginDomain (unified layout, CloudFront forwards /v1/* here).
    Value: !Sub "${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
