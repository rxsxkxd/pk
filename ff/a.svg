<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760">
  <defs>
    <!-- 矢印マーカー（通常・点線・BI用） -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-tenant" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d" />
    </marker>
    <marker id="arrow-bi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8" />
    </marker>
    <style>
      .text-main { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .text-sub { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; dominant-baseline: central; }
      .text-badge { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #b91c1c; text-anchor: middle; dominant-baseline: central; }
      .text-legend { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; font-size: 12px; fill: #334155; dominant-baseline: central; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 6; }
      .container-ec2 { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6,4; rx: 10; }
      .container-ecs { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; stroke-dasharray: 6,4; rx: 10; }
      .container-bi { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 6,4; rx: 10; }
      .line { stroke: #1e293b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .line-no-arrow { stroke: #1e293b; stroke-width: 1.8; fill: none; }
      .line-tenant { stroke: #15803d; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow-tenant); }
      .line-bi { stroke: #1d4ed8; stroke-width: 1.8; fill: none; marker-end: url(#arrow-bi); }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1120" height="760" fill="#ffffff" />

  <!-- 凡例（右上） -->
  <g transform="translate(760, 20)">
    <rect x="0" y="0" width="320" height="65" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
    <line x1="15" y1="20" x2="50" y2="20" class="line" />
    <text x="60" y="20" class="text-legend">通常リクエスト・内部連携</text>
    <line x1="15" y1="36" x2="50" y2="36" class="line-tenant" />
    <text x="60" y="36" class="text-legend">動的テナント切替ルーティング (DB1/DB2)</text>
    <line x1="15" y1="52" x2="50" y2="52" class="line-bi" />
    <text x="60" y="52" class="text-legend">外部 BI 用 DB へのアクセス</text>
  </g>

  <!-- WWW & CloudFront -->
  <rect x="210" y="20" width="140" height="38" class="box" />
  <text x="280" y="39" class="text-main">WWW</text>

  <rect x="190" y="80" width="180" height="40" class="box" />
  <text x="280" y="100" class="text-main">CloudFront</text>
  <line x1="280" y1="58" x2="280" y2="76" class="line" />

  <!-- ==================== 左側: マルチテナント EC2 セット (×5) ==================== -->
  <rect x="40" y="160" width="330" height="420" class="container-ec2" />
  <text x="165" y="185" class="text-main">EC2 (テナント別構成)</text>
  <rect x="265" y="173" width="85" height="24" fill="#fee2e2" stroke="#ef4444" rx="4" />
  <text x="307.5" y="185" class="text-badge">×5 Tenants</text>

  <!-- App -->
  <rect x="75" y="215" width="260" height="115" class="box" />
  <text x="205" y="262" class="text-main">App</text>
  <text x="205" y="282" class="text-sub">(Apache / Passenger / Rails)</text>

  <!-- DB 1 & DB 2 -->
  <rect x="75" y="490" width="115" height="50" class="box" />
  <text x="132.5" y="515" class="text-main">DB 1</text>

  <rect x="220" y="490" width="115" height="50" class="box" />
  <text x="277.5" y="515" class="text-main">DB 2</text>

  <line x1="132.5" y1="330" x2="132.5" y2="486" class="line" />
  <line x1="277.5" y1="330" x2="277.5" y2="486" class="line" />

  <!-- ==================== 右側: 共通 ECS セット (動的テナント切替) ==================== -->
  <rect x="440" y="160" width="640" height="420" class="container-ecs" />
  <text x="760" y="185" class="text-main" style="fill: #166534;">ECS (共通 1セット / テナント動的切替)</text>

  <!-- 中央上: Go (API) -->
  <rect x="480" y="215" width="230" height="75" class="box" />
  <text x="595" y="242" class="text-main">Go (API)</text>
  <text x="595" y="262" class="text-sub">ルーティング・テナント切替制御</text>

  <!-- 中央下: Go -->
  <rect x="480" y="365" width="230" height="75" class="box" />
  <text x="595" y="402.5" class="text-main">Go (Worker / Batch)</text>

  <!-- 右上: Rails -->
  <rect x="800" y="215" width="230" height="75" class="box" />
  <text x="915" y="242" class="text-main">Rails</text>
  <text x="915" y="262" class="text-sub">(Web App)</text>

  <!-- 右下: Python -->
  <rect x="800" y="365" width="230" height="75" class="box" />
  <text x="915" y="402.5" class="text-main">Python</text>

  <!-- ==================== 最下部: システム外 BI 用 DB ==================== -->
  <rect x="440" y="625" width="640" height="105" class="container-bi" />
  <text x="760" y="648" class="text-main" style="fill: #1e40af;">システム外 リソース</text>

  <rect x="520" y="665" width="480" height="48" class="box" />
  <text x="760" y="689" class="text-main">BI 用 データベース群</text>

  <!-- ==================== 接続矢印 ==================== -->
  <!-- CloudFront からの分岐 -->
  <line x1="280" y1="120" x2="280" y2="211" class="line" />
  <path d="M 370 100 L 915 100" class="line-no-arrow" />
  <line x1="595" y1="100" x2="595" y2="211" class="line" />
  <line x1="915" y1="100" x2="915" y2="211" class="line" />

  <!-- ECS 内部の連携 -->
  <line x1="595" y1="290" x2="595" y2="361" class="line" />
  <line x1="915" y1="290" x2="915" y2="361" class="line" />
  <line x1="800" y1="270" x2="714" y2="365" class="line" />
  <path d="M 710 252 C 755 252, 755 385, 796 385" class="line" />

  <!-- 共通 ECS -> 左側マルチテナント DB への動的ルーティング -->
  <path d="M 480 252 C 400 252, 360 440, 155 486" class="line-tenant" />
  <path d="M 480 395 C 410 395, 360 465, 295 486" class="line-tenant" />
  <path d="M 800 420 C 560 565, 340 565, 295 544" class="line-tenant" />

  <!-- 外部 BI 用 DB への接続（青線） -->
  <!-- 左側 App -> BI DB -->
  <path d="M 205 330 C 205 689, 390 689, 516 689" class="line-bi" />
  <!-- 中央下 Go -> BI DB -->
  <path d="M 595 440 C 595 560, 560 560, 560 661" class="line-bi" />
  <!-- 右下 Python -> BI DB -->
  <path d="M 915 440 C 915 560, 950 560, 950 661" class="line-bi" />
</svg>
