AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  S3 上の画像の上半分にガウスぼかしを適用してマスキングし、同じバケットの
  別階層へ保存する。キーは <prefix>/<x>/<y>/<infix>/<z>/<n> の形に固定し、
  原本とマスク済みは infix だけが異なる。
  設計: docs/image-blur-lambda-design.md

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]
  KeyPrefix:
    Type: String
    Default: masking
    Description: >
      共有バケット内でこのアプリが使うルート。キーは
      <prefix>/<x>/<y>/<infix>/<z>/<n> の形に固定する。
  OriginalInfix:
    Type: String
    Default: original
    Description: 原本の階層名。マスク済みは MaskingPolicyVersion の階層に出る。
  MaskingPolicyVersion:
    Type: String
    Default: v1
    Description: >
      マスク済みの階層名。マスクの強度に関わる設定を変えたらこれも上げる。
      上げないと、処理済みのオブジェクトが再処理されず新旧が混在する。
  MaskHeightRatio:
    Type: String
    Default: '0.5'
    Description: 画像上部からマスクする高さの比率。0.5 = 上半分。
  BlurRatio:
    Type: String
    Default: '0.04'
    Description: ぼかし半径を短辺に対する比率で指定。絶対値では指定させない。
  DownscaleFactor:
    Type: Number
    Default: 4
    Description: >
      マスク領域を 1/N に縮小してからぼかす。処理量が減り、縮小で情報が物理的に
      失われるため復元耐性も上がる。1 で無効。縮小は領域内だけで、領域外には影響しない。
  MaxAllowedLaplacianVar:
    Type: String
    Default: '15.0'
    Description: >
      マスク強度の自己検証しきい値。超えたら出力せず DLQ へ送る。
      マスクの強さ自体は BlurRatio で担保しており、これは設定を桁で取り違えた
      事故を拾うための粗い網。厳しくしすぎると正常な画像が DLQ に落ちる。

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Timeout: 60
    MemorySize: 2048
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON

Resources:
  # ---------- KMS ----------
  # 原本とマスク済みを同じバケットに置くため、バケット既定の暗号化キーは 1 つになる。
  # 別バケット構成なら原本用と出力用でキーを分けられたが、この構成では分けられない。
  ImageKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'image-mask ${Env}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'

  # ---------- 画像バケット ----------
  # 他のリソースと共有する前提。このアプリの領域は KeyPrefix 配下に閉じる。
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'image-mask-${Env}-${AWS::AccountId}'
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ImageKey
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          # 中断したマルチパートアップロードの断片を片付けるだけ。
          # オブジェクトの自動削除は行わない（保持期間は要件が出てから決める）。
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt MaskFunction.Arn
            Filter:
              S3Key:
                Rules:
                  # 通知フィルタはプレフィックスと接尾辞しか指定できず、
                  # infix は x/y の後ろにあるため原本だけに絞れない。
                  # マスク済みの書き込みでも通知が飛ぶので、Lambda 側で infix を見て
                  # 弾いている（再帰ループ防止）。
                  - Name: prefix
                    Value: !Sub '${KeyPrefix}/'
    DependsOn: MaskFunctionInvokePermission

  MaskFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MaskFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ImageBucket.Arn
              - !Sub '${ImageBucket.Arn}/*'
            Condition:
              Bool: { 'aws:SecureTransport': false }
          - Sid: OnlyMaskFunctionMayWriteMaskedObjects
            # 原本が誤ってマスク済みの階層へコピーされる経路を塞ぐ。
            Effect: Deny
            Principal: '*'
            Action: ['s3:PutObject', 's3:PutObjectAcl']
            Resource: !Sub '${ImageBucket.Arn}/${KeyPrefix}/*/*/${MaskingPolicyVersion}/*'
            Condition:
              StringNotEquals:
                'aws:PrincipalArn': !GetAtt MaskFunctionRole.Arn

  # ---------- 失敗イベントの退避先 ----------
  DLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'image-mask-dlq-${Env}'
      MessageRetentionPeriod: 1209600 # 14 日
      SqsManagedSseEnabled: true

  # ---------- Lambda ----------
  MaskFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      FunctionName: !Sub 'image-mask-${Env}'
      CodeUri: ./cmd/mask
      Handler: bootstrap
      ReservedConcurrentExecutions: 200
      Environment:
        Variables:
          INPUT_BUCKET: !Sub 'image-mask-${Env}-${AWS::AccountId}'
          OUTPUT_BUCKET: !Sub 'image-mask-${Env}-${AWS::AccountId}'
          KEY_PREFIX: !Ref KeyPrefix
          ORIGINAL_INFIX: !Ref OriginalInfix
          MASKING_POLICY_VERSION: !Ref MaskingPolicyVersion
          MASK_HEIGHT_RATIO: !Ref MaskHeightRatio
          MIN_BLUR_RATIO: !Ref BlurRatio
          MIN_BLUR_RADIUS_PX: '8'
          BLUR_PASSES: '2'
          DOWNSCALE_FACTOR: !Ref DownscaleFactor
          STRENGTH_BLOCK_PX: '64'
          MAX_ALLOWED_LAPLACIAN_VAR: !Ref MaxAllowedLaplacianVar
          MAX_INPUT_BYTES: '20971520'
          MAX_INPUT_PIXELS: '64000000'
          JPEG_QUALITY: '85'
          LOG_LEVEL: INFO
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt DLQ.Arn
      Policies:
        # 最小権限。原本は読むだけ、マスク済みは書くだけ。
        # x と y は可変なのでワイルドカードで受ける。
        - Statement:
            - Sid: ReadOriginals
              Effect: Allow
              Action: ['s3:GetObject', 's3:GetObjectVersion']
              Resource: !Sub '${ImageBucket.Arn}/${KeyPrefix}/*/*/${OriginalInfix}/*'
            - Sid: WriteMasked
              Effect: Allow
              Action: 's3:PutObject'
              Resource: !Sub '${ImageBucket.Arn}/${KeyPrefix}/*/*/${MaskingPolicyVersion}/*'
            - Sid: HeadMaskedForIdempotency
              Effect: Allow
              Action: 's3:GetObject'
              Resource: !Sub '${ImageBucket.Arn}/${KeyPrefix}/*/*/${MaskingPolicyVersion}/*'
            - Sid: UseKey
              Effect: Allow
              Action: ['kms:Decrypt', 'kms:GenerateDataKey', 'kms:Encrypt', 'kms:DescribeKey']
              Resource: !GetAtt ImageKey.Arn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DLQ.QueueName

  # ---------- 監査: 誰がいつ原本を取得したかを記録する (FR-11) ----------
  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'image-mask-trail-${Env}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: 's3:GetBucketAcl'
            Resource: !GetAtt TrailBucket.Arn
          - Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: 's3:PutObject'
            Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals: { 's3:x-amz-acl': bucket-owner-full-control }

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub 'image-mask-${Env}'
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: false
          DataResources:
            # 原本だけに絞りたいが、データイベントのセレクタもプレフィックス指定のため
            # x/y の後ろにある infix では絞れない。KeyPrefix 配下すべてを記録する。
            - Type: 'AWS::S3::Object'
              Values: [!Sub '${ImageBucket.Arn}/${KeyPrefix}/']

  # ---------- アラーム ----------
  MaskStrengthCheckFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'image-mask-${Env}-strength-check-failed'
      AlarmDescription: >
        マスク強度の自己検証に失敗した。出力は行われていないが、
        半径算出やパラメータに問題がある可能性が高い。即調査。
      Namespace: ImageMask
      MetricName: StrengthCheckFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'image-mask-${Env}-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref MaskFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DLQNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'image-mask-${Env}-dlq-not-empty'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt DLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'image-mask-${Env}-throttles'
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref MaskFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ImageBucketName:
    Description: 原本とマスク済みを置くバケット
    Value: !Ref ImageBucket
  OriginalKeyPattern:
    Description: 原本のキー。ここへ PUT すると処理が走る
    Value: !Sub '${KeyPrefix}/<x>/<y>/${OriginalInfix}/<z>/<n>'
  MaskedKeyPattern:
    Description: マスク済みのキー
    Value: !Sub '${KeyPrefix}/<x>/<y>/${MaskingPolicyVersion}/<z>/<n>'
  DLQUrl:
    Description: 失敗イベントの退避先
    Value: !Ref DLQ
  FunctionName:
    Value: !Ref MaskFunction
