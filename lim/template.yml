AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  S3 上の画像の上半分にガウスぼかしを適用してマスキングし、同じバケットの
  別階層へ保存する。キーは <prefix>/<x>/<y>/<infix>/<z>/<n> の形に固定し、
  原本とマスク済みは infix だけが異なる。
  設計: docs/image-blur-lambda-design.md

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]
  EnableS3Trigger:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Amazon S3 イベント通知（`s3:ObjectCreated:*`）で起動するかどうか。既定は無効で、リクエスト起動のみ。
      実装は両方に対応しているので、true にすればイベント通知による起動も使える。
  AlertEmail:
    Type: String
    Default: ''
    Description: >
      アラート通知先のメールアドレス。空なら通知先を作らない（CloudWatch アラーム自体は動く）。
      指定した場合、デプロイ後にそのアドレス宛の確認メールに承認リンクが届く。
      承認するまで通知は届かない（CloudFormation では自動承認できない）。
  KeyPrefix:
    Type: String
    Default: ''
    Description: >
      共有バケット内でこのアプリが使うルート。任意で、空なら付けない。
      キーは [<prefix>/]<tid>/<infix>/<date>/<lid>/<eid> の形に固定する。
      空にすると IAM もイベント通知フィルタもバケット全体が対象になるため、
      他のリソースと共有するバケットでは指定を推奨。
  OriginalInfix:
    Type: String
    Default: no-masked
    Description: 原本の階層名。
  MaskedInfix:
    Type: String
    Default: masked
    Description: マスク済みの階層名。原本とはこの階層だけが異なる。
  MaskingPolicyVersion:
    Type: String
    Default: v1
    Description: >
      マスクの強度設定を識別するラベル。キーには含めず、出力のメタデータにだけ記録する。
      強度に関わる設定（MaskHeightRatio / BlurRatio / DownscaleFactor など）を変えたら
      これも上げる。上げると過去の出力が作り直され、同じキーが上書きされる。
      上げないと、処理済みのオブジェクトは古い強度のまま残る。
  MaskHeightRatio:
    Type: String
    Default: '0.5'
    Description: 画像上部からマスクする高さの比率。0.5 = 上半分。
  BlurRatio:
    Type: String
    Default: '0.04'
    Description: ぼかし半径を短辺に対する比率で指定。絶対値では指定させない。
  DownscaleFactor:
    Type: Number
    Default: 4
    Description: >
      マスク領域を 1/N に縮小してからぼかす。処理量が減り、縮小で情報が物理的に
      失われるため復元耐性も上がる。1 で無効。縮小は領域内だけで、領域外には影響しない。
  MaxAllowedLaplacianVar:
    Type: String
    Default: '15.0'
    Description: >
      マスク強度の自己検証しきい値。超えたら出力せず失敗にする。
      マスクの強さ自体は BlurRatio で担保しており、これは設定を桁で取り違えた
      事故を拾うための粗い網。厳しくしすぎると正常な画像まで失敗になる。

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  S3TriggerEnabled: !Equals [!Ref EnableS3Trigger, 'true']
  HasKeyPrefix: !Not [!Equals [!Ref KeyPrefix, '']]

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Timeout: 60
    MemorySize: 2048
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON

Resources:
  # ---------- KMS ----------
  # 原本とマスク済みを同じバケットに置くため、バケット既定の暗号化キーは 1 つになる。
  # 別バケット構成なら原本用と出力用でキーを分けられたが、この構成では分けられない。
  ImageKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'image-mask ${Env}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'

  # ---------- 画像バケット ----------
  # 他のリソースと共有する前提。このアプリの領域は KeyPrefix 配下に閉じる。
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      # このバケット名は Lambda の環境変数と IAM の ARN でも同じ式を書いている
      # （!GetAtt を使うと循環参照になるため）。変更するときは
      # 'image-mask-${Env}-${AWS::AccountId}' を検索して全箇所を直すこと。
      BucketName: !Sub 'image-mask-${Env}-${AWS::AccountId}'
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ImageKey
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          # 中断したマルチパートアップロードの断片を片付けるだけ。
          # オブジェクトの自動削除は行わない（保持期間は要件が出てから決める）。
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      # イベント通知は既定で無効。EnableS3Trigger=true で有効になる。
      NotificationConfiguration: !If
        - S3TriggerEnabled
        - LambdaConfigurations:
            - Event: 's3:ObjectCreated:*'
              Function: !GetAtt MaskFunction.Arn
              Filter:
                S3Key:
                  Rules:
                    # イベント通知フィルタはプレフィックスと接尾辞しか指定できず、
                    # infix は tid の後ろにあるため原本だけには絞れない。
                    # マスク済みの書き込みでもイベント通知が飛ぶので、Lambda 側で infix を見て
                    # 弾いている（再帰ループ防止）。
                    # KeyPrefix が空のときはバケット全体が対象になる。
                    - Name: prefix
                      Value: !If [HasKeyPrefix, !Sub '${KeyPrefix}/', '']
        - !Ref AWS::NoValue

  # S3 イベント通知を有効にしたときだけ作る。
  #
  # S3 はイベント通知の設定を受け付ける際、その場で Lambda を呼べるかを検証する。
  # そのため本来はこの許可をイベント通知より先に作りたいが、ImageBucket に
  # DependsOn を書くと、イベント通知が無効なとき「存在しないリソースに依存している」
  # ことになり cfn-lint (E3005) に弾かれる。
  # 依存を明示できないため、EnableS3Trigger を false から true に変える更新では
  # 順序が保証されず、次のエラーで失敗することがある。
  #
  #   Unable to validate the following destination configurations
  #
  # その場合はもう一度デプロイすれば通る（許可は作成済みになっているため）。
  # SourceArn はバケット名から組み立てる。!GetAtt ImageBucket.Arn を使うと
  # 権限 -> バケット -> 権限 の循環参照になる。
  MaskFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: S3TriggerEnabled
    Properties:
      FunctionName: !GetAtt MaskFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::image-mask-${Env}-${AWS::AccountId}'

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ImageBucket.Arn
              - !Sub '${ImageBucket.Arn}/*'
            Condition:
              Bool: { 'aws:SecureTransport': false }
          - Sid: OnlyMaskFunctionMayWriteMaskedObjects
            # 原本が誤ってマスク済みの階層へコピーされる経路を塞ぐ。
            Effect: Deny
            Principal: '*'
            Action: ['s3:PutObject', 's3:PutObjectAcl']
            Resource: !If
              - HasKeyPrefix
              - !Sub '${ImageBucket.Arn}/${KeyPrefix}/*/${MaskedInfix}/*'
              - !Sub '${ImageBucket.Arn}/*/${MaskedInfix}/*'
            Condition:
              StringNotEquals:
                'aws:PrincipalArn': !GetAtt MaskFunctionRole.Arn

  # ---------- アラート通知 ----------
  # CloudWatch アラーム -> SNS -> メール。
  # 暗号化は掛けていない。掛ける場合は SNS 管理の既定キーではなく
  # カスタマー管理キーが必要で、CloudWatch からの発行を許可する
  # キーポリシーを書く必要がある（既定キーはポリシーを変更できない）。
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'image-mask-alerts-${Env}'
      DisplayName: !Sub 'image-mask ${Env}'

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------- Lambda ----------
  MaskFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # go1.x ではなく makefile を使う。ldflags を渡してバイナリを小さくするため
      # （デバッグ情報とシンボルを落とす）。ビルド手順はリポジトリ直下の Makefile の
      # build-MaskFunction ターゲットにある。
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub 'image-mask-${Env}'
      CodeUri: .
      Handler: bootstrap
      ReservedConcurrentExecutions: 200
      Environment:
        Variables:
          INPUT_BUCKET: !Sub 'image-mask-${Env}-${AWS::AccountId}'
          OUTPUT_BUCKET: !Sub 'image-mask-${Env}-${AWS::AccountId}'
          KEY_PREFIX: !Ref KeyPrefix
          ORIGINAL_INFIX: !Ref OriginalInfix
          MASKED_INFIX: !Ref MaskedInfix
          MASKING_POLICY_VERSION: !Ref MaskingPolicyVersion
          MASK_HEIGHT_RATIO: !Ref MaskHeightRatio
          MIN_BLUR_RATIO: !Ref BlurRatio
          MIN_BLUR_RADIUS_PX: '8'
          BLUR_PASSES: '2'
          DOWNSCALE_FACTOR: !Ref DownscaleFactor
          STRENGTH_BLOCK_PX: '64'
          MAX_ALLOWED_LAPLACIAN_VAR: !Ref MaxAllowedLaplacianVar
          MAX_INPUT_BYTES: '20971520'
          MAX_INPUT_PIXELS: '64000000'
          JPEG_QUALITY: '85'
          LOG_LEVEL: INFO
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
        # 失敗イベントの退避先（DLQ）は置いていない。リトライを使い切った
        # イベントは破棄される。どのオブジェクトで失敗したかは CloudWatch Logs と
        # アラームで分かるので、再処理は変数を渡したリクエスト起動で行う（設計書 §10.2）。
      Policies:
        # 最小権限。原本は読むだけ、マスク済みは書くだけ。
        # tid は可変なのでワイルドカードで受ける。
        #   [<prefix>/]<tid>/<infix>/<date>/<lid>/<eid>
        #
        # バケットの ARN は !GetAtt ではなく名前から組み立てる。
        # バケットはイベント通知で MaskFunction を参照しており、ここで !GetAtt を使うと
        # バケット -> 関数 -> バケット の循環参照になる（sam validate が弾く）。
        # バケット名は Env とアカウント ID から決まるので、組み立てても一致する。
        - Statement:
            - Sid: ReadOriginals
              Effect: Allow
              Action: ['s3:GetObject', 's3:GetObjectVersion']
              Resource: !If
                - HasKeyPrefix
                - !Sub 'arn:${AWS::Partition}:s3:::image-mask-${Env}-${AWS::AccountId}/${KeyPrefix}/*/${OriginalInfix}/*'
                - !Sub 'arn:${AWS::Partition}:s3:::image-mask-${Env}-${AWS::AccountId}/*/${OriginalInfix}/*'
            - Sid: WriteMasked
              Effect: Allow
              Action: 's3:PutObject'
              Resource: !If
                - HasKeyPrefix
                - !Sub 'arn:${AWS::Partition}:s3:::image-mask-${Env}-${AWS::AccountId}/${KeyPrefix}/*/${MaskedInfix}/*'
                - !Sub 'arn:${AWS::Partition}:s3:::image-mask-${Env}-${AWS::AccountId}/*/${MaskedInfix}/*'
            - Sid: HeadMaskedForIdempotency
              Effect: Allow
              Action: 's3:GetObject'
              Resource: !If
                - HasKeyPrefix
                - !Sub 'arn:${AWS::Partition}:s3:::image-mask-${Env}-${AWS::AccountId}/${KeyPrefix}/*/${MaskedInfix}/*'
                - !Sub 'arn:${AWS::Partition}:s3:::image-mask-${Env}-${AWS::AccountId}/*/${MaskedInfix}/*'
            - Sid: UseKey
              Effect: Allow
              Action: ['kms:Decrypt', 'kms:GenerateDataKey', 'kms:Encrypt', 'kms:DescribeKey']
              Resource: !GetAtt ImageKey.Arn

  # ---------- CloudWatch アラーム ----------
  MaskStrengthCheckFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'image-mask-${Env}-strength-check-failed'
      AlarmDescription: >
        マスク強度の自己検証に失敗した。出力は行われていないが、
        半径算出やパラメータに問題がある可能性が高い。即調査。
      Namespace: ImageMask
      MetricName: StrengthCheckFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      AlarmActions: [!Ref AlertTopic]
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ValidationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'image-mask-${Env}-validation-errors'
      AlarmDescription: >
        入力が不正で処理できなかった。リトライしても直らない。
        投入元の問題か、対応形式の想定漏れ。ログで対象のキーを確認すること。
      Namespace: ImageMask
      MetricName: ValidationErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      AlarmActions: [!Ref AlertTopic]
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'image-mask-${Env}-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref MaskFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      AlarmActions: [!Ref AlertTopic]
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'image-mask-${Env}-throttles'
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref MaskFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      AlarmActions: [!Ref AlertTopic]
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  S3TriggerEnabled:
    Description: S3 イベント通知で起動するか。false ならリクエスト起動のみ
    Value: !Ref EnableS3Trigger
  AlertTopicArn:
    Description: アラートの通知先。メールは確認リンクの承認が必要
    Value: !Ref AlertTopic
  ImageBucketName:
    Description: 原本とマスク済みを置くバケット
    Value: !Ref ImageBucket
  OriginalKeyPattern:
    Description: 原本のキー
    Value: !If
      - HasKeyPrefix
      - !Sub '${KeyPrefix}/<tid>/${OriginalInfix}/<date>/<lid>/<eid>'
      - !Sub '<tid>/${OriginalInfix}/<date>/<lid>/<eid>'
  MaskedKeyPattern:
    Description: マスク済みのキー
    Value: !If
      - HasKeyPrefix
      - !Sub '${KeyPrefix}/<tid>/${MaskedInfix}/<date>/<lid>/<eid>'
      - !Sub '<tid>/${MaskedInfix}/<date>/<lid>/<eid>'
  FunctionName:
    Description: Lambda 関数名。リクエスト起動のときに指定する
    Value: !Ref MaskFunction
